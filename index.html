<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070a10">
  <meta name="description" content="Gargantua — a black hole rendered live in the browser.">
  <title>Gargantua · Zipeng</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a10'/%3E%3Ccircle cx='17' cy='15' r='7' fill='none' stroke='%23e4e4ec' stroke-width='1.6'/%3E%3Cpath d='M3 22L30 11' stroke='%23d8c4ae' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --void: #070a10;
      --ink: 236, 238, 246;
      /* Apparent radius of the shadow; the fallback is drawn in these units. */
      --rs: min(23.5vh, 25vw);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--void);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: rgb(var(--ink));
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
      background: var(--void);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* The picture rises out of the dark once, when its first frame exists. */
    #gargantua {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 2.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .is-live #gargantua {
      opacity: 1;
    }

    /* Static stand-in for browsers without WebGL. */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: var(--void);
    }

    .fallback-scene {
      position: absolute;
      left: 74.5%;
      top: 42%;
      width: calc(var(--rs) * 13);
      height: calc(var(--rs) * 13);
      margin: calc(var(--rs) * -6.5) 0 0 calc(var(--rs) * -6.5);
      transform: rotate(-21deg);
    }

    /* The haze around the hole. */
    .fallback-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle closest-side,
        rgba(96, 110, 150, 0.55) 0,
        rgba(60, 74, 110, 0.32) 28%,
        rgba(30, 40, 66, 0.14) 52%,
        rgba(10, 14, 24, 0) 80%);
    }

    .fallback-arc,
    .fallback-blade {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Misty shadow, photon ring, then the lensed far side of the disk. */
    .fallback-arc {
      width: calc(var(--rs) * 4.4);
      height: calc(var(--rs) * 4.4);
      border-radius: 50%;
      background: radial-gradient(circle closest-side,
        #9395aa 0, #a3a5b9 40%,
        #e6e6ec 45.2%,
        #babbcb 47%,
        #dedee6 50%, #dedee6 66%,
        rgba(190, 188, 202, 0.72) 72%,
        rgba(128, 132, 158, 0.34) 82%,
        rgba(70, 80, 112, 0) 100%);
    }

    /* The near side of the disk, seen almost edge-on: white across the hole,
       fraying into a wing of dust on the left. */
    .fallback-blade {
      top: 51.2%;
      width: 100%;
      height: calc(var(--rs) * 0.62);
      background: linear-gradient(90deg,
        rgba(60, 44, 30, 0) 16%,
        rgba(118, 92, 68, 0.75) 26%,
        #b29a82 32%,
        #dcd6d2 37%,
        #e0e0e8 42%, #e0e0e8 100%);
      -webkit-mask-image: linear-gradient(rgba(0, 0, 0, 0), #000 36%, #000 64%, rgba(0, 0, 0, 0));
      mask-image: linear-gradient(rgba(0, 0, 0, 0), #000 36%, #000 64%, rgba(0, 0, 0, 0));
    }

    .no-webgl #gargantua {
      display: none;
    }

    .no-webgl .fallback {
      display: block;
    }

    .caption {
      position: fixed;
      left: clamp(28px, 6vw, 96px);
      bottom: clamp(28px, 7.5vh, 84px);
      z-index: 1;
      max-width: min(520px, 84vw);
      pointer-events: none;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      animation: caption-in 2s cubic-bezier(0.22, 0.61, 0.36, 1) 1.1s both;
    }

    .caption-title {
      margin: 0;
      color: rgba(var(--ink), 0.94);
      font-size: clamp(24px, 2.5vw, 38px);
      font-weight: 300;
      letter-spacing: 0.36em;
      line-height: 1;
      text-transform: uppercase;
    }

    .caption-line {
      margin: 1.15em 0 0;
      color: rgba(var(--ink), 0.52);
      font-size: clamp(13px, 1.02vw, 15.5px);
      font-weight: 400;
      letter-spacing: 0.045em;
      line-height: 1.6;
    }

    @keyframes caption-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 760px) {
      .caption-title {
        letter-spacing: 0.28em;
      }

      .fallback-scene {
        left: 60%;
        top: 36%;
        transform: rotate(-34deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gargantua {
        transition: none;
      }

      .caption {
        animation: none;
      }
    }
  </style>
  <noscript>
    <style>
      #gargantua { display: none; }
      .fallback { display: block; }
    </style>
  </noscript>
</head>
<body>
  <canvas id="gargantua" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true">
    <div class="fallback-scene"><i class="fallback-arc"></i><i class="fallback-blade"></i></div>
  </div>

  <main class="caption">
    <h1 class="caption-title">Gargantua</h1>
    <p class="caption-line">Light bends. Time slows. Nothing escapes.</p>
  </main>

  <script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
  </script>

  <!-- Disk material: rendered every frame into an (azimuth x log-radius) texture
       with mipmaps, so the ray tracer can sample it filtered at any scale. -->
  <script id="fs-disk" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uSize;
uniform float uTime;
uniform vec4 uTexA;   // gas: contrast of the broad, medium and fine streaks; brightness of threads
uniform vec4 uTexB;   // spiral pitch (log-radius per turn); dust: contrast of clouds and clumps, brightness of strokes

const float TAU = 6.28318530717959;
const float R_IN = 1.8;
const float R_OUT = 14.0;
const float LOG_SPAN = 2.0512707;   // log(R_OUT / R_IN): texture rows are uniform in log-radius

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

// Gradient noise on a lattice that closes around the ring after `py` cells
// and is sheared into a trailing spiral: one turn shifts it by `arms` cells
// in radius, and the lattice keys follow, so the pattern has no seam.
float gnoise(vec2 p, float py, float arms, float seed) {
  vec2 i = floor(p);
  vec2 f = p - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float w0 = floor((i.y + 0.5) / py);
  float w1 = floor((i.y + 1.5) / py);
  vec2 k0 = vec2(i.x - arms * w0 + seed, i.y - w0 * py);
  vec2 k1 = vec2(i.x - arms * w1 + seed, i.y + 1.0 - w1 * py);
  vec2 g00 = hash22(k0) * 2.0 - 1.0;
  vec2 g10 = hash22(k0 + vec2(1.0, 0.0)) * 2.0 - 1.0;
  vec2 g01 = hash22(k1) * 2.0 - 1.0;
  vec2 g11 = hash22(k1 + vec2(1.0, 0.0)) * 2.0 - 1.0;
  float n = mix(mix(dot(g00, f), dot(g10, f - vec2(1.0, 0.0)), u.x),
                mix(dot(g01, f - vec2(0.0, 1.0)), dot(g11, f - vec2(1.0, 1.0)), u.x), u.y);
  return clamp(0.5 + 0.9 * n, 0.0, 1.0);
}

// Noise with `fr` cells per unit of log-radius across the flow and `py`
// cells around the ring along it, wound into a trailing spiral. A scale
// the texture cannot resolve is faded out instead of aliasing.
float flow(float lr, float psi, float fr, float py, float seed) {
  float arms = floor(fr * uTexB.x + 0.5);
  float seen = smoothstep(1.2, 2.6, min(uSize.y / (fr * LOG_SPAN), uSize.x / py));
  return 0.5 + (gnoise(vec2(lr * fr + arms * psi / TAU, psi * py / TAU), py, arms, seed) - 0.5) * seen;
}

// Light of the hot gas, as zero-mean log2 brightness: long silky streaks at
// three scales, each many times longer than wide. `threads` are hairlines
// along the level sets of two more fields, lit in stretches.
float streaks(float lr, float psi, float seed, out float threads) {
  float broad = 0.5 * (flow(lr, psi, 3.0, 2.0, seed + 3.0) + flow(lr, psi, 7.0, 3.0, seed + 11.0)) - 0.5;
  float mid = 0.40 * flow(lr, psi, 29.0, 5.0, seed + 23.0) + 0.33 * flow(lr, psi, 61.0, 7.0, seed + 37.0)
            + 0.27 * flow(lr, psi, 113.0, 9.0, seed + 43.0) - 0.5;
  float fine = 0.55 * flow(lr, psi, 149.0, 9.0, seed + 53.0) + 0.45 * flow(lr, psi, 197.0, 11.0, seed + 71.0) - 0.5;
  float ta = 1.0 - abs(2.0 * flow(lr, psi, 53.0, 3.0, seed + 97.0) - 1.0);
  float tb = 1.0 - abs(2.0 * flow(lr, psi, 113.0, 4.0, seed + 113.0) - 1.0);
  float lit = smoothstep(0.42, 0.75, flow(lr, psi, 6.0, 13.0, seed + 131.0));
  threads = (pow(ta, 12.0) + 0.7 * pow(tb, 7.0)) * lit;
  return uTexA.x * broad + uTexA.y * mid + uTexA.z * fine;
}

// Dust, as zero-mean log2 density. It is turbulent, not combed: clouds and
// clumps about as long as they are wide. `motes` are dense knots at five
// sizes, as round as the clumps. Seen almost edge-on, all of it flattens
// into the short strokes of a dust bank.
float dust(float lr, float psi, float seed, out float motes) {
  float cloud = 0.55 * flow(lr, psi, 3.0, 13.0, seed + 151.0) + 0.45 * flow(lr, psi, 7.0, 29.0, seed + 173.0) - 0.5;
  float clump = 0.55 * flow(lr, psi, 17.0, 97.0, seed + 191.0) + 0.45 * flow(lr, psi, 43.0, 251.0, seed + 211.0) - 0.5;
  motes = 0.26 * smoothstep(0.54, 0.66, flow(lr, psi, 13.0, 61.0, seed + 229.0))
        + 0.26 * smoothstep(0.54, 0.66, flow(lr, psi, 21.0, 101.0, seed + 251.0))
        + 0.22 * smoothstep(0.54, 0.66, flow(lr, psi, 34.0, 163.0, seed + 263.0))
        + 0.16 * smoothstep(0.54, 0.66, flow(lr, psi, 55.0, 263.0, seed + 281.0))
        + 0.10 * smoothstep(0.54, 0.66, flow(lr, psi, 89.0, 431.0, seed + 293.0));
  return uTexB.y * cloud + uTexB.z * clump;
}

float omegaAt(float r) {
  return 1.25 * pow(r, -1.5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float phi = (uv.x - 0.5) * TAU;
  float lr = uv.y * LOG_SPAN;
  float r = R_IN * exp(lr);

  // Keplerian differential rotation. Two layers are cross-faded so the shear
  // never winds up without bound; each is invisible while it resets.
  float omega = omegaAt(r);
  float omega0 = omegaAt(5.0);
  float P = 48.0;
  float tA = fract(uTime / P);
  float tB = fract(tA + 0.5);
  float wA = 0.5 - 0.5 * cos(tA * TAU);
  float wB = 1.0 - wA;
  float base = phi - mod(omega0 * uTime, TAU);
  float psiA = base - (omega - omega0) * (tA - 0.5) * P;
  float psiB = base - (omega - omega0) * (tB - 0.5) * P + 2.1;
  float thA, thB;
  float xsA = streaks(lr, psiA, 0.0, thA);
  float xsB = streaks(lr, psiB, 59.0, thB);
  float moA, moB;
  float xdA = dust(lr, psiA, 0.0, moA);
  float xdB = dust(lr, psiB, 59.0, moB);
  // The zero-mean fields are blended at constant variance, so the contrast
  // does not pulse with the cross-fade.
  float nrm = inversesqrt(wA * wA + wB * wB);
  float e = exp2((wA * xsA + wB * xsB) * nrm) + uTexA.w * (wA * thA + wB * thB);
  float rho = exp2((wA * xdA + wB * xdB) * nrm) * (1.0 + uTexB.w * max(0.2 + (wA * (moA - 0.2) + wB * (moB - 0.2)) * nrm, 0.0));
  float tintA = 0.6 * flow(lr, psiA, 67.0, 5.0, 277.0) + 0.4 * flow(lr, psiA, 149.0, 7.0, 293.0) - 0.5;
  float tintB = 0.6 * flow(lr, psiB, 67.0, 5.0, 336.0) + 0.4 * flow(lr, psiB, 149.0, 7.0, 352.0) - 0.5;
  float tint = 0.5 + 1.8 * (wA * tintA + wB * tintB) * nrm;
  // Square-root encoding keeps precision in the dim gaps.
  gl_FragColor = vec4(sqrt(clamp(e * 0.25, 0.0, 1.0)), sqrt(clamp(rho * 0.125, 0.0, 1.0)), clamp(tint, 0.0, 1.0), 1.0);
}
  </script>

  <script id="fs-trace" type="x-shader/x-fragment">
precision highp float;
precision highp int;
varying vec2 vUv;
uniform vec2 uRes;
uniform vec2 uJitter;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform vec3 uCamFwd;
uniform float uFocal;
uniform vec2 uCenter;
uniform float uEnc;
uniform int uMaxSteps;
uniform float uPxPerRad;
uniform vec3 uRingBand;   // impact parameter: start of the supersampled band, end of its 4x4 part, end of its 2x2 part
uniform sampler2D uDisk;
uniform vec2 uDiskSize;
uniform vec4 uGas;        // hot gas: brightness, how fast its depth falls with radius, depth at the flux peak, glow above the plane
uniform vec2 uStrand;     // how much the gas breaks up into separate strands as it thins out; how far their colours spread
uniform vec4 uGasT;       // its colour: temperature (K) where opaque, slope as it thins, saturation; how fast its brightness falls with radius
uniform vec4 uDust;       // dust sheet: optical depth, radius where it starts, radius of full depth, radius of the rim
uniform vec4 uDustL;      // its light: brightness near the hole, radius where that halves, how fast it falls beyond, how much denser dust is brighter
uniform vec4 uDustT;      // density offset of the sheet, temperature (K), saturation, softness (mip bias)
uniform vec4 uDustS;      // shading: relief, self-shadow, how much it follows the streaks of the gas; how much the sheet thins towards its rim
uniform vec3 uShift;      // strength of the Doppler change in brightness and in colour; radius where the gas ends
uniform vec4 uBank;       // dust is thick on one side: direction of that side (xz), share left elsewhere, light scattered backward
uniform vec4 uFog;        // thin glowing gas around the hole: brightness and radius of a dense core, then of a wide halo
uniform float uStars;
uniform float uEinstein;  // Einstein angle of the hole for the far sky, radians
uniform vec4 uPlanet;     // xyz centre, w radius (world units)
uniform vec3 uGalaxy;     // direction of a faint background galaxy
uniform vec3 uMwNormal;   // Milky Way plane normal
uniform vec3 uMwCentre;   // direction of the galactic centre, in that plane

// Units: Schwarzschild radius rs = 1 (M = 0.5). Black hole at the origin,
// accretion disk in the y = 0 plane, camera far out and a little above it.
const float PI = 3.14159265358979;
const float TAU = 6.28318530717959;
const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
const float R_IN = 1.8;
const float R_OUT = 14.0;
const float LOG_SPAN = 2.0512707;   // log(R_OUT / R_IN): texture rows are uniform in log-radius
const float R_ESC = 18.0;           // the path is integrated inside this radius only
const vec3 FOG_CORE = vec3(0.88, 0.84, 1.00);
const vec3 FOG_HALO = vec3(0.64, 0.80, 1.10);
const int MAX_STEPS = 900;

#ifdef ES3
#define STEP_BOUND uMaxSteps
#define DISK_LOD(uv, l) textureLod(uDisk, uv, l)
#else
#define STEP_BOUND MAX_STEPS
#ifdef HAS_LOD
#define DISK_LOD(uv, l) texture2DLodEXT(uDisk, uv, l)
#else
#define DISK_LOD(uv, l) texture2D(uDisk, uv)
#endif
#endif

// Without float render targets the light is stored in 8 bits, on a
// fourth-root curve so the dark sky keeps enough steps.
vec3 enc(vec3 c) {
  return uEnc > 0.5 ? sqrt(sqrt(max(c, 0.0) / 12.0)) : c;
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float hash31(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}

// 3D value noise on directions: no seams, unlike the octahedral star map.
float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm3(vec3 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise3(p);
    norm += a;
    p = p * 2.03 + vec3(17.1, 31.7, 7.3);
    a *= 0.5;
  }
  return v / norm;
}

// Colour of a blackbody at unit luminance, white at 6500 K: a Wien fit
// through the effective wavelengths of the sRGB primaries.
vec3 blackbody(float t) {
  float u = 1.0 / t - 1.0 / 6500.0;
  vec3 c = exp(vec3(0.0, -4374.0, -10680.0) * u);
  return c / dot(c, LUMA);
}

// Radial flux of a thin relativistic disk: zero at the innermost stable
// orbit, a peak just outside it, r^-3 far out. Normalised to a peak of 1.
float diskFlux(float r) {
  float x = r / R_IN;
  return max(1.0 - inversesqrt(x), 0.0) / (x * x * x) * 17.65;
}

// Redshift of gas on a circular orbit, exact for Schwarzschild: gravitational
// and Doppler shift together. `lam` is the photon's angular momentum about
// the spin axis; it is positive where the gas moves towards the camera.
float redshift(float r, float lam) {
  return sqrt(1.0 - 1.5 / r) / max(1.0 - sqrt(0.5 / (r * r * r)) * lam, 0.3);
}

vec2 diskUv(float r, float phi) {
  return vec2(phi / TAU + 0.5, log(r / R_IN) / LOG_SPAN);
}

float sq(float x) {
  return x * x;
}

// Light of the disk where a ray crosses its plane, premultiplied by its
// opacity (alpha). s: path length so far. sweep: angle the ray has travelled
// around the hole (lensed images are squeezed, so they need coarser samples).
//
// The disk has two parts. Hot gas glows by itself, in long silky streaks,
// and thins out within a few radii. Further out a sheet of dust lies over
// it and only scatters the light of the centre. From a low angle the dust
// hides the gas; from higher up, as on the lensed far side, the gas shines
// through it, reddened.
vec4 diskSample(vec3 hit, vec3 dir, float s, float sweep, float lam) {
  float r = length(hit.xz);
  vec2 rhat = hit.xz / r;
  vec2 uv = diskUv(r, atan(hit.z, hit.x));

  // Footprint of the pixel on the plane: one pixel wide across the ray and
  // stretched by 1/|cos| along it. Eight taps cover the long axis, so fine
  // streaks survive at grazing angles.
  float squeeze = max(sweep - 1.2, 0.0);
  float foot = s * 2.0 / (uFocal * uRes.y) * (1.0 + 0.25 * squeeze * squeeze);
  vec2 dh = dir.xz / max(length(dir.xz), 1e-4);
  float cr = dot(dh, rhat);
  float cr2 = cr * cr;
  float inv = 1.0 / max(dir.y * dir.y, 0.01);
  float footR = foot * sqrt(cr2 * inv + 1.0 - cr2);
  float footP = foot * sqrt((1.0 - cr2) * inv + cr2);
  float lodR = log2(max(footR * uDiskSize.y / (r * LOG_SPAN), 1e-4));
  float lodP = log2(max(footP * uDiskSize.x / (TAU * r), 1e-4));
  // Images of second and higher order pack the whole disk into a hairline:
  // they take the mean light of the disk, or the photon ring would sparkle.
  float lod = max(max(min(lodR, lodP), max(lodR, lodP) - 3.0), 0.0) + uDustT.w + smoothstep(3.6, 4.6, sweep) * 6.0;
  vec2 axis = lodR > lodP ? vec2(0.0, exp2(lodR) / uDiskSize.y)
                         : vec2(exp2(lodP) / uDiskSize.x, 0.0);
  vec4 tx = (DISK_LOD(uv - axis * 0.4375, lod) + DISK_LOD(uv - axis * 0.3125, lod)
           + DISK_LOD(uv - axis * 0.1875, lod) + DISK_LOD(uv - axis * 0.0625, lod)
           + DISK_LOD(uv + axis * 0.0625, lod) + DISK_LOD(uv + axis * 0.1875, lod)
           + DISK_LOD(uv + axis * 0.3125, lod) + DISK_LOD(uv + axis * 0.4375, lod)) * 0.125;
  float e = sq(tx.r) * 4.0;
  float rho = sq(tx.g) * 8.0;

  float flux = diskFlux(r);
  float g = redshift(r, lam);
  float slant = 1.0 / max(abs(dir.y), 0.06);
  // Both parts end on the same ragged rim.
  float rim = 1.0 - smoothstep(0.955, 1.0, r * (0.97 + 0.06 * tx.b) / uDust.w);

  // Hot gas. It glows almost as bright far out as near the hole, but its
  // depth falls off fast. Near the hole it is opaque: plain white, without
  // structure. Further out it is sheer, and shows only where the view runs
  // through a lot of it: along its strands, and on the near side, which is
  // seen edge-on.
  // It also thins out just above its inner edge, which leaves a dark gap
  // for the photon ring to stand in.
  float reach = (1.0 - smoothstep(0.5 * uShift.z, uShift.z, r)) * smoothstep(1.06, 1.3, r / R_IN);
  float strand = pow(e, 1.0 + uStrand.x * smoothstep(3.0, 7.0, r));
  float aGas = 1.0 - exp(-uGas.z * pow(flux, uGas.y) * strand * reach * rim * slant);
  // Opaque gas is white. Each sheer strand takes a colour of its own, from
  // salmon to a pale blue. Approaching gas is brighter and bluer.
  float T = uGasT.x * pow(max(aGas, 1e-3), uGasT.y) * pow(g, uShift.y) * (1.0 + uStrand.y * (tx.b - 0.5) * (1.0 - aGas));
  vec3 gas = mix(vec3(1.0), blackbody(clamp(T, 1500.0, 12000.0)), uGasT.z) * (uGas.x * pow(flux, uGasT.w) * pow(g, 4.0 * uShift.x));

  // Dust: none near the hole, then a sheet whose depth follows its density.
  // Most of it lies on one side of the hole.
  float sheet = smoothstep(uDust.y, uDust.z, r) * rim * (1.0 - uDustS.w * smoothstep(0.8, 1.0, r / uDust.w))
              * mix(uBank.z, 1.0, smoothstep(0.1, 0.75, dot(rhat, uBank.xy)));
  float tauD = uDust.x * sheet * max(rho + uDustT.x, 0.0) * slant;
  float veil = 1.0 - exp(-tauD);
  // It is lit from the centre: the side of a clump that faces the hole is
  // bright and its far side in shade, and dense dust nearer the hole casts
  // a soft shadow outward.
  float dv = 1.5 * exp2(max(lodR, 0.0) + uDustT.w) / uDiskSize.y;
  float rhoOut = sq(DISK_LOD(uv + vec2(0.0, dv), lod).g);
  float rhoIn = sq(DISK_LOD(uv - vec2(0.0, dv), lod).g);
  float relief = clamp(1.0 + uDustS.x * (rhoOut - rhoIn) / (rhoOut + rhoIn + 0.06), 0.2, 2.2);
  float inner = sq(DISK_LOD(uv - vec2(0.0, 0.04), lod + 3.0).g) * 8.0;
  float shade = clamp(1.0 - uDustS.y * (inner - 1.2), 0.3, 1.5);
  // Dust scatters forward: it is bright where the light of the centre
  // passes through it towards the camera, dim where it has to turn back.
  float phase = mix(uBank.w, 1.0, smoothstep(-0.2, 0.7, -dot(rhat, dir.xz)));
  float scat = uDustL.x / (1.0 + pow(r / uDustL.y, uDustL.z)) * pow(rho * 0.5, uDustL.w) * mix(1.0, e, uDustS.z) * relief * shade * phase;
  float Td = uDustT.y * (0.9 + 0.2 * tx.b) * pow(clamp(scat * 2.5, 0.05, 2.0), 0.05);
  vec3 dustLight = mix(vec3(1.0), blackbody(Td), uDustT.z) * scat;

  // Dust reddens what shines through it. Images beyond the lensing ring are
  // thinner than any pixel and are left out.
  vec3 through = exp(-tauD * vec3(0.75, 1.0, 1.35));
  vec3 rgb = dustLight * veil + gas * aGas * through;
  return vec4(rgb * (1.0 - smoothstep(5.6, 6.4, sweep)), 1.0 - (1.0 - aGas) * (1.0 - veil));
}

vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

vec3 octaDecode(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  vec3 d = vec3(uv.x, 1.0 - abs(uv.x) - abs(uv.y), uv.y);
  float t = max(-d.y, 0.0);
  d.x += d.x >= 0.0 ? -t : t;
  d.z += d.z >= 0.0 ? -t : t;
  return normalize(d);
}

// A faint Milky Way: unresolved starlight in a band along the galactic plane,
// wider and warmer towards the galactic centre, broken by a dark dust rift
// and scattered dust clouds. `dens` scales the resolved star density.
vec3 milkyWay(vec3 d, out float dens) {
  float lat = dot(d, uMwNormal);
  float lon = atan(dot(d, cross(uMwNormal, uMwCentre)), dot(d, uMwCentre));
  float bulge = exp(-lon * lon / 0.45);
  float width = 0.075 + 0.085 * bulge;
  float band = exp(-lat * lat / (width * width));
  dens = 0.0;
  if (band < 0.004) return vec3(0.0);
  float n1 = fbm3(d * 7.0, 4);
  float n2 = fbm3(d * 19.0 + 4.0, 3);
  float riftLat = lat + 0.02 * (fbm3(d * 11.0 + 9.0, 3) - 0.5);
  float rift = exp(-riftLat * riftLat / (0.16 * width * width)) * smoothstep(0.32, 0.58, n1);
  float clouds = smoothstep(0.55, 0.75, n2) * 0.55 * band;
  float dust = clamp(0.85 * rift + clouds, 0.0, 0.92);
  dens = band * (0.45 + 0.55 * n1) * (1.0 - 0.8 * dust);
  vec3 tint = mix(vec3(0.62, 0.70, 0.88), vec3(1.00, 0.86, 0.68), 0.8 * bulge);
  return tint * band * (0.3 + 0.7 * n1 * n1) * (1.0 - dust) * (0.7 + 0.6 * bulge);
}


// One layer of stars, at most one per sky cell. Counts follow a power law
// in brightness, N(>F) ~ F^-slope from bMin up to bMax, so most stars are
// barely visible pinpoints and a few dominate. Colour follows temperature;
// density rises in the Milky Way (`mw`) and in loose clusters.
vec3 starLayer(vec3 d, vec2 unit, mat3 lens, float cells, float dens, float bMin, float bMax, float slope, float seed, float mw) {
  vec2 uv = unit * cells;
  vec2 ci = floor(uv);
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o + seed;
      vec3 h = hash23(c);
      // Per star, not per pixel: every pixel must agree on whether it exists.
      float clump = vnoise(c / 7.0 + seed * 0.37);
      float dn = dens * (0.35 + 1.3 * smoothstep(0.3, 0.8, clump)) * (1.0 + 4.0 * mw);
      if (h.z < dn) {
        // Offset to the star on the sky, turned into screen pixels: the lens
        // stretches the sky around the hole, and the star's image stays round.
        vec3 diff = octaDecode((ci + o + h.xy) / cells) - d;
        vec2 sp = vec2(dot(diff, lens[0]), dot(diff, lens[1])) * lens[2].xy * uPxPerRad;
        float d2 = dot(sp, sp);
        float br = min(bMin * pow(max(hash21(c + 19.7), 1e-4), -1.0 / slope), bMax);
        float tk = 2800.0 + 9000.0 * pow(hash21(c + 5.1), 1.4);
        float halo = 0.035 * exp(-d2 / 16.0) * smoothstep(0.08, 0.8, br);
        col += mix(vec3(1.0), blackbody(tk), 0.8) * (br * (exp(-d2 / 1.3) + halo));
      }
    }
  }
  return col;
}

// A distant spiral seen at an angle: exponential disk with two faint arms, a
// warm bulge and a dust lane on the near side. Sizes are in milliradians.
vec3 galaxy(vec3 d) {
  if (dot(d, uGalaxy) < 0.995) return vec3(0.0);
  vec3 ga = normalize(cross(uGalaxy, vec3(0.0, 1.0, 0.0)));
  vec3 gb = cross(uGalaxy, ga);
  vec2 g = vec2(dot(d, ga), dot(d, gb)) * 1000.0;
  g = vec2(g.x * 0.80 + g.y * 0.60, -g.x * 0.60 + g.y * 0.80) * 5.0;
  vec2 q = vec2(g.x, g.y / 0.34);
  float rr = length(q);
  float arms = 0.6 + 0.4 * cos(2.0 * (atan(q.y, q.x) - 1.7 * log(rr + 1.0)));
  float lane = 1.0 - 0.5 * exp(-pow((g.y + 1.0) / 0.9, 2.0)) * smoothstep(2.0, 8.0, abs(g.x));
  return vec3(0.74, 0.80, 1.00) * (exp(-rr / 12.0) * arms * lane * 0.034)
       + vec3(1.00, 0.88, 0.72) * (exp(-dot(g, g) / 9.0) * 0.05);
}

// The sky in direction `d`, reached by a ray that was bent by `turn` radians.
// Near the hole the sky is stretched into arcs around the Einstein ring and
// lies deep in the glare of the disk, so starlight thins out with the bending.
vec3 starfield(vec3 d, float turn) {
  float fade = mix(0.10, 1.0, 1.0 - smoothstep(0.10, 0.36, turn)) * (1.0 - smoothstep(1.7, 2.7, turn));
  vec2 unit = octa(d);
  float mwDens;
  vec3 mw = milkyWay(d, mwDens);

  // The hole as a point lens: a source at angle beta from the axis appears
  // at theta, stretched by theta/beta around the hole and squeezed along the
  // radius. Columns: tangential and radial unit vectors, the two factors.
  vec3 axis = -normalize(uCamPos);
  vec3 tn = cross(axis, d);
  tn = dot(tn, tn) > 1e-8 ? normalize(tn) : normalize(cross(d, vec3(0.0, 1.0, 0.0)));
  float beta = acos(clamp(dot(d, axis), -1.0, 1.0));
  float root = sqrt(beta * beta + 4.0 * uEinstein * uEinstein);
  mat3 lens = mat3(tn, cross(d, tn),
                   vec3(min((beta + root) / (2.0 * max(beta, 1e-3)), 6.0), 0.5 + 0.5 * beta / root, 0.0));

  // Field stars (a few bright, many faint) and a dense layer of barely
  // resolved ones that gives the sky its texture.
  vec3 col = starLayer(d, unit, lens, 180.0, 0.30, 0.0040, 1.2, 1.25, 0.0, mwDens)
           + starLayer(d, unit, lens, 520.0, 0.15, 0.0020, 0.03, 1.6, 31.0, mwDens);
  col = (col * uStars + mw * 0.006 + galaxy(d) * 2.0) * fade;

  // Space itself: almost black, with the faintest cool cast.
  float n1 = fbm3(d * 3.0 + 1.7, 2);
  col += vec3(0.0012, 0.0021, 0.0040) * (0.6 + 0.8 * n1);
  return col;
}

vec3 rayDir(vec2 pixelOffset) {
  vec2 ndc = ((gl_FragCoord.xy + uJitter + pixelOffset) / uRes) * 2.0 - 1.0 - uCenter;
  float aspect = uRes.x / uRes.y;
  return normalize(uCamFwd * uFocal + uCamRight * (ndc.x * aspect) + uCamUp * ndc.y);
}

// An ocean world. Lit by the hot inner disk, a broad source, so the
// terminator is soft; faintly lit from the disk plane on the side facing it.
// Cloud bands drift as it spins, the ocean glints, and a thin atmosphere
// brightens the limb and rings the planet when it is backlit.
vec3 planetShade(vec3 hp, vec3 rd) {
  vec3 n = normalize(hp - uPlanet.xyz);
  vec3 toHole = normalize(-uPlanet.xyz);
  float ndl = dot(n, toHole);
  float key = pow(clamp((ndl + 0.22) / 1.22, 0.0, 1.0), 1.5);
  float fill = clamp(n.y * (uPlanet.y > 0.0 ? -1.0 : 1.0), 0.0, 1.0) * 0.18;
  vec3 axis = normalize(vec3(0.34, 1.0, 0.0));
  float spin = uTime * 0.06;
  vec3 sn = n * cos(spin) + cross(axis, n) * sin(spin) + axis * dot(axis, n) * (1.0 - cos(spin));
  float clouds = fbm3(vec3(sn.x * 3.0, dot(sn, axis) * 9.0, sn.z * 3.0) + 5.0, 4);
  float cover = smoothstep(0.50, 0.72, clouds);
  vec3 albedo = mix(vec3(0.075, 0.105, 0.14), vec3(0.50, 0.52, 0.55), cover);
  vec3 light = vec3(1.00, 0.93, 0.82);
  vec3 c = albedo * light * (1.35 * key + fill);
  vec3 hv = normalize(toHole - rd);
  c += light * (pow(max(dot(n, hv), 0.0), 90.0) * 1.2 * (1.0 - cover) * step(0.0, ndl));
  float limb = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
  float back = pow(max(dot(rd, toHole), 0.0), 6.0);
  c += vec3(0.42, 0.60, 1.00) * limb * (0.05 + 0.55 * key + 1.4 * back);
  return c;
}

vec3 traceRay(vec3 dir, out float cover) {
  cover = 0.0;
  vec3 p = uCamPos;
  vec3 v = dir;
  float cd = dot(p, v);
  float b2 = dot(p, p) - cd * cd;
  float b = sqrt(max(b2, 0.0));
  float planetDist = length(uPlanet.xyz);

  vec3 col = vec3(0.0);
  float T = 1.0;

  if (b > max(R_OUT, planetDist + uPlanet.w) + 0.3) {
    // The ray meets nothing: its deflection is applied in closed form, to
    // second order, from the camera's finite distance.
    float L = -cd;
    vec3 q = p + v * L;
    vec3 n = -q / b;
    float frac = 0.5 + L * (2.0 * L * L + 3.0 * b2) / (4.0 * pow(b2 + L * L, 1.5));
    float alpha = (2.0 / b + 2.945 / b2) * frac;
    col = starfield(normalize(v * cos(alpha) + n * sin(alpha)), alpha);
  } else {
    float h2 = b2;
    // Conserved along the path; decides how the orbiting gas is shifted.
    float lam = p.z * v.x - p.x * v.z;
    bool escaped = false;
    float s = 0.0;
    float sweep = 0.0;
    // The camera is far out. The ray runs straight to the sphere where the
    // integration starts: on the way it bends by less than a milliradian if
    // it comes near the hole at all.
    float rc2 = dot(p, p);
    if (rc2 > R_ESC * R_ESC && cd < 0.0) {
      s = -cd - sqrt(R_ESC * R_ESC - b2);
      sweep = asin(b / R_ESC) - asin(b * inversesqrt(rc2));
      p += v * s;
    }
    vec3 prev = p;
    for (int i = 0; i < STEP_BOUND; i++) {
#ifndef ES3
      if (i >= uMaxSteps) break;
#endif
      float r2 = dot(p, p);
      float r = sqrt(r2);
      // Captured, or still circling after more than a full turn: no light.
      if (r2 < 1.0 || sweep > 7.0) break;
      if (r > R_ESC && dot(p, v) > 0.0) { escaped = true; break; }

      // Velocity Verlet: second-order accurate, so orbits near the photon
      // sphere keep their phase and the shadow edge stays smooth.
      float dt = clamp(r * 0.035, 0.01, 0.7);
      // Thin hot gas around the hole glows faintly: this is the haze of the
      // picture. It lies in the scene, so the disk hides what is behind it.
      // Light from deep in the well arrives dimmed.
      col += T * (FOG_CORE * (uFog.x * exp(-r2 / (uFog.y * uFog.y))) + FOG_HALO * (uFog.z * exp(-r2 / (uFog.w * uFog.w))))
           * (sq(1.0 - 1.0 / r) * dt);
      vec3 a = -1.5 * h2 * p / (r2 * r2 * r);
      vec3 pn = p + v * dt + a * (0.5 * dt * dt);
      float rn2 = max(dot(pn, pn), 0.04);
      vec3 an = -1.5 * h2 * pn / (rn2 * rn2 * sqrt(rn2));
      v += (a + an) * (0.5 * dt);
      p = pn;
      s += dt;
      sweep += b * dt / r2;

      // The planet is tested against this step of the bent ray, so its image
      // is lensed like everything else near the hole. Only steps inside the
      // thin shell of its orbital radius can reach it.
      float tPlanet = 2.0;
      vec3 seg = p - prev;
      vec3 mid = (prev + p) * 0.5 - uPlanet.xyz;
      if (abs(r - planetDist) < uPlanet.w + 1.5 * dt && dot(mid, mid) < (uPlanet.w + dt) * (uPlanet.w + dt)) {
        vec3 oc = prev - uPlanet.xyz;
        float qa = dot(seg, seg);
        float qb = dot(oc, seg);
        float disc = qb * qb - qa * (dot(oc, oc) - uPlanet.w * uPlanet.w);
        if (disc > 0.0) {
          float th = (-qb - sqrt(disc)) / qa;
          if (th >= 0.0 && th <= 1.0) tPlanet = th;
        }
      }

      if (prev.y * p.y < 0.0 && prev.y / (prev.y - p.y) < tPlanet) {
        float t = prev.y / (prev.y - p.y);
        vec3 hit = mix(prev, p, t);
        float rh = length(hit.xz);
        if (rh > R_IN && rh < R_OUT) {
          vec4 e = diskSample(hit, normalize(v), s, sweep, lam);
          col += T * e.rgb;
          T *= 1.0 - e.a;
          if (T < 0.02) break;
        }
      }

      if (tPlanet <= 1.0) {
        col += T * planetShade(mix(prev, p, tPlanet), normalize(v));
        cover = T;
        T = 0.0;
        break;
      }

      // The hot gas also glows a little above and below the plane. That
      // gives the disk body: its edge is soft, not a knife edge.
      float rr = length(p.xz);
      if (uGas.w > 0.0 && rr > R_IN && rr < R_OUT) {
        float H = 0.03 + 0.035 * rr;
        float ay = abs(p.y);
        if (ay < 2.4 * H) {
          float eh = DISK_LOD(diskUv(rr, atan(p.z, p.x)), 4.0).r;
          float fl = diskFlux(rr);
          float depth = uGas.z * pow(fl, uGas.y) * (eh * eh * 4.0) * (1.0 - smoothstep(0.5 * uShift.z, uShift.z, rr));
          float j = uGas.x * pow(fl, uGasT.w) * (1.0 - exp(-depth)) * pow(redshift(rr, lam), 4.0 * uShift.x)
                  * exp(-ay * ay / (H * H)) / (1.7725 * H);
          col += T * (j * uGas.w * dt);
        }
      }
      prev = p;
    }
    if (escaped) {
      // The rest of the bending, from here to infinity, in closed form.
      float vl = length(v);
      vec3 vd = v / vl;
      float be = b / vl;
      float xr = dot(p, vd);
      float tail = (2.0 - xr * (2.0 * xr * xr + 3.0 * be * be) / pow(dot(p, p), 1.5)) / (2.0 * be);
      vd = normalize(vd + normalize(vd * xr - p) * tan(tail));
      col += T * starfield(vd, acos(clamp(dot(dir, vd), -1.0, 1.0)));
    }
  }
  return col;
}

void main() {
  // The photon ring packs nested images of the whole disk into a hairline.
  // Pixels on it take a 4x4 grid of rays, the band next to it a 2x2 grid
  // (on top of the temporal jitter); everything else takes one ray.
  vec3 centre = rayDir(vec2(0.0));
  float cd = dot(uCamPos, centre);
  float b = sqrt(max(dot(uCamPos, uCamPos) - cd * cd, 0.0));
  float side = (b > uRingBand.x && b < uRingBand.y) ? 4.0 : (b > uRingBand.x && b < uRingBand.z) ? 2.0 : 1.0;
  int n = int(side * side);
  vec3 col = vec3(0.0);
  float cover = 0.0;
  for (int k = 0; k < 16; k++) {
    if (k >= n) break;
    float kx = mod(float(k), side);
    float ky = floor(float(k) / side);
    float cv;
    col += traceRay(rayDir((vec2(kx, ky) + 0.5) / side - 0.5), cv);
    cover += cv;
  }
  // Alpha carries the planet coverage to the composite (1 = no planet).
  // In 8 bits, a little noise turns the steps of smooth gradients into
  // grain that the temporal mean smooths out.
  float dither = uEnc > 0.5 ? (hash21(gl_FragCoord.xy + fract(uTime * 7.31) * 113.0) - 0.5) / 255.0 : 0.0;
  gl_FragColor = vec4(enc(col / float(n)) + dither, 1.0 - cover / float(n));
}
  </script>

  <script id="fs-resolve" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uCur;
uniform sampler2D uHist;
uniform float uAlpha;
uniform float uEnc;
uniform vec2 uTexel;
uniform float uAspect;
uniform vec4 uGuard;    // moving planet: guarded stretch from xy to zw (uv)
uniform float uGuardR;  // its half-width in uv height units, 0 = off
uniform float uSeed;    // changes every frame: seed of the dither for 8-bit targets
vec3 dec(vec3 c) { return uEnc > 0.5 ? (c * c) * (c * c) * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(sqrt(max(c, 0.0) / 12.0)) : c; }
void main() {
  vec3 c = dec(texture2D(uCur, vUv).rgb);
  vec3 h = dec(texture2D(uHist, vUv).rgb);
  // Around the moving planet the history is clamped to this frame's local
  // range, so the planet does not drag a ghost trail behind it.
  vec2 pa = (vUv - uGuard.xy) * vec2(uAspect, 1.0);
  vec2 ba = (uGuard.zw - uGuard.xy) * vec2(uAspect, 1.0);
  float along = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  float g = uGuardR > 0.0 ? 1.0 - smoothstep(uGuardR, uGuardR * 2.0, length(pa - ba * along)) : 0.0;
  if (g > 0.0) {
    vec3 lo = c;
    vec3 hi = c;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec3 sn = dec(texture2D(uCur, vUv + uTexel * vec2(float(i), float(j))).rgb);
        lo = min(lo, sn);
        hi = max(hi, sn);
      }
    }
    h = mix(h, clamp(h, lo, hi), g);
  }
  float aCur = texture2D(uCur, vUv).a;
  float aHist = texture2D(uHist, vUv).a;
  vec3 p3 = fract(vec3(gl_FragCoord.xyx) * 0.1031 + uSeed);
  p3 += dot(p3, p3.yzx + 33.33);
  float dither = uEnc > 0.5 ? (fract((p3.x + p3.y) * p3.z) - 0.5) / 255.0 : 0.0;
  gl_FragColor = vec4(enc(mix(h, c, uAlpha)) + dither, mix(aHist, aCur, uAlpha));
}

uniform float uEnc;

      up: [-right0[0] * sr + up0[0] * cr, -right0[1] * sr + up0[1] * cr, -right0[2] * sr + up0[2] * cr]
    };
  }

  // Framing by aspect ratio. A wide frame has the hole on the right, its
  // arc cropped by the top edge, and the dust wing falling towards the
  // caption. A tall frame brings the hole near the centre and turns the
  // disk further onto the diagonal.
  function composition(aspect) {
    var wide = smooth01((aspect - 0.8) / 0.55);
    var hole = Math.min(look.holeTall * aspect, Math.max(look.hole, Math.min(1.125 * look.hole, 0.625 * look.hole * aspect)));
    return {
      hole: hole,
      focal: hole / Math.tan(Math.asin(2.598 / look.dist)),
      cx: look.cxTall + (look.cx - look.cxTall) * wide,
      cy: look.cyTall + (look.cy - look.cyTall) * wide,
      roll: (look.rollTall + (look.roll - look.rollTall) * wide) * deg
    };
  }

  // Sky features are fixed in the world and placed from the resting 16:10
  // view: a faint Milky Way across the upper-left sky, a small galaxy in it.
  var restComp = composition(1.6);
  var rest = cameraBasis(look.incl * deg, 0, restComp.roll);
  function viewDir(sx, sy) {
    var nx = sx / 1440 * 2 - 1 - (restComp.cx * 2 - 1), ny = 1 - sy / 900 * 2 - ((1 - restComp.cy) * 2 - 1);
    return norm([0, 1, 2].map(function (k) { return rest.fwd[k] * restComp.focal + rest.right[k] * nx * 1.6 + rest.up[k] * ny; }));
  }
  // The sky direction actually seen at a screen point: the hole bends light
  // toward itself, so nearby sky appears pushed outward (weak-field estimate).
  function skyDir(sx, sy) {
    var v = viewDir(sx, sy), p = rest.cp;
    var L = -dot(p, v);
    var q = [p[0] + v[0] * L, p[1] + v[1] * L, p[2] + v[2] * L];
    var bb = Math.sqrt(dot(q, q));
    var frac = 0.5 + L * (2 * L * L + 3 * bb * bb) / (4 * Math.pow(bb * bb + L * L, 1.5));
    var al = (2 / bb + 2.945 / (bb * bb)) * frac;
    return norm([0, 1, 2].map(function (k) { return v[k] * Math.cos(al) - q[k] / bb * Math.sin(al); }));
  }
  var mwNormal = norm(cross(skyDir(640, -40), skyDir(-60, 420)));
  var mwGuess = skyDir(1150, -420);
  var mwOff = dot(mwGuess, mwNormal);
  var mwCentre = norm([0, 1, 2].map(function (k) { return mwGuess[k] - mwNormal[k] * mwOff; }));
  var galaxyDir = skyDir(235, 170);

  // A small planet on a close, tilted orbit, moving the way the disk turns.
  // It starts above the dust wing, to the left of the hole. The orbit is
  // turned so that the planet is high above the disk when it passes behind
  // the hole: its lensed image then stays clear of the bright arcs, where it
  // would smear into dark streaks. `planetNode` is where the orbit crosses
  // the disk plane going up, in degrees around the hole from the right end
  // of the disk towards the camera. The orbit follows the slow drift of the
  // camera, so it keeps its place in the picture.
  var DRIFT = 0.0005;
  function planetAt(t) {
    var R = look.planetR, inc = look.planetInc * deg, node = look.planetNode * deg - t * DRIFT;
    var th = look.planetPhase * deg + t * 1.25 * Math.pow(R, -1.5);
    var c = Math.cos(th), s = Math.sin(th), ci = Math.cos(inc);
    return [R * (c * Math.cos(node) - s * Math.sin(node) * ci), R * s * Math.sin(inc), R * (c * Math.sin(node) + s * Math.cos(node) * ci)];
  }

  var prevFwd = [0, 0, 0], prevUp = [0, 0, 0];

  function render(t) {
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;

    var sc = targets.scene;
    var aspect = sc.w / sc.h;
    var comp = composition(aspect);
    var focal = comp.focal, centerX = comp.cx, centerFrac = comp.cy;
    if (zoomDbg) { focal *= 3.5; centerFrac = 0.5; centerX = 0.5; }   // debug: magnify the shadow edge

    var incl = (look.incl + 0.4 * Math.sin(t * 0.05) - my * 1.2) * deg;
    if (incl < 2.5 * deg) incl = 2.5 * deg;
    var az = t * DRIFT + mx * 2.0 * deg;
    var cam = cameraBasis(incl, az, comp.roll);
    var cp = cam.cp, fwd = cam.fwd, right = cam.right, up = cam.up;
    if (skyOnly) { fwd = [-fwd[0], -fwd[1], -fwd[2]]; right = [-right[0], -right[1], -right[2]]; }   // debug: look away

    // Temporal accumulation: a running mean while nothing moves, an
    // exponential one otherwise; camera motion shortens the history.
    var motion = dist(fwd, prevFwd) + dist(up, prevUp);
    prevFwd = fwd; prevUp = up;
    var alpha = histValid ? Math.min(0.9, Math.max(1 / (accum + 1), reduced ? 0 : 0.15) + motion * 900) : 1.0;
    var jit = jitters[frameIndex % jitters.length];

    // 0. Disk material for this instant, with mipmaps.
    gl.useProgram(disk.p);
    bindTarget(diskTex);
    gl.uniform2f(disk.u.uSize, diskTex.w, diskTex.h);
    gl.uniform1f(disk.u.uTime, t);
    gl.uniform4f(disk.u.uTexA, look.texBroad, look.texMid, look.texFine, look.texThreads);
    gl.uniform4f(disk.u.uTexB, look.pitch, look.texCloud, look.texClump, look.texSpeck);
    draw();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, diskTex.tex);
    gl.generateMipmap(gl.TEXTURE_2D);

    // 1. Geodesic trace into the HDR scene target.
    var pxPerRad = 0.5 * focal * sc.h;
    var planetPos = planetAt(t);
    gl.useProgram(trace.p);
    bindTarget(sc);
    gl.uniform2f(trace.u.uRes, sc.w, sc.h);
    gl.uniform2f(trace.u.uJitter, jit[0], jit[1]);
    gl.uniform1f(trace.u.uTime, t);
    gl.uniform3f(trace.u.uCamPos, cp[0], cp[1], cp[2]);
    gl.uniform3f(trace.u.uCamRight, right[0], right[1], right[2]);
    gl.uniform3f(trace.u.uCamUp, up[0], up[1], up[2]);
    gl.uniform3f(trace.u.uCamFwd, fwd[0], fwd[1], fwd[2]);
    gl.uniform1f(trace.u.uFocal, focal);
    gl.uniform2f(trace.u.uCenter, centerX * 2 - 1, (1 - centerFrac) * 2 - 1);
    gl.uniform1f(trace.u.uEnc, encMode);
    gl.uniform1i(trace.u.uMaxSteps, maxSteps);
    gl.uniform1f(trace.u.uPxPerRad, pxPerRad);
    // In impact parameter (the shadow edge is at 2.598): from two pixels
    // inside the edge, the photon ring itself, then the band next to it.
    var pxB = look.dist / pxPerRad;
    gl.uniform3f(trace.u.uRingBand, 2.598 - 1.5 * pxB, 2.598 + Math.max(0.06, 3.0 * pxB), 2.598 + 0.25);
    gl.uniform2f(trace.u.uDiskSize, diskTex.w, diskTex.h);
    gl.uniform4f(trace.u.uGas, look.gain, look.falloff, look.tau, look.haze);
    gl.uniform4f(trace.u.uGasT, look.tPeak, look.tSlope, look.sat, look.glowFall);
    gl.uniform4f(trace.u.uDust, look.dustTau, look.dust0, look.dust1, look.dustEdge);
    gl.uniform4f(trace.u.uDustL, look.dustGain, look.dustHalf, look.dustFall, look.dustTex);
    gl.uniform4f(trace.u.uDustT, look.dustFloor, look.dustT, look.dustSat, look.soft);
    gl.uniform4f(trace.u.uDustS, look.relief, look.shade, look.dustStreak, look.dustThin);
    gl.uniform2f(trace.u.uStrand, look.strand, look.tint);
    gl.uniform3f(trace.u.uShift, look.doppler, look.dopplerT, look.gasEnd);
    // The dust bank keeps its place in the picture: it is set from the camera.
    var bankAz = Math.atan2(cp[2], cp[0]) + (90 + look.bankDir) * deg;
    gl.uniform4f(trace.u.uBank, Math.cos(bankAz), Math.sin(bankAz), look.bankLo, look.dustBack);
    gl.uniform4f(trace.u.uFog, look.fog, look.fogR, look.halo, look.haloR);
    gl.uniform1f(trace.u.uStars, look.stars);
    gl.uniform1f(trace.u.uEinstein, Math.sqrt(2 / look.dist));
    gl.uniform4f(trace.u.uPlanet, planetPos[0], planetPos[1], planetPos[2], look.planetSize);
    gl.uniform3f(trace.u.uGalaxy, galaxyDir[0], galaxyDir[1], galaxyDir[2]);
    gl.uniform3f(trace.u.uMwNormal, mwNormal[0], mwNormal[1], mwNormal[2]);
    gl.uniform3f(trace.u.uMwCentre, mwCentre[0], mwCentre[1], mwCentre[2]);
    bindTex(trace.u.uDisk, diskTex.tex, 0);
    draw();

    // 2. Temporal accumulation (anti-aliasing).
    var cur = targets.hist[histIndex];
    var next = targets.hist[1 - histIndex];
    // Screen guard for the resolve so the moving planet leaves no ghost trail.
    // Lensing pushes its image outward from the hole, so the guard covers the
    // stretch from its straight-line position out to 1.8 times as far.
    function toUv(P) {
      var rl = [P[0] - cp[0], P[1] - cp[1], P[2] - cp[2]];
      var dp = dot(rl, fwd);
      if (dp <= 0.1) return null;
      return [(focal * dot(rl, right) / (dp * aspect) + centerX * 2) / 2, (focal * dot(rl, up) / dp + (1 - centerFrac) * 2) / 2];
    }
    var pUv = toUv(planetPos), hUv = toUv([0, 0, 0]);
    var guard = [0, 0, 0, 0], guardR = 0;
    if (pUv && hUv) {
      guard = [hUv[0] + (pUv[0] - hUv[0]) * 0.9, hUv[1] + (pUv[1] - hUv[1]) * 0.9,
               hUv[0] + (pUv[0] - hUv[0]) * 1.8, hUv[1] + (pUv[1] - hUv[1]) * 1.8];
      guardR = Math.max(4 * look.planetSize / dist(planetPos, cp) * pxPerRad, 14) / sc.h;
    }
    gl.useProgram(resolve.p);
    bindTarget(next);
    gl.uniform1f(resolve.u.uAlpha, alpha);
    gl.uniform1f(resolve.u.uEnc, encMode);
    gl.uniform2f(resolve.u.uTexel, 1 / sc.w, 1 / sc.h);
    gl.uniform1f(resolve.u.uAspect, aspect);
    gl.uniform4f(resolve.u.uGuard, guard[0], guard[1], guard[2], guard[3]);
    gl.uniform1f(resolve.u.uGuardR, guardR);
    gl.uniform1f(resolve.u.uSeed, (frameIndex * 0.61803) % 1);
    bindTex(resolve.u.uCur, sc.tex, 0);
    bindTex(resolve.u.uHist, cur.tex, 1);
    draw();
    histIndex = 1 - histIndex;
    histValid = true;
    frameIndex++;
    accum++;

    // 3. Glare: the scene blurred into five halos, each about twice as wide
    // as the one before. Their width follows the size of the hole.
    var from = next;
    for (var k = 0; k < 5; k++) {
      var stride = Math.max(0.3, Math.min(2.2, (k < 4 ? 1.0 : 1.6) * comp.hole * sc.h / 423));
      downsample(from, targets.glare[k]);
      blurPass(targets.glare[k], targets.glareTmp[k], stride);
      blurPass(targets.glare[k], targets.glareTmp[k], stride);
      from = targets.glare[k];
    }

    // 4. Composite: glare, film response, vignette, grain.
    gl.useProgram(composite.p);
    bindTarget(null);
    gl.uniform1f(composite.u.uTime, t);
    gl.uniform1f(composite.u.uEnc, encMode);
    gl.uniform1f(composite.u.uExposure, look.exposure);
    gl.uniform4f(composite.u.uGlowA, look.glow1, look.glow2, look.glow3, look.glow4);
    gl.uniform4f(composite.u.uGlowB, look.glow5, look.white, look.knee, 0);
    gl.uniform2f(composite.u.uGrade, look.vignette, look.grain);
    gl.uniform2f(composite.u.uTexel, 1 / next.w, 1 / next.h);
    bindTex(composite.u.uScene, next.tex, 0);
    bindTex(composite.u.uBloom1, targets.glare[0].tex, 1);
    bindTex(composite.u.uBloom2, targets.glare[1].tex, 2);
    bindTex(composite.u.uBloom3, targets.glare[2].tex, 3);
    bindTex(composite.u.uBloom4, targets.glare[3].tex, 4);
    bindTex(composite.u.uBloom5, targets.glare[4].tex, 5);
    draw();
  }

  // ---- Loop: 60 fps cap, adaptive resolution, static mode ----
  var STATIC_FRAMES = 16;
  var staticFramesLeft = STATIC_FRAMES;
  var t0 = performance.now();
  var last = 0, lastDraw = 0, frameAvg = 16, frames = 0;
  var lost = false, shown = false;

  function reveal() {
    if (shown) return;
    shown = true;
    root.classList.add('is-live');
  }

  function frame(now) {
    if (lost) return;
    requestAnimationFrame(frame);
    if (!targets || sizeChanged()) {
      if (!resize()) return;
      last = 0;
    }
    if (reduced) {
      // A converged still frame; re-rendered only when the viewport changes.
      if (staticFramesLeft > 0) { render(0); staticFramesLeft--; reveal(); }
      return;
    }
    if (now - lastDraw < 15) return;
    if (last && now - last < 100) frameAvg = frameAvg * 0.9 + (now - last) * 0.1;
    last = now;
    lastDraw = now;
    frames++;
    if (frames > 90 && frames % 30 === 0 && frameAvg > 30 && quality > 0.35) {
      quality = Math.max(0.35, quality - 0.12);
      resize();
      frameAvg = 16;
    }
    render((now - t0) / 1000);
    reveal();
  }

  document.addEventListener('visibilitychange', function () { last = 0; });
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    lost = true;
    fail('WebGL context lost');
  });

  requestAnimationFrame(frame);

  if (debug) {
    window.__bh = { gl: gl, targets: function () { return targets; }, disk: function () { return diskTex; }, render: render, hdr: hdr, isGL2: isGL2, quality: function () { return quality; }, look: look };
  }
})();
  </script>
</body>
</html>
