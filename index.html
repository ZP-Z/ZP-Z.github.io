  <style>
    :root {
      color-scheme: dark;
      --void: #070a10;
      --ink: 236, 238, 246;
      /* Apparent radius of the shadow; the fallback is drawn in these units. */
      --rs: min(23.5vh, 25vw);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--void);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: rgb(var(--ink));
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
      background: var(--void);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* The picture rises out of the dark once, when its first frame exists.
       It is a real object in space: drag to move around it. */
    #gargantua {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 2.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      cursor: grab;
      touch-action: none;
    }

    #gargantua.is-held {
      cursor: grabbing;
    }

    .is-live #gargantua {
      opacity: 1;
    }

    /* Static stand-in for browsers without WebGL 2. */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: var(--void);
    }

    .fallback-scene {
      position: absolute;
      left: 74.5%;
      top: 42%;
      width: calc(var(--rs) * 13);
      height: calc(var(--rs) * 13);
      margin: calc(var(--rs) * -6.5) 0 0 calc(var(--rs) * -6.5);
      transform: rotate(-21deg);
    }

    .fallback-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle closest-side,
        rgba(96, 110, 150, 0.55) 0,
        rgba(60, 74, 110, 0.32) 28%,
        rgba(30, 40, 66, 0.14) 52%,
        rgba(10, 14, 24, 0) 80%);
    }

    .fallback-arc,
    .fallback-blade {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .fallback-arc {
      width: calc(var(--rs) * 4.4);
      height: calc(var(--rs) * 4.4);
      border-radius: 50%;
      background: radial-gradient(circle closest-side,
        #9395aa 0, #a3a5b9 40%,
        #e6e6ec 45.2%,
        #babbcb 47%,
        #dedee6 50%, #dedee6 66%,
        rgba(190, 188, 202, 0.72) 72%,
        rgba(128, 132, 158, 0.34) 82%,
        rgba(70, 80, 112, 0) 100%);
    }

    .fallback-blade {
      top: 51.2%;
      width: 100%;
      height: calc(var(--rs) * 0.62);
      background: linear-gradient(90deg,
        rgba(60, 44, 30, 0) 16%,
        rgba(118, 92, 68, 0.75) 26%,
        #b29a82 32%,
        #dcd6d2 37%,
        #e0e0e8 42%, #e0e0e8 100%);
      -webkit-mask-image: linear-gradient(rgba(0, 0, 0, 0), #000 36%, #000 64%, rgba(0, 0, 0, 0));
      mask-image: linear-gradient(rgba(0, 0, 0, 0), #000 36%, #000 64%, rgba(0, 0, 0, 0));
    }

    .no-webgl #gargantua {
      display: none;
    }

    .no-webgl .fallback {
      display: block;
    }

    .caption {
      position: fixed;
      left: clamp(28px, 6vw, 96px);
      bottom: clamp(28px, 7.5vh, 84px);
      z-index: 1;
      max-width: min(520px, 84vw);
      pointer-events: none;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      animation: caption-in 2s cubic-bezier(0.22, 0.61, 0.36, 1) 1.1s both;
    }

    .caption-title {
      margin: 0;
      color: rgba(var(--ink), 0.94);
      font-size: clamp(24px, 2.5vw, 38px);
      font-weight: 300;
      letter-spacing: 0.36em;
      line-height: 1;
      text-transform: uppercase;
    }

    .caption-line {
      margin: 1.15em 0 0;
      color: rgba(var(--ink), 0.52);
      font-size: clamp(13px, 1.02vw, 15.5px);
      font-weight: 400;
      letter-spacing: 0.045em;
      line-height: 1.6;

    @keyframes caption-in {

      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gargantua {
        transition: none;
      }

      .caption {
        animation: none;
      }
    }

<body>
  <canvas id="gargantua" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true">
    <div class="fallback-scene"><i class="fallback-arc"></i><i class="fallback-blade"></i></div>
  </div>

  <main class="caption">
    <h1 class="caption-title">Gargantua</h1>
    <p class="caption-line">Light bends. Time slows. Nothing escapes.</p>
  </main>

  <script>
    // If the library cannot be loaded, or the page has no WebGL 2, show the still.
    window.__gargantuaFail = function (msg) {
      document.documentElement.classList.add('no-webgl');
      if (window.console && msg) console.warn('[gargantua] ' + msg);
    };
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') window.__gargantuaFail('library unavailable');
    }, true);
  </script>

  <script type="module">
import * as THREE from 'three';

// The disk is not a picture on a plane. It is tens of thousands of strands of
// light, each a short piece of an orbit around the hole, placed in space with
// a little height above or below the plane and turning at its own speed. The
// strands only add light, so the disk is sheer where they are few and burns
// out to white where they are many.
//
// Gravity is applied to the geometry itself. For every point of every strand
// the vertex shader looks up where the hole makes that point appear, and
// draws it there. A second pass draws the image whose light went round the
// far side of the hole. The table behind this is exact: it is built once, on
// load, from the paths of a few thousand rays.

const canvas = document.getElementById('gargantua');
const root = document.documentElement;
const search = window.location.search || '';
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const reduced = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)');
const mobile = coarse || window.innerWidth < 768;
const debug = /[?&]debug=1/.test(search);
const deg = Math.PI / 180;
const fail = window.__gargantuaFail;

// ---- The look: every number that shapes the picture ----
const look = {
  // Camera: distance (rs), height above the disk plane (degrees), roll of
  // the disk axis, position of the hole, diameter of its shadow as a share
  // of the frame height. Then the same for a tall frame, where the diameter
  // is a share of the width.
  dist: 60, incl: 7.2, roll: -21, cx: 0.745, cy: 0.42, hole: 0.47,
  rollTall: -34, cxTall: 0.60, cyTall: 0.36, holeTall: 0.50,
  // Strands: how many, and how many pieces each is drawn in; inner and outer
  // radius; how fast their number falls with radius; the radius the
  // brightness profile starts from, its strength, how fast it falls.
  count: mobile ? 26000 : 80000, pieces: mobile ? 20 : 32,
  rIn: 1.9, rOut: 12, crowd: 1.5, fluxIn: 1.8, gain: 2.5, fall: 2.2,
  // Width of a strand (rs), spread of their brightness, half-thickness of
  // the disk (rs) and how much it grows with radius, share of strands
  // lofted well above it.
  width: 0.02, spread: 0.9, thick: 0.14, flare: 0.004, loft: 0.05,
  // Colour: temperature at radius 3 (K), how fast it cools outward, spread
  // between strands, saturation.
  tIn: 7000, tSlope: 0.5, tSpread: 0.12, sat: 0.6,
  // Motion: orbital speed, spiral pitch. Least half-width of a drawn strand
  // in pixels. Doppler shift in brightness and in colour.
  spin: 1.25, pitch: 0.02, minHalf: 0.7, doppler: 0.12, dopplerT: 0.5,
  // Thin glowing gas around the hole: brightness and radius of a dense core,
  // then of a wide halo; brightness of the photon ring.
  fog: 0.2, fogR: 2.8, halo: 0.03, haloR: 5.5, ring: 0.6,
  // Camera response: exposure, share of the light in each of five halos
  // (tightest first), white level, sharpness of the shoulder, vignette,
  // grain.
  exposure: 1.0, glow1: 0.10, glow2: 0.10, glow3: 0.07, glow4: 0.05, glow5: 0.03,
  white: 0.74, knee: 3.5, vignette: 0.5, grain: 1.2,
  // Stars. Planet: orbit radius, tilt, where the orbit crosses the disk
  // plane, where the planet starts on it, size.
  stars: 5, planetR: 6.2, planetInc: 30, planetNode: 140, planetPhase: 45, planetSize: 0.14
};
if (debug) {
  const lm = /[?&]look=([^&]+)/.exec(search);
  if (lm) {
    decodeURIComponent(lm[1]).split(',').forEach(kv => {
      const pair = kv.split(':');
      if (pair.length === 2 && Object.prototype.hasOwnProperty.call(look, pair[0]) && isFinite(+pair[1])) look[pair[0]] = +pair[1];
    });
  }
}

// ---- Paths of light around the hole (Schwarzschild, rs = 1) ----
// A ray is described in its own plane by u = 1/r as a function of the angle
// psi swept around the hole, counted from the direction of the camera:
// u'' = 1.5 u^2 - u.
const D = look.dist;
const B_CRIT = 1.5 * Math.sqrt(3);      // rays with a smaller impact parameter are captured
const LUT_W = 768, LUT_H = 96;          // angle x radius
const PSI_MAX = 3 * Math.PI;
const R_MIN = 1.55, R_MAX = 24;
const SKY_W = 512, SKY_L0 = Math.log(1e-5), SKY_L1 = Math.log(38);

// Follows the ray with impact parameter `b` from the camera. Calls
// onCross(j, psi, outgoing) each time it crosses radius rj[j], and returns
// the angle of closest approach (or -1 if the hole captures it).
function shoot(b, uj, onCross, psiStop) {
  let u = 1 / D, psi = 0;
  let v = Math.sqrt(Math.max(1 / (b * b) - u * u * (1 - u), 0));
  const h = Math.min(0.003, 0.004 * b);
  const H = uj.length;
  let jIn = H - 1, jOut = H, outgoing = false, apex = -1;
  for (let n = 0; n < 400000; n++) {
    const k1v = 1.5 * u * u - u;
    const u2 = u + 0.5 * h * v, v2 = v + 0.5 * h * k1v;
    const k2v = 1.5 * u2 * u2 - u2;
    const u3 = u + 0.5 * h * v2, v3 = v + 0.5 * h * k2v;
    const k3v = 1.5 * u3 * u3 - u3;
    const u4 = u + h * v3, v4 = v + h * k3v;
    const k4v = 1.5 * u4 * u4 - u4;
    const un = u + h / 6 * (v + 2 * v2 + 2 * v3 + v4);
    const vn = v + h / 6 * (k1v + 2 * k2v + 2 * k3v + k4v);
    if (!outgoing) {
      while (jIn >= 0 && un >= uj[jIn]) { onCross(jIn, psi + h * (uj[jIn] - u) / (un - u), false); jIn--; }
      if (vn < 0) {
        outgoing = true;
        apex = psi + h * v / (v - vn);
        jOut = jIn + 1;
      }
    }
    if (outgoing) {
      while (jOut < H && un <= uj[jOut]) { onCross(jOut, psi + h * (uj[jOut] - u) / (un - u), true); jOut++; }
      if (jOut >= H) break;
    }
    u = un; v = vn; psi += h;
    if (u > 0.985 || psi > psiStop) break;
  }
  return apex;
}

// Interpolates y(x) through points with increasing x (cubic Hermite).
function hermite(xs, ys, n, x, hint) {
  let k = hint[0];
  while (k < n - 2 && xs[k + 1] < x) k++;
  while (k > 0 && xs[k] > x) k--;
  hint[0] = k;
  const x0 = xs[k], x1 = xs[k + 1], y0 = ys[k], y1 = ys[k + 1];
  const dx = x1 - x0;
  if (dx <= 0) return y0;
  const m0 = k > 0 ? (y1 - ys[k - 1]) / (x1 - xs[k - 1]) : (y1 - y0) / dx;
  const m1 = k < n - 2 ? (ys[k + 2] - y0) / (xs[k + 2] - x0) : (y1 - y0) / dx;
  const t = Math.min(Math.max((x - x0) / dx, 0), 1), t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * dx * m0 + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * dx * m1;
}

// The lens table. For a point at radius r whose direction from the hole
// makes the angle psi with the direction to the camera, it gives the impact
// parameter b of the ray that reaches it, and how b changes with psi and r.
// psi up to pi is the direct image; from pi to 2 pi the light went round the
// far side of the hole.
function buildLens() {
  const rj = new Float64Array(LUT_H), uj = new Float64Array(LUT_H);
  for (let j = 0; j < LUT_H; j++) { rj[j] = R_MIN * Math.pow(R_MAX / R_MIN, j / (LUT_H - 1)); uj[j] = 1 / rj[j]; }
  const inc = [], out = [];
  for (let j = 0; j < LUT_H; j++) { inc.push([]); out.push([]); }
  const stop = PSI_MAX + 0.4;
  const run = b => shoot(b, uj, (j, psi, outgoing) => (outgoing ? out : inc)[j].push(b, psi), stop);
  const bTop = R_MAX / Math.sqrt(1 - 1 / R_MAX) * 1.002;
  for (let k = 1; k <= 900; k++) run(bTop * k / 900);
  for (let k = 0; k <= 112; k++) { const d = Math.pow(10, -k / 16); run(B_CRIT + d); run(B_CRIT - d); }
  // The ray that just touches each radius marks where the two branches meet.
  const apexB = new Float64Array(LUT_H), apexPsi = new Float64Array(LUT_H);
  for (let j = 0; j < LUT_H; j++) {
    apexB[j] = rj[j] / Math.sqrt(1 - 1 / rj[j]);
    apexPsi[j] = shoot(apexB[j] * (1 - 1e-9), uj, () => {}, stop);
  }

  const B = new Float64Array(LUT_W * LUT_H);
  const xs = new Float64Array(2400), ys = new Float64Array(2400), hint = [0];
  for (let j = 0; j < LUT_H; j++) {
    const a = [], pin = inc[j], pout = out[j];
    for (let k = 0; k < pin.length; k += 2) if (pin[k] < apexB[j]) a.push([pin[k + 1], pin[k]]);
    a.push([apexPsi[j], apexB[j]]);
    for (let k = 0; k < pout.length; k += 2) if (pout[k] < apexB[j]) a.push([pout[k + 1], pout[k]]);
    a.sort((p, q) => p[0] - q[0]);
    let n = 0;
    xs[n] = 0; ys[n] = 0; n++;
    for (const p of a) if (p[0] > xs[n - 1] + 1e-7) { xs[n] = p[0]; ys[n] = p[1]; n++; }
    hint[0] = 0;
    for (let i = 0; i < LUT_W; i++) {
      const psi = PSI_MAX * i / (LUT_W - 1);
      B[j * LUT_W + i] = psi >= xs[n - 1] ? ys[n - 1] : hermite(xs, ys, n, psi, hint);
    }
  }
  const data = new Float32Array(LUT_W * LUT_H * 4);
  const dpsi = PSI_MAX / (LUT_W - 1);
  for (let j = 0; j < LUT_H; j++) {
    const j0 = Math.max(j - 1, 0), j1 = Math.min(j + 1, LUT_H - 1);
    for (let i = 0; i < LUT_W; i++) {
      const i0 = Math.max(i - 1, 0), i1 = Math.min(i + 1, LUT_W - 1);
      const o = (j * LUT_W + i) * 4;
      data[o] = B[j * LUT_W + i];
      data[o + 1] = (B[j * LUT_W + i1] - B[j * LUT_W + i0]) / ((i1 - i0) * dpsi);
      data[o + 2] = (B[j1 * LUT_W + i] - B[j0 * LUT_W + i]) / (rj[j1] - rj[j0]);
      data[o + 3] = 0;
    }
  }
  const tex = new THREE.DataTexture(data, LUT_W, LUT_H, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true;
  return tex;
}

// The sky table: the direction a ray ends up travelling in, as an angle
// around the hole from the direction of the camera, against its impact
// parameter. Without a hole the angle would be pi minus the angle of view.
function buildSky() {
  const data = new Float32Array(SKY_W * 4);
  const far = [1 / 400];
  for (let i = 0; i < SKY_W; i++) {
    const b = B_CRIT + Math.exp(SKY_L0 + (SKY_L1 - SKY_L0) * i / (SKY_W - 1));
    let psiFar = -1;
    shoot(b, far, (j, psi, outgoing) => { if (outgoing) psiFar = psi; }, 40);
    data[i * 4] = psiFar < 0 ? 40 : psiFar + Math.asin(Math.min(b / 400 * Math.sqrt(1 - 1 / 400), 1));
  }
  const tex = new THREE.DataTexture(data, SKY_W, 1, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true;
  return tex;
}

// ---- Strands ----
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Brightness of the disk seen from straight above, against radius: zero at
// its inner edge, a peak just outside it, then a steep fall. Peak of 1.
function profile(r) {
  const x = r / look.fluxIn;
  return Math.pow(Math.max(1 - 1 / Math.sqrt(x), 0) / (x * x * x) * 17.65, look.fall);
}

function buildStrands(N, S) {
  const base = new Float32Array((S + 1) * 2 * 3);
  for (let k = 0; k <= S; k++) {
    for (let e = 0; e < 2; e++) {
      const o = (k * 2 + e) * 3;
      base[o] = k / S; base[o + 1] = e ? 1 : -1; base[o + 2] = 0;
    }
  }
  const index = [];
  for (let k = 0; k < S; k++) { const a = 2 * k; index.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }

  const rand = mulberry(20261113);
  const gauss = () => Math.sqrt(-2 * Math.log(Math.max(rand(), 1e-12))) * Math.cos(2 * Math.PI * rand());
  const a = look.rIn, b = look.rOut, k = look.crowd;
  const ea = Math.pow(a, 1 - k), eb = Math.pow(b, 1 - k);
  const orbit = new Float32Array(N * 4), lk = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const r = Math.pow(ea + rand() * (eb - ea), 1 / (1 - k));
    const share = (1 - k) / (eb - ea) * Math.pow(r, -k);       // strands per unit of radius, as a share of all
    const span = 0.25 + 1.3 * Math.pow(rand(), 2);             // angle the strand covers
    const lofted = rand() < look.loft;
    // Height: a slab with soft faces, so that from the side the disk is a
    // band of light and not a line.
    const y = ((rand() * 2 - 1) * 1.25 + 0.3 * gauss()) * (look.thick + look.flare * r) * (lofted ? 2.5 : 1);
    const w = look.width * (0.6 + 0.8 * rand()) * Math.pow(r / 4, 0.4);
    const m = Math.exp(look.spread * gauss() - 0.5 * look.spread * look.spread) * (lofted ? 0.35 : 1);
    orbit[i * 4] = r; orbit[i * 4 + 1] = rand() * 2 * Math.PI; orbit[i * 4 + 2] = span; orbit[i * 4 + 3] = y;
    // Brightness of the strand itself, set so that all strands together
    // give the profile.
    lk[i * 4] = profile(r) * 2 * Math.PI / (N * share * span * w) * m;
    lk[i * 4 + 1] = w;
    lk[i * 4 + 2] = look.tIn * Math.pow(r / 3, -look.tSlope) * (1 + look.tSpread * gauss());
    lk[i * 4 + 3] = rand();
  }
  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(base, 3));
  geo.setIndex(index);
  geo.setAttribute('aOrbit', new THREE.InstancedBufferAttribute(orbit, 4));
  geo.setAttribute('aLook', new THREE.InstancedBufferAttribute(lk, 4));
  geo.instanceCount = N;
  return geo;
}

// ---- Shaders ----
const GLSL_COMMON = /* glsl */`
const float PI = 3.14159265358979;
const float TAU = 6.28318530717959;
const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
const float B_CRIT = 2.5980762;
float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float hash31(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}

// 3D value noise on directions: no seams, unlike the octahedral star map.
float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm3(vec3 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise3(p);
    norm += a;
    p = p * 2.03 + vec3(17.1, 31.7, 7.3);
    a *= 0.5;
  }
  return v / norm;
}

// Colour of a blackbody at unit luminance, white at 6500 K: a Wien fit
// through the effective wavelengths of the sRGB primaries.
vec3 blackbody(float t) {
  float u = 1.0 / t - 1.0 / 6500.0;
  vec3 c = exp(vec3(0.0, -4374.0, -10680.0) * u);
  return c / dot(c, LUMA);
}
`;

// Where the hole makes a point of the scene appear.
const GLSL_LENS = /* glsl */`
#define LUT_W ${LUT_W}
#define LUT_H ${LUT_H}
#define PSI_MAX ${PSI_MAX.toFixed(8)}
#define R_MIN ${R_MIN.toFixed(4)}
#define R_MAX ${R_MAX.toFixed(4)}
uniform sampler2D uLens;
uniform vec3 uCamDir;      // from the hole to the camera
uniform float uSinScale;   // sine of the angle of view per unit of impact parameter

// Impact parameter of the ray that reaches radius r at the angle psi, and
// its change with psi and with r.
vec3 lensLookup(float r, float psi) {
  float fx = clamp(psi / PSI_MAX, 0.0, 1.0) * float(LUT_W - 1);
  float fy = clamp(log(r / R_MIN) / log(R_MAX / R_MIN), 0.0, 1.0) * float(LUT_H - 1);
  ivec2 i0 = ivec2(int(fx), int(fy));
  ivec2 i1 = min(i0 + 1, ivec2(LUT_W - 1, LUT_H - 1));
  vec2 f = vec2(fx, fy) - vec2(i0);
  vec3 a = texelFetch(uLens, i0, 0).rgb;
  vec3 b = texelFetch(uLens, ivec2(i1.x, i0.y), 0).rgb;
  vec3 c = texelFetch(uLens, ivec2(i0.x, i1.y), 0).rgb;
  vec3 d = texelFetch(uLens, i1, 0).rgb;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Image of the point P: a point on its line of sight, at its true distance.
// image 0 is the direct one; image 1 is the one whose light went round the
// far side of the hole, so it appears on the opposite side.
vec3 lensImage(vec3 P, float image, out vec3 L, out vec3 Ph, out vec3 e, out float cpsi, out float spsi, out float sgn) {
  float rr = length(P);
  Ph = P / rr;
  cpsi = clamp(dot(Ph, uCamDir), -1.0, 1.0);
  spsi = sqrt(max(1.0 - cpsi * cpsi, 1e-10));
  e = (Ph - uCamDir * cpsi) / spsi;
  sgn = image < 0.5 ? 1.0 : -1.0;
  float psi = acos(cpsi);
  L = lensLookup(rr, image < 0.5 ? psi : TAU - psi);
  float sinT = min(L.x * uSinScale, 0.999);
  vec3 dir = -uCamDir * sqrt(1.0 - sinT * sinT) + e * (sgn * sinT);
  return cameraPosition + dir * length(P - cameraPosition);
}
`;

const strandVert = /* glsl */`
${GLSL_COMMON}
${GLSL_LENS}
attribute vec4 aOrbit;     // radius, angle at t = 0, angle covered, height
attribute vec4 aLook;      // brightness, width (rs), temperature (K), seed
uniform float uTime;
uniform float uImage;
uniform float uDist;
uniform vec2 uViewport;    // pixels
uniform float uPxPerRs;    // pixels per unit of impact parameter
uniform vec4 uStrand;      // orbital speed, spiral pitch, least half-width (px), gain
uniform vec3 uShift;       // Doppler shift in brightness and in colour; saturation
uniform vec3 uAxis;        // angle around the hole of the point straight behind it; sine and cosine of the height of the camera above the disk
varying float vX;
varying vec3 vCol;

#define LOOP 3600.0

// Angle around the line of sight of a point on a circle about the hole, made
// to keep rising with the angle a along the circle (a = 0 is straight behind
// the hole). k is how close the circle comes to the line of sight.
float around(float a, float k) {
  return TAU * floor(a / TAU + 0.5) + atan(sin(a), k * cos(a));
}

void main() {
  float side = position.y;
  float r0 = aOrbit.x;
  // Orbital speed, rounded so that the whole disk repeats after LOOP seconds
  // and time never grows too large for the arithmetic.
  float w = floor(uStrand.x * pow(r0, -1.5) * (LOOP / TAU) + 0.5) * (TAU / LOOP);
  // The strand runs from the angle a0 to a1, counted from the point straight
  // behind the hole.
  float a0 = mod(aOrbit.y + w * uTime - 0.5 * aOrbit.z - uAxis.x + PI, TAU) - PI;
  float a1 = a0 + aOrbit.z;
  // Where a strand passes behind or in front of the hole, its image swings
  // round the ring within a few degrees of arc. The points of the strand are
  // spaced half evenly along it and half evenly around the line of sight, so
  // that swing gets as many of them as it needs.
  float k = max(abs(uAxis.y - abs(aOrbit.w) / r0 * uAxis.z), 0.012);
  float want = mix(a0 + around(a0, k), a1 + around(a1, k), position.x);
  float lo = a0, hi = a1;
  for (int i = 0; i < 10; i++) {
    float mid = 0.5 * (lo + hi);
    if (mid + around(mid, k) < want) lo = mid; else hi = mid;
  }
  float a = 0.5 * (lo + hi);
  float s = (a - a0) / aOrbit.z;
  float phi = uAxis.x + a;
  float r = r0 * (1.0 + uStrand.y * (s - 0.5) * aOrbit.z);
  float cph = cos(phi), sph = sin(phi);
  vec3 P = vec3(r * cph, aOrbit.w, r * sph);
  vec3 tang = normalize(vec3(-sph + uStrand.y * cph, 0.0, cph + uStrand.y * sph));

  vec3 L, Ph, e;
  float cpsi, spsi, sgn;
  vec3 Pv = lensImage(P, uImage, L, Ph, e, cpsi, spsi, sgn);
  vec4 clip = projectionMatrix * viewMatrix * vec4(Pv, 1.0);

  // How a small step along the strand moves its image: db away from the hole
  // and dt around it, both in units of impact parameter.
  float rr = length(P);
  float b = L.x;
  vec3 psiHat = e * cpsi - uCamDir * spsi;
  vec3 phiHat = cross(uCamDir, e);
  float At = min(b / (rr * spsi), 40.0);
  float db = L.z * dot(tang, Ph) + sgn * L.y / rr * dot(tang, psiHat);
  float dt = At * dot(tang, phiHat);
  float dl = max(length(vec2(db, dt)), 1e-5);
  float sinT = min(b * uSinScale, 0.999);
  float cosT = sqrt(1.0 - sinT * sinT);
  vec3 along = ((uCamDir * sinT + e * (sgn * cosT)) * db + phiHat * (sgn * dt)) / dl;
  vec4 clip2 = projectionMatrix * viewMatrix * vec4(Pv + along * (0.02 * uDist), 1.0);
  vec2 sdir = (clip2.xy / clip2.w - clip.xy / clip.w) * uViewport;
  sdir /= max(length(sdir), 1e-6);

  // A strand is a thin tube of light. The hole squeezes its image one way
  // and stretches it the other; its apparent width follows.
  vec2 n2 = vec2(-dt, db) / dl;
  float Am = length(vec2(L.y / rr, L.z));
  float wApp = aLook.y * length(vec2(n2.x * Am, n2.y * At)) * uPxPerRs;
  // Thinner than a pixel, it is drawn a pixel wide and dimmer instead.
  float hw = max(0.5 * wApp, uStrand.z);
  float sigma = 0.7 * hw;
  clip.xy += vec2(-sdir.y, sdir.x) * (side * 2.2 * sigma) * 2.0 / uViewport * clip.w;
  gl_Position = clip;
  vX = side * 2.2;

  // Light: fades in and out along the strand, and beads a little.
  float taper = smoothstep(0.0, 0.3, s) * smoothstep(1.0, 0.7, s);
  float bead = 0.7 + 0.3 * sin(aLook.w * 40.0 + s * aOrbit.z * (6.0 + 30.0 * fract(aLook.w * 7.31)));
  // Straight behind the hole a strand would be drawn out into a whole ring;
  // so would the second image of a strand straight in front of it.
  float behind = (uImage > 0.5 || cpsi < 0.0) ? smoothstep(0.008, 0.03, spsi) : 1.0;
  // Gas moving towards the camera is brighter and bluer; light climbing out
  // of the well is dimmer and redder.
  float lam = -b * sgn * cross(Ph, uCamDir).y / spsi;
  float g = sqrt(max(1.0 - 1.5 / rr, 0.0)) / max(1.0 - sqrt(0.5 / (rr * rr * rr)) * lam, 0.3);
  float I = aLook.x * uStrand.w * taper * bead * behind * pow(g, 4.0 * uShift.x) * wApp / (sigma * 2.5066);
  float T = aLook.z * pow(max(g, 0.05), uShift.y);
  vCol = mix(vec3(1.0), blackbody(clamp(T, 1500.0, 14000.0)), uShift.z) * I;
}
`;

${GLSL_COMMON}
#define SKY_W ${SKY_W}
#define SKY_L0 ${SKY_L0.toFixed(6)}
#define SKY_L1 ${SKY_L1.toFixed(6)}
varying vec2 vNdc;
uniform mat4 uProjInv;
uniform mat4 uCamWorld;
uniform vec3 uCamPos;
uniform vec3 uCamDir;
uniform float uDist;
uniform sampler2D uSky;
uniform vec4 uFog;         // brightness and radius of the core glow, then of the halo
uniform float uRing;
uniform float uCoarse;     // 1 when light is stored in 8 bits
uniform float uStars;
uniform float uEinstein;   // Einstein angle of the hole for the far sky, radians
uniform float uPxPerRad;
uniform vec3 uGalaxy;      // direction of a faint background galaxy
uniform vec3 uMwNormal;    // Milky Way plane normal
uniform vec3 uMwCentre;    // direction of the galactic centre, in that plane
const vec3 FOG_CORE = vec3(0.88, 0.84, 1.00);
const vec3 FOG_HALO = vec3(0.64, 0.80, 1.10);
vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

vec3 octaDecode(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  vec3 d = vec3(uv.x, 1.0 - abs(uv.x) - abs(uv.y), uv.y);
  float t = max(-d.y, 0.0);
  d.x += d.x >= 0.0 ? -t : t;
  d.z += d.z >= 0.0 ? -t : t;
  return normalize(d);
}

// A faint Milky Way: unresolved starlight in a band along the galactic plane,
// wider and warmer towards the galactic centre, broken by a dark dust rift
// and scattered dust clouds. 'dens' scales the resolved star density.
vec3 milkyWay(vec3 d, out float dens) {
  float lat = dot(d, uMwNormal);
  float lon = atan(dot(d, cross(uMwNormal, uMwCentre)), dot(d, uMwCentre));
  float bulge = exp(-lon * lon / 0.45);
  float width = 0.075 + 0.085 * bulge;
  float band = exp(-lat * lat / (width * width));
  dens = 0.0;
  if (band < 0.004) return vec3(0.0);
  float n1 = fbm3(d * 7.0, 4);
  float n2 = fbm3(d * 19.0 + 4.0, 3);
  float riftLat = lat + 0.02 * (fbm3(d * 11.0 + 9.0, 3) - 0.5);
  float rift = exp(-riftLat * riftLat / (0.16 * width * width)) * smoothstep(0.32, 0.58, n1);
  float clouds = smoothstep(0.55, 0.75, n2) * 0.55 * band;
  float dust = clamp(0.85 * rift + clouds, 0.0, 0.92);
  dens = band * (0.45 + 0.55 * n1) * (1.0 - 0.8 * dust);
  vec3 tint = mix(vec3(0.62, 0.70, 0.88), vec3(1.00, 0.86, 0.68), 0.8 * bulge);
  return tint * band * (0.3 + 0.7 * n1 * n1) * (1.0 - dust) * (0.7 + 0.6 * bulge);
}


// One layer of stars, at most one per sky cell. Counts follow a power law
// in brightness, N(>F) ~ F^-slope from bMin up to bMax, so most stars are
// barely visible pinpoints and a few dominate. Colour follows temperature;
// density rises in the Milky Way ('mw') and in loose clusters.
vec3 starLayer(vec3 d, vec2 unit, mat3 lens, float cells, float dens, float bMin, float bMax, float slope, float seed, float mw) {
  vec2 uv = unit * cells;
  vec2 ci = floor(uv);
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o + seed;
      vec3 h = hash23(c);
      // Per star, not per pixel: every pixel must agree on whether it exists.
      float clump = vnoise(c / 7.0 + seed * 0.37);
      float dn = dens * (0.35 + 1.3 * smoothstep(0.3, 0.8, clump)) * (1.0 + 4.0 * mw);
      if (h.z < dn) {
        // Offset to the star on the sky, turned into screen pixels: the lens
        // stretches the sky around the hole, and the star's image stays round.
        vec3 diff = octaDecode((ci + o + h.xy) / cells) - d;
        vec2 sp = vec2(dot(diff, lens[0]), dot(diff, lens[1])) * lens[2].xy * uPxPerRad;
        float d2 = dot(sp, sp);
        float br = min(bMin * pow(max(hash21(c + 19.7), 1e-4), -1.0 / slope), bMax);
        float tk = 2800.0 + 9000.0 * pow(hash21(c + 5.1), 1.4);
        float halo = 0.035 * exp(-d2 / 16.0) * smoothstep(0.08, 0.8, br);
        col += mix(vec3(1.0), blackbody(tk), 0.8) * (br * (exp(-d2 / 1.3) + halo));

}

// A distant spiral seen at an angle: exponential disk with two faint arms, a
// warm bulge and a dust lane on the near side. Sizes are in milliradians.
vec3 galaxy(vec3 d) {
  if (dot(d, uGalaxy) < 0.995) return vec3(0.0);
  vec3 ga = normalize(cross(uGalaxy, vec3(0.0, 1.0, 0.0)));
  vec3 gb = cross(uGalaxy, ga);
  vec2 g = vec2(dot(d, ga), dot(d, gb)) * 1000.0;
  g = vec2(g.x * 0.80 + g.y * 0.60, -g.x * 0.60 + g.y * 0.80) * 5.0;
  vec2 q = vec2(g.x, g.y / 0.34);
  float rr = length(q);
  float arms = 0.6 + 0.4 * cos(2.0 * (atan(q.y, q.x) - 1.7 * log(rr + 1.0)));
  float lane = 1.0 - 0.5 * exp(-pow((g.y + 1.0) / 0.9, 2.0)) * smoothstep(2.0, 8.0, abs(g.x));
  return vec3(0.74, 0.80, 1.00) * (exp(-rr / 12.0) * arms * lane * 0.034)

}

// The sky in direction 'd', reached by a ray that was bent by 'turn' radians.
// Near the hole the sky is stretched into arcs around the Einstein ring and
// lies deep in the glare of the disk, so starlight thins out with the bending.
vec3 starfield(vec3 d, float turn) {

  vec2 unit = octa(d);

  // at theta, stretched by theta/beta around the hole and squeezed along the
  // radius. Columns: tangential and radial unit vectors, the two factors.
  vec3 axis = -normalize(uCamPos);
  vec3 tn = cross(axis, d);
  tn = dot(tn, tn) > 1e-8 ? normalize(tn) : normalize(cross(d, vec3(0.0, 1.0, 0.0)));

  float n1 = fbm3(d * 3.0 + 1.7, 2);
  col += vec3(0.0012, 0.0021, 0.0040) * (0.6 + 0.8 * n1);
  return col;
}

float skyAngle(float b) {
  float f = clamp((log(b - B_CRIT) - SKY_L0) / (SKY_L1 - SKY_L0), 0.0, 1.0) * float(SKY_W - 1);
  int i = int(f);
  return mix(texelFetch(uSky, ivec2(i, 0), 0).r, texelFetch(uSky, ivec2(min(i + 1, SKY_W - 1), 0), 0).r, f - float(i));
}

void main() {
  vec4 v = uProjInv * vec4(vNdc, 1.0, 1.0);
  vec3 rd = normalize((uCamWorld * vec4(v.xyz / v.w, 0.0)).xyz);
  float cosT = dot(rd, -uCamDir);

    col = starfield(rd, 0.0);
  } else {
    float sinT = sqrt(max(1.0 - cosT * cosT, 0.0));
    float b = uDist * sinT / sqrt(1.0 - 1.0 / uDist);
    col = vec3(0.0);
    if (b > B_CRIT + 2e-5) {

      vec3 e = (rd + uCamDir * cosT) / max(sinT, 1e-6);
      float ang = skyAngle(b);
      col = starfield(normalize(uCamDir * cos(ang) + e * sin(ang)), ang - (PI - asin(sinT)));

    // picture, and what fills the shadow with a pale light.
    col += FOG_CORE * (uFog.x * exp(-b * b / (uFog.y * uFog.y))) + FOG_HALO * (uFog.z * exp(-b * b / (uFog.w * uFog.w)));

    float dr = (b - B_CRIT - 0.035) / 0.03;
    col += vec3(0.95, 0.93, 1.0) * (uRing * exp(-dr * dr));

  // into grain.
  col += uCoarse * (hash21(gl_FragCoord.xy) + hash21(gl_FragCoord.yx * 1.31 + 7.0) - 1.0) / 255.0;
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
`;

vec3 planetShade(vec3 hp, vec3 rd) {

  float fill = clamp(n.y * (uPlanet.y > 0.0 ? -1.0 : 1.0), 0.0, 1.0) * 0.18;

        // a fair rate, the browser itself holds that rate (a power-saving
        // mode, a slow screen): take it as the pace and give the strands
        // back. If frames are slow all the same, it is the pixels that cost.
        if (typical > 0.9 * trial.typical) {
          if (typical <= 60) {
            strands.instanceCount = trial.count;
            limit = trial.limit;
            slowed = trial.slowed;
            pace = typical;
          } else {
            strandsHelp = false;
          }
        }
        trial = null;
      } else {
        if (!pace && typical < 24) pace = typical;
        const full = pace || 19;
        if (typical > 1.5 * full && typical > 26) {
          quickRuns = 0;
          if (strandsHelp && strands.instanceCount > strandCount * 0.2) {
            trial = { count: strands.instanceCount, limit, slowed, typical };
            limit = Math.min(limit, Math.round(strands.instanceCount * 0.92));
            strands.instanceCount = Math.round(strands.instanceCount * 0.6);
          } else if (quality > 0.45) {
            quality = Math.max(0.45, quality - 0.12);
            resize();
          }
          slowed = true;
        } else if (typical < 1.25 * full && strands.instanceCount < limit && ++quickRuns >= (slowed ? 5 : 1)) {
          quickRuns = 0;
          strands.instanceCount = Math.min(limit, Math.round(strands.instanceCount * 1.3));
        }
      }
    }
    render((now - t0) / 1000);
    if (!shown) { shown = true; root.classList.add('is-live'); }
  }
  document.addEventListener('visibilitychange', () => { last = 0; gaps = []; trial = null; });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; fail('WebGL context lost'); });
  requestAnimationFrame(frame);

  if (debug) {
    window.__bh = {
      // A frame drawn through this hook is always the full picture.
      gl, hdr, isGL2: true, look, quality: () => quality,
      render: t => { strands.instanceCount = strandCount; render(t); },
      // Raw framebuffers, for the render check.
      targets: () => {
        const raw = t => { const p = renderer.properties.get(t); return { fb: p.__webglFramebuffer, ok: !!p.__webglFramebuffer }; };
        return { scene: raw(sceneRT), glare: glare.map(raw), glareTmp: glareTmp.map(raw) };
      },
      info: () => ({ triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, strands: strands.instanceCount, pace, limit, quality })
    };
  }
}

try {
  start();
} catch (e) {
  fail(e && e.message ? e.message : 'failed to start');
}
  </script>
</body>
</html>
