  <script>
    // If the library cannot be loaded, or the page has no WebGL 2, show the still.
    window.__gargantuaFail = function (msg) {
      document.documentElement.classList.add('no-webgl');
      // The way in goes back to where the still has its hole.

      if (window.console && msg) console.warn('[gargantua] ' + msg);

  <script type="module">
import * as THREE from './vendor/three-0.170.0.module.min.js';
import {
  buildTables, B_CRIT, LUT_W, LUT_H, PSI_MAX, R_MIN, R_MAX, SKY_W, SKY_L0, SKY_L1,
  RAY_W, RAY_H, RAY_PSI, RAY_B, RAY_EPS, RAY_X0, RAY_LA, RAY_LB, GAS_W, GAS_H
} from './vendor/black-hole-tables.js';

// The disk is not a picture on a plane. It is gas in space: two thin sheets
// of glowing fibres, one a little above the plane of the disk and one a
// little below, rippled and bent, inside a thick veil of thinner gas. The
// gas turns in lanes, each at the speed of its own radius.
//
// Every pixel follows its line of sight around the hole, along a path that
// is looked up in a table built once, on load, from the paths of a few
// thousand rays. Where the line meets a sheet, the gas there takes its share
// of the light from behind and adds its own. So the disk is sheer where the
// gas is thin, a wall of light where it is deep, and the far side shows
// through the near side.

const canvas = document.getElementById('gargantua');
const root = document.documentElement;
const search = window.location.search || '';
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const reduced = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)');
const mobile = coarse || window.innerWidth < 768;
const debug = /[?&]debug=1/.test(search);
const deg = Math.PI / 180;
const fail = window.__gargantuaFail;

// ---- The way in ----
// The shadow of the hole is a link to the blog. To follow it is to fall in:
// the camera turns to the hole and is drawn into it, space twists and closes
// in around it, and the blog opens out of the dark on the other side.
// Without WebGL the still swells into the dark; with reduced motion the
// page only fades.
const portal = document.querySelector('.portal');
const FALL = 2.6;         // seconds from the tap to darkness
let fallAt = 0;           // when the fall began (performance.now()); 0 while there is none
let glFall = null;        // the drawn fall, once the picture is live
let gone = false, prepared = null, backstop = 0;
const drawn = () => !!glFall && root.classList.contains('is-live') && !root.classList.contains('no-webgl');
// Load the blog while the fall is under way: drawn in advance where the
// browser can, else at least fetched.
function prepare() {
  if (prepared) return;
  try {
    if (HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules')) {
      prepared = document.createElement('script');
      prepared.type = 'speculationrules';
      prepared.textContent = JSON.stringify({ prerender: [{ source: 'list', urls: [portal.href] }] });
    }
  } catch (e) {}
  if (!prepared) {
    prepared = document.createElement('link');
    prepared.rel = 'prefetch';
    prepared.href = portal.href;
  }
  document.head.appendChild(prepared);
}
function leave() {
  if (gone) return;
  gone = true;
  clearTimeout(backstop);
  // Tells the blog to open out of the dark.
  try { sessionStorage.setItem('bh-fall', String(Date.now())); } catch (e) {}
  window.location.assign(portal.href);
}
function enter() {
  if (fallAt) return;
  fallAt = performance.now();
  prepare();
  // An early click can leave while the first frame is still being prepared.
  if (reduced || (!drawn() && !root.classList.contains('no-webgl'))) {
    root.classList.add('is-leaving');
    backstop = setTimeout(leave, 350);
    return;
  }
  root.classList.add('is-falling');
  // The drawn fall leaves by itself once it is dark; this is in case the
  // frames stop coming.
  backstop = setTimeout(leave, drawn() ? FALL * 1000 + 1500 : 1500);
}
portal.addEventListener('click', e => {
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;   // a new tab or window: as any link
  e.preventDefault();
  // A tap on the live picture is told from a drag when the pointer is let go.
  if (e.detail === 0 || !drawn()) enter();
});
// Back from the blog to a page kept in memory: start again.
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;
  clearTimeout(backstop);
  fallAt = 0;
  gone = false;
  root.classList.remove('is-falling', 'is-leaving');
  if (prepared) { prepared.remove(); prepared = null; }
  if (glFall) glFall.reset();

// ---- The look: every number that shapes the picture ----
const look = {
  // Camera: distance (rs), height above the disk plane (degrees), roll of
  // the disk axis, position of the hole, diameter of its shadow as a share
  // of the frame height. Then the same for a tall frame, where the diameter
  // is a share of the width.
  dist: 60, incl: 5.8, roll: -21, cx: 0.745, cy: 0.42, hole: 0.70,
  rollTall: -34, cxTall: 0.60, cyTall: 0.36, holeTall: 0.68,
  // Gas, the body of the disk: inner and outer radius; brightness of its
  // surface at radius 3 and how fast that falls outward; depth of the gas
  // seen from straight above at radius 3, and how fast it thins outward.
  gasIn: 2.39, gasOut: 8.2, gasLight: 7, gasFall: 5.2, gasDepth: 0.6, gasThin: 1.6,
  // Its two sheets: height above and below the plane (rs), growth of that
  // with radius, size of the ripples; contrast of the fibres and of the
  // clouds. Temperature at radius 3 (K), cooling outward, extra heat of the
  // bright fibres.
  gasLift: 0.03, gasFlare: 0.006, gasWave: 1.0, fibre: 2.8, cloud: 2.2,
  gasT: 5200, gasCool: 0.85, gasHot: 0.35,
  // The veil of thin gas around the sheets: depth, brightness against the
  // sheets, thickness (rs). Thinner gas and dust beyond the bright disk:
  // depth of a clump, radius where it starts, brightness of its glow, light
  // it stops; the most slant at which it is seen to glow, how fast its
  // light falls off beyond the outer radius times emberFar.
  haze: 0.05, hazeLight: 0.5, hazeH: 0.22, dust: 0.5, dustIn: 6.0, dustLight: 0.102, dustDark: 0.2,
  emberSlant: 3, emberFall: 4, emberFar: 1.0,
  // Motion: orbital speed. Doppler shift in brightness and in colour.
  spin: 1.25, doppler: 0.12, dopplerT: 0.5,
  // Thin glowing gas around the hole: brightness and radius of a dense core,
  // then of a wide halo; brightness of the photon ring.
  fog: 0.17, fogR: 3.0, halo: 0.015, haloR: 5.5, ring: 1.6,
  // Camera response: exposure, share of the light in each of five halos
  // (tightest first), white level, sharpness of the shoulder, brightness at
  // which a colour is half burnt out to white, vignette, grain.
  exposure: 1.55, glow1: 0.06, glow2: 0.08, glow3: 0.10, glow4: 0.04, glow5: 0.11,
  white: 1.0, knee: 3.5, burn: 2.5, vignette: 0.5, grain: 1.2,
  // Stars. Planet: orbit radius, tilt, where the orbit crosses the disk
  // plane, where the planet starts on it, size.
  stars: 5, planetR: 6.2, planetInc: 30, planetNode: 140, planetPhase: 45, planetSize: 0.14,
  // Falling in, the way into the blog: how much nearer the hole comes;
  // twist of space at the edge of the dark (radians) and how fast it falls
  // off outward; length of the streaks; how much the sky outside the dark
  // is squeezed; width of the glow inside its edge, as a share of its radius;
  // how much the exposure is taken down, so the gas keeps its texture.
  fallNear: 1.3, fallTwist: 4, fallTwistOut: 1.0, fallStreak: 0.25, fallSqueeze: 1, fallRim: 0.12, fallDim: 0.35
};
if (debug) {
  const lm = /[?&]look=([^&]+)/.exec(search);
  if (lm) {
    decodeURIComponent(lm[1]).split(',').forEach(kv => {
      const pair = kv.split(':');
      if (pair.length === 2 && Object.prototype.hasOwnProperty.call(look, pair[0]) && isFinite(+pair[1])) look[pair[0]] = +pair[1];
    });
  }
}

const D = look.dist;
// One texture tile spans a full turn and 1 / GAS_VS e-folds of radius.
// GAS_PT is the radial advance of a fibre on each turn.
const GAS_VS = 1.3, GAS_PT = 1;
const LANE = 0.085, LANE_S0 = 0.45, GAS_DRIFT = 6 / 3600;

// ---- Shaders ----
const GLSL_COMMON = /* glsl */`
const float PI = 3.14159265358979;
const float TAU = 6.28318530717959;
const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
const float B_CRIT = 2.5980762;
float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float hash31(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}

// 3D value noise on directions: no seams, unlike the octahedral star map.
float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm3(vec3 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise3(p);
    norm += a;
    p = p * 2.03 + vec3(17.1, 31.7, 7.3);
    a *= 0.5;
  }
  return v / norm;
}

// Colour of a blackbody at unit luminance, white at 6500 K: a Wien fit
// through the effective wavelengths of the sRGB primaries.
vec3 blackbody(float t) {
  float u = 1.0 / t - 1.0 / 6500.0;
  vec3 c = exp(vec3(0.0, -4374.0, -10680.0) * u);
  return c / dot(c, LUMA);
}
`;

// Where the hole makes a point of the scene appear.
const GLSL_LENS = /* glsl */`
#define LUT_W ${LUT_W}
#define LUT_H ${LUT_H}
#define PSI_MAX ${PSI_MAX.toFixed(8)}
#define R_MIN ${R_MIN.toFixed(4)}
#define R_MAX ${R_MAX.toFixed(4)}
uniform sampler2D uLens;
uniform vec3 uCamDir;      // from the hole to the camera
uniform float uSinScale;   // sine of the angle of view per unit of impact parameter

// Impact parameter of the ray that reaches radius r at the angle psi, and
// its change with psi and with r.
vec3 lensLookup(float r, float psi) {
  float fx = clamp(psi / PSI_MAX, 0.0, 1.0) * float(LUT_W - 1);
  float fy = clamp(log(r / R_MIN) / log(R_MAX / R_MIN), 0.0, 1.0) * float(LUT_H - 1);
  ivec2 i0 = ivec2(int(fx), int(fy));
  ivec2 i1 = min(i0 + 1, ivec2(LUT_W - 1, LUT_H - 1));
  vec2 f = vec2(fx, fy) - vec2(i0);
  vec3 a = texelFetch(uLens, i0, 0).rgb;
  vec3 b = texelFetch(uLens, ivec2(i1.x, i0.y), 0).rgb;
  vec3 c = texelFetch(uLens, ivec2(i0.x, i1.y), 0).rgb;
  vec3 d = texelFetch(uLens, i1, 0).rgb;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Image of the point P: a point on its line of sight, at its true distance.
// image 0 is the direct one; image 1 is the one whose light went round the
// far side of the hole, so it appears on the opposite side.
vec3 lensImage(vec3 P, float image, out vec3 L, out vec3 Ph, out vec3 e, out float cpsi, out float spsi, out float sgn) {
  float rr = length(P);
  Ph = P / rr;
  cpsi = clamp(dot(Ph, uCamDir), -1.0, 1.0);
  spsi = sqrt(max(1.0 - cpsi * cpsi, 1e-10));
  e = (Ph - uCamDir * cpsi) / spsi;
  sgn = image < 0.5 ? 1.0 : -1.0;
  float psi = acos(cpsi);
  L = lensLookup(rr, image < 0.5 ? psi : TAU - psi);
  float sinT = min(L.x * uSinScale, 0.999);
  vec3 dir = -uCamDir * sqrt(1.0 - sinT * sinT) + e * (sgn * sinT);
  return cameraPosition + dir * length(P - cameraPosition);
}
`;

// The gas of the disk. The disk is two thin sheets of glowing gas, one a
// little above the plane and one a little below, inside a thick veil of
// thinner gas. A sheet is drawn in fibres that run with the flow; cold dust
// lies on its outer face. A line of sight meets these one after the other.
// Each takes its share of the light from behind and adds its own, so the
// disk is sheer where the gas is thin and a wall of light where it is deep.
// The shader that includes this declares uCamDir and uDist.
const GLSL_GAS = /* glsl */`
#define RAY_W ${RAY_W}
#define RAY_H ${RAY_H}
#define RAY_PSI ${RAY_PSI.toFixed(8)}
#define RAY_B ${RAY_B.toFixed(4)}
#define RAY_EPS ${RAY_EPS.toFixed(6)}
#define RAY_X0 ${RAY_X0.toFixed(4)}
#define RAY_LA ${RAY_LA.toFixed(8)}
#define RAY_LB ${RAY_LB.toFixed(8)}
#define GAS_VS ${GAS_VS.toFixed(4)}
#define GAS_PT ${GAS_PT.toFixed(1)}
#define LANE ${LANE.toFixed(4)}
#define LANE_S0 ${LANE_S0.toFixed(4)}
#define GAS_LOOP 3600.0
uniform sampler2D uRays;
uniform sampler2D uGas;
uniform vec3 uGasTime;     // time, orbital speed, drift of the texture towards the hole
uniform vec4 uGasBody;     // inner radius, outer radius, brightness at radius 3, its fall with radius
uniform vec4 uGasDepth;    // depth of the gas at radius 3, its fall with radius, contrast of fibres, of clouds
uniform vec4 uGasSheet;    // height of a sheet, its growth with radius, thickness of the veil, size of the ripples
uniform vec4 uGasHeat;     // temperature at radius 3, cooling with radius, extra heat of bright fibres
uniform vec4 uGasVeil;     // depth and brightness of the veil, depth and brightness of the dust
uniform vec4 uGasDust;     // where the dust starts; Doppler shift in brightness and in colour; light the dust stops
uniform vec3 uGasEmber;    // most slant at which the outer gas is seen to glow; how fast its light falls far out; where that starts, as a share of the outer radius

// u = 1/r of the line of sight with impact parameter b, at the angle psi
// around the hole, and its change with psi.
vec2 rayAt(float b, float psi) {
  float d = b - B_CRIT;
  float x = d >= 0.0 ? RAY_X0 + (1.0 - RAY_X0) * log(1.0 + d / RAY_EPS) / RAY_LA
                     : RAY_X0 - RAY_X0 * log(1.0 - d / RAY_EPS) / RAY_LB;
  float fx = clamp(x, 0.0, 1.0) * float(RAY_W - 1);
  // Invert the per-column angular spacing used by buildRays.
  float scale = sqrt(1.0 + b * b);
  float safeB = max(b, 1e-3);
  float fy = clamp(psi * scale / (RAY_PSI * safeB), 0.0, 1.0) * float(RAY_H - 1);
  ivec2 i0 = ivec2(int(fx), int(fy));
  ivec2 i1 = min(i0 + 1, ivec2(RAY_W - 1, RAY_H - 1));
  vec2 f = vec2(fx, fy) - vec2(i0);
  vec2 p00 = texelFetch(uRays, i0, 0).rg;
  vec2 p10 = texelFetch(uRays, ivec2(i1.x, i0.y), 0).rg;
  vec2 p01 = texelFetch(uRays, ivec2(i0.x, i1.y), 0).rg;
  vec2 p11 = texelFetch(uRays, i1, 0).rg;
  return mix(mix(p00, p10, f.x), mix(p01, p11, f.x), f.y) / vec2(scale, safeB);
}

// How far a step across the screen moves over the gas texture.
vec2 gasStep(vec2 g, vec2 dg) {
  float r2 = max(dot(g, g), 1e-3);
  float turn = (g.x * dg.y - g.y * dg.x) / (r2 * TAU);
  return clamp(vec2(turn, dot(g, dg) / r2 * GAS_VS + GAS_PT * turn), -0.3, 0.3);
}

// The gas turns in lanes, each at the speed of its own radius, so inner
// lanes overtake outer ones. Each lane carries its own piece of the texture.
vec4 laneGas(float j, float which, float s, float phi, vec2 gx, vec2 gy) {
  float w = floor(uGasTime.y * exp(-1.5 * (LANE_S0 + j * LANE)) * (GAS_LOOP / TAU) + 0.5) * (TAU / GAS_LOOP);
  vec3 h = hash23(vec2(j, 3.7 + 11.3 * which));
  float turn = (phi - w * uGasTime.x) / TAU + h.x;
  return textureGrad(uGas, vec2(turn, s * GAS_VS + GAS_PT * turn + h.y + uGasTime.z * uGasTime.x), gx, gy);
}

// Fibres, tufts and clouds of one of the sheets at a point of the disk plane.
vec4 gasAt(vec2 g, float which, vec2 gx, vec2 gy) {
  float s = 0.5 * log(max(dot(g, g), 1e-3));
  float phi = atan(g.y, g.x);
  float f = (s - LANE_S0) / LANE;
  float j = floor(f);
  float t = f - j;
  t = t * t * (3.0 - 2.0 * t);
  vec4 p = mix(laneGas(j, which, s, phi, gx, gy), laneGas(j + 1.0, which, s, phi, gx, gy), t);
  // Two lanes averaged are flatter than one: give the contrast back.
  return clamp(0.5 + (p - 0.5) / sqrt(1.0 - 2.0 * t * (1.0 - t)), 0.0, 1.0);
}

// A layer with light S and depth tau on the line of sight.
void layer(inout vec3 L, inout float T, vec3 S, float tau) {
  float a = 1.0 - exp(-tau);
  L += T * S * a;
  T *= 1.0 - a;
}

// Gas moving towards the camera is brighter and bluer; light climbing out
// of the well is dimmer and redder.
float gasShift(float r, float lam) {
  return sqrt(max(1.0 - 1.5 / r, 0.0)) / max(1.0 - sqrt(0.5 / (r * r * r)) * lam, 0.3);
}

// Light of the gas at radius r: surface brightness and colour.
vec3 gasGlow(float r, float heat, float g) {
  float temp = uGasHeat.x * pow(r / 3.0, -uGasHeat.y) * heat * pow(max(g, 0.05), uGasDust.z);
  // Colour of a hot body, with its strongest channel at 1. The hottest gas
  // is a warm white: bluer, and its glare would turn the whole picture cold.
  vec3 c = exp(vec3(0.0, -4374.0, -10680.0) * (1.0 / clamp(temp, 1000.0, 6000.0) - 1.0 / 6500.0));
  // At grazing angles even a thin sheet becomes opaque. Ramp its emitted
  // light up from the inner edge as well, so the brightest gas sits farther out.
  float innerLight = mix(0.12, 1.0, smoothstep(uGasBody.x - 0.20, uGasBody.x + 0.85, r));
  return c * (innerLight * uGasBody.z * pow(r / 3.0, -uGasBody.w) * pow(g, 4.0 * uGasDust.y));
}

// One slice of the veil at the point Q.
void veil(inout vec3 L, inout float T, vec3 Q, float share, float slant, float lam) {
  float r = length(Q.xz);
  float body = smoothstep(uGasBody.x - 0.3, uGasBody.x + 0.9, r) * (1.0 - smoothstep(0.55 * uGasBody.y, 1.2 * uGasBody.y, r));
  float g = gasShift(max(r, 1.6), lam);
  layer(L, T, gasGlow(r, 0.82, g) * uGasVeil.y, uGasVeil.x * share * body * pow(r / 3.0, -uGasDepth.y) * slant);
}

// Height of a sheet above the disk plane, at a point of that plane, and its
// slope there. A sheet is not flat: it is bent as a whole and rippled, each
// sheet in its own way, so the two weave through each other and the fibres
// cross at small angles.
vec3 sheetHeight(int which, vec2 g, float ripple) {
  float r = max(length(g), 1.0);
  float lr = log(r), phi = atan(g.y, g.x);
  float side = which == 0 ? 1.0 : -1.0;
  float k = which == 0 ? 0.0 : 2.4;
  float turn = uGasTime.x * (TAU / GAS_LOOP);
  float a1 = ripple * 0.012 * r, a2 = ripple * 0.016 * sqrt(r), a3 = ripple * 0.010 * sqrt(r);
  float p1 = phi - 1.3 * lr + 1.7 * k - 2.0 * turn;
  float p2 = 3.0 * phi + 4.0 * lr + k - 6.0 * turn;
  float p3 = 7.0 * phi - 9.0 * lr + 2.0 * k + 12.0 * turn;
  float h = side * (uGasSheet.x + uGasSheet.y * r) + a1 * sin(p1) + a2 * sin(p2) + a3 * sin(p3);
  float hr = side * uGasSheet.y
           + (a1 * sin(p1) - 1.3 * a1 * cos(p1)) / r
           + (0.5 * a2 * sin(p2) + 4.0 * a2 * cos(p2)) / r
           + (0.5 * a3 * sin(p3) - 9.0 * a3 * cos(p3)) / r;
  float hp = (a1 * cos(p1) + 3.0 * a2 * cos(p2) + 7.0 * a3 * cos(p3)) / r;
  vec2 rh = g / r;
  return vec3(h, rh * hr + vec2(-rh.y, rh.x) * hp);
}

// One sheet at the point Q. "first" says whether the line of sight meets
// its dust before its gas.
void sheet(inout vec3 L, inout float T, vec3 Q, int which, bool first, float slant, float alongOrbit, float lam, float foot, vec2 gx, vec2 gy) {
  float r = length(Q.xz);
  // At the turn from the arc into the foreground, a grazing ray looks
  // along the orbit and several fine fibres project into the same pixel.
  float footprint = 1.0 + 3.0 * alongOrbit * smoothstep(3.0, 13.0, slant);
  vec4 p = gasAt(Q.xz, float(which), gx * footprint, gy * footprint);
  // Near the hole the gas is drawn out into long fibres; further out the
  // flow is slower and it breaks into short tufts.
  float tuft = 0.8 * smoothstep(3.5, 8.5, r);
  float n = clamp(0.5 + ((which == 0 ? p.r : p.g) - 0.5) * (1.0 - tuft) + (p.b - 0.5) * tuft * 1.15, 0.0, 1.0);
  float c = p.a;
  // A ragged outer edge: clouds and bright fibres reach further out than
  // the gaps between them.
  float reachOut = c + 0.4 * (n - 0.5);
  float rim = 1.0 - smoothstep(uGasBody.y * (0.45 + 0.4 * reachOut), uGasBody.y * (0.75 + 0.4 * reachOut), r);
  // The inner sheet gradually thickens with radius. Include the footprint
  // of each pixel so this transition also stays smooth on small screens.
  float body = smoothstep(uGasBody.x - 0.18 - foot, uGasBody.x + 0.65 + foot, r) * rim;
  float g = gasShift(max(r, 1.6), lam);
  float depth = uGasDepth.x * body * pow(r / 3.0, -uGasDepth.y) * pow(2.0 * n, uGasDepth.z) * pow(2.0 * c, uGasDepth.w);
  // Deep gas near the hole is an even wall of light; further out the
  // fibres differ in brightness.
  vec3 glow = gasGlow(r, 1.0 + uGasHeat.z * (2.0 * n - 1.0), g) * mix(0.9 + 0.2 * n, 0.45 + 2.2 * n * n, smoothstep(2.5, 5.5, r)) * (0.6 + 0.8 * c);
  // Thinner gas and dust reach further out than the bright gas, in fibres
  // of their own. The gas glows in the light of the inner disk. It has the
  // colour of the bright gas at the same radius, and beyond the edge of the
  // bright disk the colour of that edge: a pale colour of its own would
  // read as paint. Beyond the outer radius times uGasEmber.z the light
  // reaches it at a slant, so it falls off fast and the gas dims to
  // nothing. Seen at a slant itself, the gas would add up into a sheet of
  // even colour, so it is never taken as thicker than at the slant
  // uGasEmber.x: it stays tufts of light on the dark. The dust in it dims
  // what lies behind a little.
  float grit = smoothstep(0.38, 0.72, which == 0 ? p.g : p.r) * (0.4 + 1.2 * n);
  float dustRim = 1.0 - smoothstep(1.1 * uGasBody.y, 1.7 * uGasBody.y, r);
  float dustDepth = uGasVeil.z * smoothstep(uGasDust.x, uGasDust.x + 3.0, r) * dustRim * grit * grit * slant;
  vec3 tint = gasGlow(min(r, 0.75 * uGasBody.y), 1.0, g);
  float far = pow(max(r / (uGasEmber.z * uGasBody.y), 1.0), -uGasEmber.y);
  vec3 dustGlow = tint * (uGasVeil.w * uGasBody.z * 9.0 / (r * r) * far * pow(g, 4.0 * uGasDust.y) / dot(tint, LUMA));
  float ember = 1.0 - exp(-dustDepth * min(1.0, uGasEmber.x / slant));
  float shade = exp(-uGasDust.w * min(dustDepth, 2.0));
  if (first) { L += T * dustGlow * ember; T *= shade; }
  layer(L, T, glow, depth * slant);
  if (!first) { L += T * dustGlow * ember; T *= shade; }
}

// Keep the tangent-line approximation local to the crossing. Approach its
// five-radius limit smoothly as the ray becomes parallel to a layer.
vec3 layerPoint(vec3 P, vec3 d, float invDy, float height) {
  float t = (height - P.y) * invDy;
  return P + d * (t * inversesqrt(1.0 + t * t / 25.0));
}

// Where the line of sight goes through the disk at the point P, travelling
// along d: half of the veil, the two sheets, the other half of the veil.
void crossing(inout vec3 L, inout float T, vec3 P, vec3 d, float lam, float foot, vec2 gx, vec2 gy) {
  float r0 = length(P.xz);
  float slant = inversesqrt(d.y * d.y + 0.025 * 0.025);
  float invDy = d.y * slant * slant;
  float way = d.y < 0.0 ? 1.0 : -1.0;       // 1 when the light we follow goes down through the disk
  float lift = uGasSheet.x + uGasSheet.y * r0;
  float thick = uGasSheet.z * (1.0 + 0.05 * r0);
  // At the sides, the ray skims along the orbit and projected ripples can
  // fold back. Across the central band it looks across the orbits.
  float alongOrbit = smoothstep(0.22, 0.82, abs(dot(vec2(-P.z, P.x), d.xz)) / max(r0, 1.0));
  float ripple = uGasSheet.w * mix(1.0, smoothstep(0.035, 0.23, abs(d.y)), alongOrbit);
  vec3 Q0 = layerPoint(P, d, invDy, lift), Q1 = layerPoint(P, d, invDy, -lift);
  vec3 h0, h1;
  for (int i = 0; i < 3; i++) {
    h0 = sheetHeight(0, Q0.xz, ripple);
    h1 = sheetHeight(1, Q1.xz, ripple);
    Q0 = mix(Q0, layerPoint(P, d, invDy, h0.x), 0.75);
    Q1 = mix(Q1, layerPoint(P, d, invDy, h1.x), 0.75);
  }
  float s0 = 1.0 / max(abs(d.y - dot(d.xz, h0.yz)) / sqrt(1.0 + dot(h0.yz, h0.yz)), 0.025);
  float s1 = 1.0 / max(abs(d.y - dot(d.xz, h1.yz)) / sqrt(1.0 + dot(h1.yz, h1.yz)), 0.025);
  bool topFirst = dot(Q0 - Q1, d) < 0.0;
  // A line of sight that reaches the plane inside the hole ends there: it
  // meets only what lies before the plane. Its path is too bent for the
  // wide veil to be placed on it, so the veil fades out there.
  bool ends = r0 < 1.2;
  bool on0 = !(ends && dot(Q0 - P, d) > 0.0), on1 = !(ends && dot(Q1 - P, d) > 0.0);
  float open = smoothstep(1.0, 1.7, r0);
  veil(L, T, layerPoint(P, d, invDy, way * 1.5 * thick), 0.133 * open, slant, lam);
  veil(L, T, layerPoint(P, d, invDy, way * 0.5 * thick), 0.367 * open, slant, lam);
  // Visit the visible sheets front to back. Keep a single copy of the
  // material evaluation in the program, whichever sheet comes first.
  int sheets = int(on0) + int(on1);
  bool startOnTop = on0 && (!on1 || topFirst);
  for (int i = 0; i < sheets; i++) {
    bool top = (i == 0) == startOnTop;
    sheet(L, T, top ? Q0 : Q1, top ? 0 : 1, top ? way > 0.0 : way < 0.0,
          top ? s0 : s1, alongOrbit, lam, foot, gx, gy);
  }
  veil(L, T, layerPoint(P, d, invDy, -way * 0.5 * thick), 0.367 * open, slant, lam);
  veil(L, T, layerPoint(P, d, invDy, -way * 1.5 * thick), 0.133 * open, slant, lam);
}

// Light of the disk along the line of sight rd, and the share of the light
// from behind that it lets through. Nothing further than "reach" counts.
vec4 diskLight(vec3 rd, float reach) {
  float cosT = dot(rd, -uCamDir);
  vec3 rayNormal = cross(rd, uCamDir);
  float sinT = length(rayNormal);
  float b = min(uDist * sinT / sqrt(1.0 - 1.0 / uDist), RAY_B);
  // The side of the hole the line of sight passes on. Aimed straight at the
  // hole it has no side: any one will do.
  vec3 e = sinT > 1e-7 ? cross(uCamDir, rayNormal) / sinT : normalize(cross(uCamDir, vec3(0.0, 0.0, 1.0)));
  // The line of sight goes through the disk plane at the angle psi around
  // the hole, and again half a turn later.
  float psi = atan(-uCamDir.y, e.y) + PI;
  float sp = sin(psi), cp = cos(psi);
  vec3 Ph = uCamDir * cp + e * sp, Pt = e * cp - uCamDir * sp;
  float lam = -b * cross(e, uCamDir).y;
  vec2 ua = rayAt(b, psi), ub = rayAt(b, psi + PI);
  // A sheet lies off the plane, so the line of sight can meet it outside
  // the hole and reach the plane only inside: those lines count too.
  float lo = 1.0 / (1.7 * uGasBody.y), hi = 2.5;
  bool seen = cosT > 0.05 && b < RAY_B - 0.01;
  bool okA = seen && ua.x > lo && ua.x < hi, okB = seen && ub.x > lo && ub.x < hi;
  float ia = clamp(ua.x, 0.02, hi), ib = clamp(ub.x, 0.02, hi);
  vec3 Pa = Ph / ia, Pb = -Ph / ib;
  vec3 da = normalize(Pt - Ph * (ua.y / ia)), db = -normalize(Pt - Ph * (ub.y / ib));
  // Size of a pixel on the disk: for the texture, and along the radius.
  vec2 ax = dFdx(Pa.xz), ay = dFdy(Pa.xz), bx = dFdx(Pb.xz), by = dFdy(Pb.xz);
  vec2 gax = gasStep(Pa.xz, ax), gay = gasStep(Pa.xz, ay);
  vec2 gbx = gasStep(Pb.xz, bx), gby = gasStep(Pb.xz, by);
  float fa = min(2.2 * length(vec2(dot(Pa.xz, ax), dot(Pa.xz, ay))) / max(length(Pa.xz), 0.5), 2.0);
  float fb = min(2.2 * length(vec2(dot(Pb.xz, bx), dot(Pb.xz, by))) / max(length(Pb.xz), 0.5), 2.0);
  vec3 L = vec3(0.0);
  float T = 1.0;
  int crossings = okB && distance(Pb, cameraPosition) < reach ? 2 : 1;
  for (int i = 0; i < crossings; i++) {
    bool near = i == 0;
    if (near && !(okA && distance(Pa, cameraPosition) < reach)) continue;
    if (T <= 0.003) break;
    crossing(L, T, near ? Pa : Pb, near ? da : db, lam, near ? fa : fb,
             near ? gax : gbx, near ? gay : gby);
  }
  return vec4(L, T);
}
`;

const skyVert = /* glsl */`
varying vec2 vNdc;
void main() {
  vNdc = position.xy;
  gl_Position = vec4(position.xy, 1.0, 1.0);
}
`;

const skyFrag = /* glsl */`
${GLSL_COMMON}
#define SKY_W ${SKY_W}
#define SKY_L0 ${SKY_L0.toFixed(6)}
#define SKY_L1 ${SKY_L1.toFixed(6)}
varying vec2 vNdc;
uniform mat4 uProjInv;
uniform mat4 uCamWorld;
uniform vec3 uCamPos;
uniform vec3 uCamDir;
uniform float uDist;
uniform sampler2D uSky;
uniform vec4 uFog;         // brightness and radius of the core glow, then of the halo
uniform float uRing;
uniform float uCoarse;     // 1 when light is stored in 8 bits
uniform float uStars;
uniform float uEinstein;   // Einstein angle of the hole for the far sky, radians
uniform float uPxPerRad;
uniform vec3 uGalaxy;      // direction of a faint background galaxy
uniform vec3 uMwNormal;    // Milky Way plane normal
uniform vec3 uMwCentre;    // direction of the galactic centre, in that plane
${GLSL_GAS}
const vec3 FOG_CORE = vec3(0.42, 0.90, 0.82);
const vec3 FOG_HALO = vec3(0.42, 0.86, 1.00);
vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

vec3 octaDecode(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  vec3 d = vec3(uv.x, 1.0 - abs(uv.x) - abs(uv.y), uv.y);
  float t = max(-d.y, 0.0);
  d.x += d.x >= 0.0 ? -t : t;
  d.z += d.z >= 0.0 ? -t : t;
  return normalize(d);
}

// A faint Milky Way: unresolved starlight in a band along the galactic plane,
// wider and warmer towards the galactic centre, broken by a dark dust rift
// and scattered dust clouds. 'dens' scales the resolved star density.
vec3 milkyWay(vec3 d, out float dens) {
  float lat = dot(d, uMwNormal);
  float lon = atan(dot(d, cross(uMwNormal, uMwCentre)), dot(d, uMwCentre));
  float bulge = exp(-lon * lon / 0.45);
  float width = 0.075 + 0.085 * bulge;
  float band = exp(-lat * lat / (width * width));
  dens = 0.0;
  if (band < 0.004) return vec3(0.0);
  float n1 = fbm3(d * 7.0, 4);
  float n2 = fbm3(d * 19.0 + 4.0, 3);
  float riftLat = lat + 0.02 * (fbm3(d * 11.0 + 9.0, 3) - 0.5);
  float rift = exp(-riftLat * riftLat / (0.16 * width * width)) * smoothstep(0.32, 0.58, n1);
  float clouds = smoothstep(0.55, 0.75, n2) * 0.55 * band;
  float dust = clamp(0.85 * rift + clouds, 0.0, 0.92);
  dens = band * (0.45 + 0.55 * n1) * (1.0 - 0.8 * dust);
  vec3 tint = mix(vec3(0.62, 0.70, 0.88), vec3(1.00, 0.86, 0.68), 0.8 * bulge);
  return tint * band * (0.3 + 0.7 * n1 * n1) * (1.0 - dust) * (0.7 + 0.6 * bulge);
}


// One layer of stars, at most one per sky cell. Counts follow a power law
// in brightness, N(>F) ~ F^-slope from bMin up to bMax, so most stars are
// barely visible pinpoints and a few dominate. Colour follows temperature;
// density rises in the Milky Way ('mw') and in loose clusters.
vec3 starLayer(vec3 d, vec2 unit, mat3 lens, float cells, float dens, float bMin, float bMax, float slope, float seed, float mw) {
  vec2 uv = unit * cells;
  vec2 ci = floor(uv);
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o + seed;
      vec3 h = hash23(c);
      // Per star, not per pixel: every pixel must agree on whether it exists.
      float clump = vnoise(c / 7.0 + seed * 0.37);
      float dn = dens * (0.35 + 1.3 * smoothstep(0.3, 0.8, clump)) * (1.0 + 4.0 * mw);
      if (h.z < dn) {
        // Offset to the star on the sky, turned into screen pixels: the lens
        // stretches the sky around the hole, and the star's image stays round.
        vec3 diff = octaDecode((ci + o + h.xy) / cells) - d;
        vec2 sp = vec2(dot(diff, lens[0]), dot(diff, lens[1])) * lens[2].xy * uPxPerRad;
        float d2 = dot(sp, sp);
        float br = min(bMin * pow(max(hash21(c + 19.7), 1e-4), -1.0 / slope), bMax);
        float tk = 2800.0 + 9000.0 * pow(hash21(c + 5.1), 1.4);
        float halo = 0.035 * exp(-d2 / 16.0) * smoothstep(0.08, 0.8, br);
        col += mix(vec3(1.0), blackbody(tk), 0.8) * (br * (exp(-d2 / 1.3) + halo));
      }
    }
  }
  return col;
}

// A distant spiral seen at an angle: exponential disk with two faint arms, a
// warm bulge and a dust lane on the near side. Sizes are in milliradians.
vec3 galaxy(vec3 d) {
  if (dot(d, uGalaxy) < 0.995) return vec3(0.0);
  vec3 ga = normalize(cross(uGalaxy, vec3(0.0, 1.0, 0.0)));
  vec3 gb = cross(uGalaxy, ga);
  vec2 g = vec2(dot(d, ga), dot(d, gb)) * 1000.0;
  g = vec2(g.x * 0.80 + g.y * 0.60, -g.x * 0.60 + g.y * 0.80) * 5.0;
  vec2 q = vec2(g.x, g.y / 0.34);
  float rr = length(q);
  float arms = 0.6 + 0.4 * cos(2.0 * (atan(q.y, q.x) - 1.7 * log(rr + 1.0)));
  float lane = 1.0 - 0.5 * exp(-pow((g.y + 1.0) / 0.9, 2.0)) * smoothstep(2.0, 8.0, abs(g.x));
  return vec3(0.74, 0.80, 1.00) * (exp(-rr / 12.0) * arms * lane * 0.034)
       + vec3(1.00, 0.88, 0.72) * (exp(-dot(g, g) / 9.0) * 0.05);
}

// The sky in direction 'd', reached by a ray that was bent by 'turn' radians.
// Near the hole the sky is stretched into arcs around the Einstein ring and
// lies deep in the glare of the disk, so starlight thins out with the bending.
vec3 starfield(vec3 d, float turn) {
  float fade = mix(0.10, 1.0, 1.0 - smoothstep(0.10, 0.36, turn)) * (1.0 - smoothstep(1.7, 2.7, turn));
  vec2 unit = octa(d);
  float mwDens;
  vec3 mw = milkyWay(d, mwDens);

  // The hole as a point lens: a source at angle beta from the axis appears
  // at theta, stretched by theta/beta around the hole and squeezed along the
  // radius. Columns: tangential and radial unit vectors, the two factors.
  vec3 axis = -normalize(uCamPos);
  vec3 tn = cross(axis, d);
  tn = dot(tn, tn) > 1e-8 ? normalize(tn) : normalize(cross(d, vec3(0.0, 1.0, 0.0)));
  float beta = acos(clamp(dot(d, axis), -1.0, 1.0));
  float root = sqrt(beta * beta + 4.0 * uEinstein * uEinstein);
  mat3 lens = mat3(tn, cross(d, tn),
                   vec3(min((beta + root) / (2.0 * max(beta, 1e-3)), 6.0), 0.5 + 0.5 * beta / root, 0.0));

  // Field stars (a few bright, many faint) and a dense layer of barely
  // resolved ones that gives the sky its texture.
  vec3 col = starLayer(d, unit, lens, 180.0, 0.30, 0.0040, 1.2, 1.25, 0.0, mwDens)
           + starLayer(d, unit, lens, 520.0, 0.15, 0.0020, 0.03, 1.6, 31.0, mwDens);
  col = (col * uStars + mw * 0.006 + galaxy(d) * 2.0) * fade;

  // Space itself: almost black, with the faintest cool cast.
  float n1 = fbm3(d * 3.0 + 1.7, 2);
  col += vec3(0.0010, 0.0038, 0.0046) * (0.6 + 0.8 * n1);
  return col;
}

float skyAngle(float b) {
  float f = clamp((log(b - B_CRIT) - SKY_L0) / (SKY_L1 - SKY_L0), 0.0, 1.0) * float(SKY_W - 1);
  int i = int(f);
  return mix(texelFetch(uSky, ivec2(i, 0), 0).r, texelFetch(uSky, ivec2(min(i + 1, SKY_W - 1), 0), 0).r, f - float(i));
}

void main() {
  vec4 v = uProjInv * vec4(vNdc, 1.0, 1.0);
  vec3 rd = normalize((uCamWorld * vec4(v.xyz / v.w, 0.0)).xyz);
  float cosT = dot(rd, -uCamDir);
  float sinT = sqrt(max(1.0 - cosT * cosT, 0.0));
  float b = uDist * sinT / sqrt(1.0 - 1.0 / uDist);
  bool facingHole = cosT > 0.05;
  vec3 col = vec3(0.0);
  if (!facingHole || b > B_CRIT + 2e-5) {
    vec3 skyDirection = rd;
    float turn = 0.0;
    if (facingHole) {
      vec3 e = (rd + uCamDir * cosT) / max(sinT, 1e-6);
      float ang = skyAngle(b);
      skyDirection = normalize(uCamDir * cos(ang) + e * sin(ang));
      turn = ang - (PI - asin(sinT));
    }
    col = starfield(skyDirection, turn);
  }
  if (facingHole) {
    // Thin hot gas around the hole glows faintly. Most of the pale light
    // inside the shadow is not this but the glare of the disk.
    col += FOG_CORE * (uFog.x * exp(-b * b / (uFog.y * uFog.y))) + FOG_HALO * (uFog.z * exp(-b * b / (uFog.w * uFog.w)));
    // Keep the photon ring narrow, with a faint shoulder as its light fades.
    float dr = (b - B_CRIT - 0.035) / 0.03;
    float ringLight = mix(exp(-dr * dr), exp(-0.045 * dr * dr), 0.10);
    col += vec3(1.0, 0.90, 0.74) * (uRing * ringLight);
  }
  // The disk, in front of all that.
  vec4 gas = diskLight(rd, 1e9);
  col = gas.rgb + col * gas.a;
  col = max(col, 0.0);
  // In 8 bits light is stored squeezed, so that it keeps its hue however
  // bright it is and the dark sky gets most of the steps. A little noise
  // turns the steps that are left into grain.
  if (uCoarse > 0.5) {
    col = sqrt(col / (1.0 + max(col.r, max(col.g, col.b))))
        + (hash21(gl_FragCoord.xy) + hash21(gl_FragCoord.yx * 1.31 + 7.0) - 1.0) / 255.0;
  }
  gl_FragColor = vec4(col, 1.0);
}
`;

const planetFrag = /* glsl */`

}

const compositeFrag = /* glsl */`
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform sampler2D uBloom3;
uniform sampler2D uBloom4;
uniform sampler2D uBloom5;
uniform float uTime;
uniform float uExposure;
uniform vec4 uGlowA;   // share of the light spread over halos 1 to 4, tightest first
uniform vec4 uGlowB;   // share of the widest halo; white level; sharpness of the shoulder
uniform vec2 uGrade;   // vignette, grain
uniform float uCoarse; // 1 when light is stored in 8 bits, squeezed
uniform vec4 uHole;    // the hole on screen: centre (uv), radius of its shadow (share of the frame height), width over height
uniform vec4 uFall;    // falling in: edge of the dark (shadow radii), twist there (radians), length of the streaks, darkness inside
uniform vec4 uFall2;   // squeeze of the sky outside the dark, fall-off of the twist outward, width of the glow inside the edge
vec3 light(sampler2D tex, vec2 uv) {
  vec3 e = texture2D(tex, uv).rgb;
  if (uCoarse < 0.5) return e;
  vec3 n = e * e;
  return n / max(1.0 - max(n.r, max(n.g, n.b)), 0.004);
}
const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
// Response of the film: straight through the shadows and mid-tones, then a
// shoulder. A colour keeps its hue on the way up and burns out to a warm
// white, so fire goes from red through salmon to cream, never to yellow.
vec3 film(vec3 x) {
  float m = max(max(x.r, x.g), max(x.b, 1e-6));
  float t = m / pow(1.0 + pow(m / uGlowB.y, uGlowB.z), 1.0 / uGlowB.z);
  float burn = m * m / (m * m + uGlowB.w * uGlowB.w);
  return t * mix(x / m, vec3(1.0, 0.89, 0.62), burn);
}
vec3 srgb(vec3 c) {
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
// Glare of the lens: every halo is the scene itself, blurred, and takes
// its share of the light. The widest is blue-green: it turns the light of
// the disk into the teal haze of the sky around it. The ones before it
// are warm, and warmer as they widen, so that inside the hole, where all
// of them reach, the haze stays grey.
// The twisted fall reaches beyond the edges of the frame. There the frame
// is mirrored: the streaked, turning gas hides the seam.
vec2 mirror(vec2 uv) {
  return 1.0 - abs(1.0 - mod(uv, 2.0));
}
// In the fall the scene is drawn wider than the screen (uFall2.w): from a
// point of the screen to the same point of the scene as drawn.
vec2 toScene(vec2 uv) {
  return mirror(0.5 + (uv - 0.5) / uFall2.w);
}
vec3 sceneAt(vec2 uv) {
  return light(uScene, toScene(uv));
}
vec3 glare(vec2 uv) {
  return light(uBloom1, uv) * vec3(1.00, 0.96, 0.92) * uGlowA.x
    + light(uBloom2, uv) * vec3(1.00, 0.95, 0.90) * uGlowA.y
    + light(uBloom3, uv) * vec3(1.00, 0.85, 0.70) * uGlowA.z
    + light(uBloom4, uv) * vec3(1.00, 0.50, 0.28) * uGlowA.w
    + light(uBloom5, uv) * vec3(0.08, 0.85, 1.45) * uGlowB.x;
}
void main() {
  vec2 q = vUv - 0.5;
  float direct = 1.0 - (uGlowA.x + uGlowA.y + uGlowA.z + uGlowA.w + uGlowB.x);
  vec3 c;
  if (uFall.x <= 1.0 && uFall.y == 0.0) {
    c = light(uScene, vUv) * direct + glare(vUv);
  } else {
    // Falling in. Closer to the hole its shadow covers more of the sky, and
    // all that lies outside it is pushed out and squeezed into a ring at the
    // edge of the dark: a point r shadow radii from the centre shows what
    // was at s. Space near the edge is twisted round the way the disk turns
    // (counterclockwise on screen), and light is drawn out along the fall.
    vec2 w = vec2(uHole.w, 1.0);
    vec2 d = (vUv - uHole.xy) * w;
    float r = length(d) / uHole.z;
    float h = uFall.x;
    float x = r / h;
    float s = r < h ? x : sqrt((r * r - h * h) * uFall2.x + 1.0);
    float turn = -uFall.y * min(1.0, pow(h / max(r, 1e-3), uFall2.y));
    vec2 dir = d / max(length(d), 1e-6);
    dir = mat2(cos(turn), sin(turn), -sin(turn), cos(turn)) * dir;
    vec2 unit = dir * uHole.z / w;
    // The streaks reach back toward the hole, but not into its shadow:
    // outside the dark they only draw out light that is outside it too.
    int taps = uFall.z > 0.0 ? 12 : 1;
    float floor_ = r < h ? 0.0 : 1.0;
    vec3 e = vec3(0.0);
    float j = hash(gl_FragCoord.xy * 0.73 + 5.0);
    for (int k = 0; k < 12; k++) {
      if (k >= taps) break;
      e += sceneAt(uHole.xy + unit * max(floor_, s * (1.0 - uFall.z * (float(k) + j) / 12.0)));
    }
    e *= direct / float(taps);
    if (r >= h) {
      c = e + glare(toScene(uHole.xy + unit * s));
    } else {
      // Inside the dark, what was in the shadow goes out. Near the edge the
      // light of the ring still spills in, and fades toward the centre.
      float fade = 1.0 - uFall.w;
      float gone = 1.0 - fade * fade * fade;
      float rim = pow(smoothstep(1.0 - uFall2.z, 1.0, x), 2.0);
      vec3 ring = light(uBloom1, toScene(uHole.xy + unit * 1.1)) * direct;
      c = e * (1.0 - gone) + ring * (gone * rim) + glare(toScene(uHole.xy + unit * x)) * (fade + uFall.w * rim);
    }
  }
  c = film(max(c, 0.0) * uExposure);
  c *= 1.0 - uGrade.x * smoothstep(0.15, 0.80, dot(q, q));
  c = srgb(c);
  // Grain doubles as dither: strongest in the mid-tones, faint in black and white.
  float l = dot(c, LUMA);
  float grain = hash(gl_FragCoord.xy + fract(uTime) * 61.0)
              + hash(gl_FragCoord.xy * 1.37 + fract(uTime * 1.7) * 43.0) - 1.0;
  c += grain * (0.7 + uGrade.y * 2.2 * smoothstep(0.02, 0.30, l) * (1.0 - 0.75 * smoothstep(0.70, 1.0, l))) / 255.0;
  gl_FragColor = vec4(c, 1.0);
}
`;

// ---- Start ----
function prepareTables(distance) {
  return new Promise((resolve, reject) => {
    const worker = new Worker('./vendor/black-hole-tables-worker.js', { type: 'module' });
    worker.onmessage = ({ data }) => { worker.terminate(); resolve(data); };
    worker.onerror = event => { event.preventDefault(); worker.terminate(); reject(new Error(event.message)); };
    worker.postMessage(distance);
  }).catch(() => buildTables(distance));   // Workers can be disabled independently of WebGL.
}

async function start() {
  const booted = performance.now();

  // software gets the still: a frame a second is worse than a picture.
  const attributes = { antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance', failIfMajorPerformanceCaveat: true };
  const gl = canvas.getContext('webgl2', attributes);
  if (!gl) { fail('WebGL unavailable'); return; }

  try {
    renderer = new THREE.WebGLRenderer({ canvas, context: gl, ...attributes });
  } catch (e) {
    fail('WebGL unavailable');
    return;
  }

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; fail('WebGL context lost'); });

  // 8 bits: the faintest gas is lost and the glare is weaker.
  const hdr = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float')) && !/[?&]ldr=1/.test(search);
  const texType = hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;

  // Camera: fixed distance, free direction.
  const camera = new THREE.PerspectiveCamera(10, 1.6, 4, 400);
  const sinPerB = Math.sqrt(1 - 1 / D) / D;
  const tanShadow = Math.tan(Math.asin(B_CRIT * sinPerB));
  const smooth01 = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

  // cropped by the top edge. A tall frame brings the hole near the centre
  // and turns the disk further onto the diagonal.
  function composition(aspect) {
    const wide = smooth01((aspect - 0.8) / 0.55);
    const hole = Math.min(look.holeTall * aspect, Math.max(look.hole, Math.min(1.125 * look.hole, 0.625 * look.hole * aspect)));
    return {
      focal: hole / tanShadow,

      cy: look.cyTall + (look.cy - look.cyTall) * wide,

  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

    const fwd = norm([-cp[0], -cp[1], -cp[2]]);

    uGasSheet: { value: new THREE.Vector4() }, uGasHeat: { value: new THREE.Vector4() },
    uGasVeil: { value: new THREE.Vector4() }, uGasDust: { value: new THREE.Vector4() }, uGasEmber: { value: new THREE.Vector3() }
  };

  const camDir = new THREE.Vector3(0, 0, 1);
  const viewport = new THREE.Vector2(1, 1);
  const tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));

    vertexShader: skyVert, fragmentShader: skyFrag, depthTest: false, depthWrite: false,
    uniforms: Object.assign({}, gasUniforms, {
      uProjInv: { value: camera.projectionMatrixInverse }, uCamWorld: { value: camera.matrixWorld },
      uCamPos: { value: camera.position }, uCamDir: { value: camDir }, uDist: { value: D },
      uSky: { value: null }, uFog: { value: new THREE.Vector4() }, uRing: { value: 0 }, uCoarse: { value: hdr ? 0 : 1 },
      uStars: { value: 0 }, uEinstein: { value: Math.sqrt(2 / D) }, uPxPerRad: { value: 1 },
      uGalaxy: { value: new THREE.Vector3(...galaxyDir) }, uMwNormal: { value: new THREE.Vector3(...mwNormal) },
      uMwCentre: { value: new THREE.Vector3(...mwCentre) }
    })
  });
  const sky = new THREE.Mesh(tri, skyMat);
  sky.frustumCulled = false;
  sky.renderOrder = -10;
  scene.add(sky);

  const planetMat = new THREE.ShaderMaterial({
    vertexShader: planetVert, fragmentShader: planetFrag, side: THREE.DoubleSide,
    uniforms: Object.assign({}, gasUniforms, {
      uLens: { value: null }, uCamDir: { value: camDir }, uSinScale: { value: sinPerB },
      uPlanet: { value: new THREE.Vector4() }, uTime: { value: 0 }, uProjInv: { value: camera.projectionMatrixInverse },
      uCamWorld: { value: camera.matrixWorld }, uViewport: { value: viewport }, uDist: { value: D }, uCoarse: { value: hdr ? 0 : 1 }
    })
  });
  const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 40), planetMat);
  planet.frustumCulled = false;
  planet.renderOrder = -5;
  scene.add(planet);

  // Post: glare and camera response.
  const postScene = new THREE.Scene();
  const postCam = new THREE.Camera();
  const postMesh = new THREE.Mesh(tri, null);
  postMesh.frustumCulled = false;
  postScene.add(postMesh);
  const passMat = (frag, uniforms) => new THREE.ShaderMaterial({ vertexShader: passVert, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
  const downMat = passMat(downFrag, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() } });
  const blurMat = passMat(blurFrag, { uTex: { value: null }, uDir: { value: new THREE.Vector2() } });
  const compositeMat = passMat(compositeFrag, {
    uScene: { value: null }, uBloom1: { value: null }, uBloom2: { value: null }, uBloom3: { value: null },
    uBloom4: { value: null }, uBloom5: { value: null }, uTime: { value: 0 }, uExposure: { value: 1 },
    uGlowA: { value: new THREE.Vector4() }, uGlowB: { value: new THREE.Vector4() }, uGrade: { value: new THREE.Vector2() },
    uCoarse: { value: hdr ? 0 : 1 }, uHole: { value: new THREE.Vector4() }, uFall: { value: new THREE.Vector4() }, uFall2: { value: new THREE.Vector4() }
  });
  function pass(mat, target) {
    postMesh.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(postScene, postCam);
  }

  let sceneRT = null, glare = [], glareTmp = [];
  let quality = mobile ? 0.8 : 1.0;
  let lastW = 0, lastH = 0, lastDpr = 0, bufW = 0, bufH = 0;
  function freeTargets() {
    if (sceneRT) sceneRT.dispose();
    glare.concat(glareTmp).forEach(t => t.dispose());
    sceneRT = null; glare = []; glareTmp = [];
  }
  function viewportSize() {
    const w = canvas.clientWidth || window.innerWidth || 0;
    const h = canvas.clientHeight || window.innerHeight || 0;
    return [w, h, Math.min(window.devicePixelRatio || 1, 2)];
  }
  function sizeChanged() {
    const vs = viewportSize();
    return vs[0] !== lastW || vs[1] !== lastH || vs[2] !== lastDpr;
  }
  function resize() {
    const vs = viewportSize();
    const cw = vs[0], ch = vs[1], dpr = vs[2];
    if (cw < 2 || ch < 2) return false;      // layout not ready (hidden tab); try again next frame
    lastW = cw; lastH = ch; lastDpr = dpr;
    let tw = Math.round(cw * dpr * quality), th = Math.round(ch * dpr * quality);
    const cap = mobile ? 1100000 : 2400000;
    if (tw * th > cap) { const s = Math.sqrt(cap / (tw * th)); tw = Math.round(tw * s); th = Math.round(th * s); }
    bufW = Math.max(32, tw); bufH = Math.max(32, th);
    renderer.setPixelRatio(1);
    renderer.setSize(bufW, bufH, false);
    freeTargets();
    const opts = { type: texType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
    sceneRT = new THREE.WebGLRenderTarget(bufW, bufH, Object.assign({}, opts, { depthBuffer: true, samples: mobile ? 0 : 4 }));
    for (let k = 2; k <= 6; k++) {
      const gw = Math.max(1, bufW >> k), gh = Math.max(1, bufH >> k);
      glare.push(new THREE.WebGLRenderTarget(gw, gh, opts));
      glareTmp.push(new THREE.WebGLRenderTarget(gw, gh, opts));
    }
    viewport.set(bufW, bufH);
    return true;
  }

  // ---- Moving around it ----
  // The pointer nudges the view; a drag turns the camera around the hole.
  // Left alone, the view drifts back to where it started. A tap on the
  // shadow, not a drag that ends there, is the way in; a pointer resting on
  // the shadow makes the hole lean toward it a little.
  const view = { az: 0, el: look.incl * deg, zoom: 1, taz: 0, tel: look.incl * deg, tzoom: 1 };
  let mx = 0, my = 0, tmx = 0, tmy = 0, held = false, px = 0, py = 0, touched = -1e9, clock = 0;
  let pending = 1;        // draw the resting reduced-motion view once; input adds settling frames
  let downX = 0, downY = 0, downAt = 0, travel = 0;
  let holeX = 0, holeY = 0, holeR = 0;    // the shadow on screen, in CSS pixels
  let over = false, lure = 0;
  const inHole = (x, y) => holeR > 0 && Math.hypot(x - holeX, y - holeY) <= holeR;
  const press = e => {
    if (fallAt || !drawn()) return;
    // Other buttons, and keys held for a new tab or window, are the link's.
    if (e.currentTarget === portal && (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey)) return;
    held = true; px = downX = e.clientX; py = downY = e.clientY; downAt = performance.now(); travel = 0; pending = 240;
    canvas.classList.add('is-held');
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* released already */ } }
  };
  const release = e => {
    if (!held) return;
    held = false; touched = clock; canvas.classList.remove('is-held');
    if (e.type === 'pointerup' && travel < 8 && performance.now() - downAt < 700 && inHole(e.clientX, e.clientY)) enter();
  };
  [canvas, portal].forEach(el => {
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('wheel', e => {
      e.preventDefault();
      if (fallAt) return;
      view.tzoom = Math.max(0.6, Math.min(3, view.tzoom * Math.exp(-e.deltaY * 0.0012)));
      touched = clock; pending = 240;
    }, { passive: false });
  });
  canvas.addEventListener('dblclick', () => { view.taz = 0; view.tel = look.incl * deg; view.tzoom = 1; pending = 240; });
  portal.addEventListener('pointerenter', e => { if (!reduced && e.pointerType !== 'touch') over = true; });
  portal.addEventListener('pointerleave', () => { over = false; });
  window.addEventListener('pointermove', e => {
    if (fallAt) return;
    if (held) {
      travel = Math.max(travel, Math.hypot(e.clientX - downX, e.clientY - downY));
      view.taz -= (e.clientX - px) * 0.005;
      view.tel = Math.max(2.5 * deg, Math.min(80 * deg, view.tel + (e.clientY - py) * 0.005));
      px = e.clientX; py = e.clientY;
      touched = clock; pending = 240;
    } else if (!coarse && !reduced) {
      tmx = (e.clientX / window.innerWidth) * 2 - 1;
      tmy = (e.clientY / window.innerHeight) * 2 - 1;
    }
  }, { passive: true });
  window.addEventListener('pointerleave', () => { tmx = 0; tmy = 0; });

  // ---- Falling in ----
  // Every part of the fall is a function of the time since the tap, so any
  // moment of it can be drawn on its own. With T < 0 nothing changes.
  function fallState(T) {
    const p = Math.min(1, Math.max(0, T / FALL));
    return {
      pull: smooth01(p / 0.5),                            // the camera turns to the hole
      zoom: Math.pow(look.fallNear, smooth01(p / 0.7)),   // and comes nearer
      edge: Math.pow(p, 2.6),                             // the dark spreads out from the shadow, ever faster
      twist: look.fallTwist * smooth01(p),                // space turns round the hole
      streak: look.fallStreak * smooth01((p - 0.45) / 0.55),   // light drawn out in the plunge
      squeeze: 1 + (look.fallSqueeze - 1) * p * p,        // the sky outside is squeezed into a ring
      dark: smooth01(p / 0.3),                            // what was in the shadow goes out
      vignette: 0.4 * p,
      dim: 1 - look.fallDim * smooth01(p / 0.5),           // the eye adjusts to the light
      shift: 14 * FALL * p * p * p / 3                    // time on the disk runs up to 15 times faster
    };
  }

  // How much wider than the screen the scene must be drawn for the fall to
  // find, at every point of the screen, what it looks at after the twist.
  function overscan(cx, cy, aspect, shadow, edge, twist, squeeze) {
    let need = 1;
    for (let i = 0; i <= 10; i++) {
      for (let k = 0; k <= 10; k++) {
        const dx = (i / 10 - cx) * aspect, dy = k / 10 - (1 - cy);
        const r = Math.hypot(dx, dy) / shadow;
        if (r <= edge) continue;
        const s = Math.sqrt((r * r - edge * edge) * squeeze + 1);
        const turn = -twist * Math.min(1, Math.pow(edge / r, look.fallTwistOut));
        const c = Math.cos(turn), n = Math.sin(turn);
        const ux = dx / (r * shadow), uy = dy / (r * shadow);
        const qx = (c * ux - n * uy) * s * shadow, qy = (n * ux + c * uy) * s * shadow;
        need = Math.max(need, 2 * Math.abs(cx - 0.5 + qx / aspect), 2 * Math.abs(0.5 - cy + qy));
      }
    }
    return Math.min(1.6, need * 1.03);
  }

  renderer.info.autoReset = false;
  function render(t, T = -1) {
    clock = t;
    renderer.info.reset();
    const fall = fallState(T);
    if (T < 0) {
      // In the fall the lean stays where it was.
      lure += ((over ? 1 : 0) - lure) * 0.06;
      if (!over && lure < 0.002) lure = 0;
    }
    const idle = !held && t - touched > 9;
    if (idle) {
      // Drift home, slowly.
      view.taz += (0 - view.taz) * 0.012;
      view.tel += (look.incl * deg - view.tel) * 0.012;
      view.tzoom += (1 - view.tzoom) * 0.012;
    }
    view.az += (view.taz - view.az) * 0.12;
    view.el += (view.tel - view.el) * 0.12;
    view.zoom += (view.tzoom - view.zoom) * 0.12;
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;

    const aspect = bufW / bufH;
    const comp = composition(aspect);
    const zoom = view.zoom * (1 + 0.035 * lure) * fall.zoom;
    const cx = comp.cx + (0.5 - comp.cx) * fall.pull, cy = comp.cy + (0.5 - comp.cy) * fall.pull;
    // The hole on screen: the radius of its shadow, as a share of the frame
    // height. In the fall the dark spreads out from it (its edge in shadow
    // radii); at the end the dark, and the glow along its edge, are past the
    // farthest corner of the frame.
    const shadow = 0.5 * comp.focal * tanShadow * zoom;
    const corner = 0.5 * Math.hypot(aspect, 1) / (shadow / fall.zoom * look.fallNear);
    const edge = 1 + Math.max(0, 1.15 * corner / (1 - look.fallRim) - 1) * fall.edge;
    const twist = fall.twist + 0.05 * lure;
    // The twisted fall looks beyond the edges of the screen, so the scene is
    // then drawn wider than the screen, by this much.
    const wide = T < 0 ? 1 : overscan(cx, cy, aspect, shadow, edge, twist, fall.squeeze);
    const focal = comp.focal * zoom / wide;
    const sx = 0.5 + (cx - 0.5) / wide, sy = 0.5 + (cy - 0.5) / wide;
    let incl = view.el + (reduced ? 0 : 0.4 * Math.sin(t * 0.05) * deg) - my * 1.2 * deg;
    incl = Math.max(2.5 * deg, Math.min(82 * deg, incl));
    const az = view.az + t * 0.0005 + mx * 2.0 * deg;
    const cam = cameraBasis(incl, az, comp.roll);
    camera.position.set(cam.cp[0], cam.cp[1], cam.cp[2]);
    camera.up.set(cam.up[0], cam.up[1], cam.up[2]);
    camera.lookAt(0, 0, 0);
    camera.fov = 2 * Math.atan(1 / focal) / deg;
    camera.aspect = aspect;
    camera.setViewOffset(bufW, bufH, (0.5 - sx) * bufW, (0.5 - sy) * bufH, bufW, bufH);
    camera.updateMatrixWorld(true);
    camDir.set(cam.cp[0] / D, cam.cp[1] / D, cam.cp[2] / D);

    const pxPerRad = 0.5 * focal * bufH;
    const tDisk = t + fall.shift;
    const pos = planetAt(tDisk);
    planet.position.set(pos[0], pos[1], pos[2]);
    planet.scale.setScalar(look.planetSize);
    planetMat.uniforms.uPlanet.value.set(pos[0], pos[1], pos[2], look.planetSize);
    planetMat.uniforms.uTime.value = tDisk;
    skyMat.uniforms.uFog.value.set(look.fog, look.fogR, look.halo, look.haloR);
    skyMat.uniforms.uRing.value = look.ring;
    skyMat.uniforms.uStars.value = look.stars;
    skyMat.uniforms.uPxPerRad.value = pxPerRad;
    gasUniforms.uGasTime.value.set(tDisk % 3600, look.spin, GAS_DRIFT);
    gasUniforms.uGasBody.value.set(look.gasIn, look.gasOut, look.gasLight, look.gasFall);
    gasUniforms.uGasDepth.value.set(look.gasDepth, look.gasThin, look.fibre, look.cloud);
    // Seen almost edge-on, ripples would fold over each other: flatten them.
    gasUniforms.uGasSheet.value.set(look.gasLift, look.gasFlare, look.hazeH, look.gasWave * Math.max(0, Math.min(1, (Math.sin(incl) - 0.03) / 0.085)));
    gasUniforms.uGasHeat.value.set(look.gasT, look.gasCool, look.gasHot, 0);
    gasUniforms.uGasVeil.value.set(look.haze, look.hazeLight, look.dust, look.dustLight);
    gasUniforms.uGasDust.value.set(look.dustIn, look.doppler, look.dopplerT, look.dustDark);
    gasUniforms.uGasEmber.value.set(look.emberSlant, look.emberFall, look.emberFar);

    // 1. The scene, in linear light.
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);

    // 2. Glare: the scene blurred into five halos, each about twice as wide
    // as the one before. Their width follows the size of the hole.
    let from = sceneRT;
    const hole = comp.focal * tanShadow * zoom / wide;
    for (let k = 0; k < 5; k++) {
      const stride = Math.max(0.3, Math.min(2.2, (k < 4 ? 1.0 : 1.6) * hole * bufH / 423));
      downMat.uniforms.uTex.value = from.texture;
      downMat.uniforms.uTexel.value.set(1 / from.width, 1 / from.height);
      pass(downMat, glare[k]);
      for (let n = 0; n < 2; n++) {
        blurMat.uniforms.uTex.value = glare[k].texture;
        blurMat.uniforms.uDir.value.set(stride / glare[k].width, 0);
        pass(blurMat, glareTmp[k]);
        blurMat.uniforms.uTex.value = glareTmp[k].texture;
        blurMat.uniforms.uDir.value.set(0, stride / glare[k].height);
        pass(blurMat, glare[k]);
      }
      from = glare[k];
    }

    // 3. Camera response.
    const cu = compositeMat.uniforms;
    cu.uScene.value = sceneRT.texture;
    cu.uBloom1.value = glare[0].texture; cu.uBloom2.value = glare[1].texture; cu.uBloom3.value = glare[2].texture;
    cu.uBloom4.value = glare[3].texture; cu.uBloom5.value = glare[4].texture;
    cu.uTime.value = t % 3600;
    cu.uExposure.value = look.exposure * fall.dim;
    cu.uGlowA.value.set(look.glow1, look.glow2, look.glow3, look.glow4);
    cu.uGlowB.value.set(look.glow5, look.white, look.knee, look.burn);
    cu.uGrade.value.set(look.vignette + fall.vignette, look.grain);
    cu.uHole.value.set(cx, 1 - cy, shadow, aspect);
    cu.uFall.value.set(edge, twist, fall.streak, fall.dark);
    cu.uFall2.value.set(fall.squeeze, look.fallTwistOut, look.fallRim, wide);
    pass(compositeMat, null);

    // Keep the link on the shadow.
    const cw = canvas.clientWidth || window.innerWidth || 0, ch = canvas.clientHeight || window.innerHeight || 0;
    const hx = cx * cw, hy = cy * ch, hr = shadow * ch;
    if (Math.abs(hx - holeX) > 0.5 || Math.abs(hy - holeY) > 0.5 || Math.abs(hr - holeR) > 0.5) {
      holeX = hx; holeY = hy; holeR = hr;
      portal.style.setProperty('--x', hx.toFixed(1) + 'px');
      portal.style.setProperty('--y', hy.toFixed(1) + 'px');
      portal.style.setProperty('--r', hr.toFixed(1) + 'px');
    }
  }

  // Queue all five programs before drawing, so the driver can link them
  // while the worker computes the tables and the page can still take input.
  postMesh.material = [downMat, blurMat, compositeMat];
  const [tables] = await Promise.all([
    tableData, renderer.compileAsync(scene, camera), renderer.compileAsync(postScene, postCam)
  ]);
  if (lost) return;
  function texture(data, width, height, format, type) {
    const tex = new THREE.DataTexture(data, width, height, format, type);
    tex.needsUpdate = true;
    return tex;
  }
  planetMat.uniforms.uLens.value = texture(tables.lens, LUT_W, LUT_H, THREE.RGBAFormat, THREE.FloatType);
  skyMat.uniforms.uSky.value = texture(tables.sky, SKY_W, 1, THREE.RGBAFormat, THREE.FloatType);
  gasUniforms.uRays.value = texture(tables.rays, RAY_W, RAY_H, THREE.RGFormat, THREE.FloatType);
  const gas = texture(tables.gas, GAS_W, GAS_H, THREE.RGBAFormat, THREE.UnsignedByteType);
  gas.wrapS = gas.wrapT = THREE.RepeatWrapping;
  gas.magFilter = THREE.LinearFilter;
  gas.minFilter = THREE.LinearMipmapLinearFilter;
  gas.generateMipmaps = true;
  gas.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  gasUniforms.uGas.value = gas;

  // ---- Loop: at most about 80 frames a second, fewer pixels on slow machines ----
  const t0 = performance.now();
  let last = 0, lastDraw = 0, shown = false;
  let gaps = [], tuned = 0, pace = 0, trial = null;
  function frame(now) {
    if (lost) return;
    requestAnimationFrame(frame);
    if (gone) return;                     // gone through to the blog: nothing more to draw
    if (!sceneRT || sizeChanged()) {
      if (!resize()) return;
      last = 0;
      pending = Math.max(pending, 1);
    }
    if (reduced) {
      // A still picture: drawn again only while the view is being moved.
      if (pending > 0) { pending--; render(0); if (!shown) { shown = true; root.classList.add('is-live'); } }
      return;
    }
    if (now - lastDraw < 12) return;
    if (last) gaps.push(now - last);
    last = now;
    lastDraw = now;
    // Fit the picture to the machine. Every 0.6 s the usual time between
    // frames is taken (the median, so one hitch does not count) and compared
    // with the pace of the screen. Well behind it, the picture is drawn with
    // fewer pixels.
    if (!tuned) tuned = now + 500;         // let the first frames settle
    if (now - tuned > 600 && gaps.length > 5) {
      const typical = gaps.sort((a, b) => a - b)[gaps.length >> 1];
      gaps = [];
      tuned = now;
      if (typical > 250) {
        // A few frames a second on a real graphics chip: the browser is
        // holding a page back that nobody is looking at. Change nothing.
        trial = null;
      } else if (trial) {
        // Did fewer pixels help? If not, and frames still come at a fair
        // rate, the browser itself holds that rate (a power-saving mode, a
        // slow screen): take it as the pace and give the pixels back.
        if (typical > 0.9 * trial.typical && typical <= 60) {
          quality = trial.quality;
          pace = typical;
          resize();
        }
        trial = null;
      } else {
        if (!pace && typical < 24) pace = typical;
        const full = pace || 19;
        if (typical > 1.5 * full && typical > 26 && quality > 0.45) {
          trial = { quality, typical };
          quality = Math.max(0.45, quality - 0.15);
          resize();
        }
      }
    }
    const T = fallAt ? (now - fallAt) / 1000 : -1;
    render((now - t0) / 1000, T);
    if (!shown) { shown = true; root.classList.add('is-live'); }
    if (T >= FALL) leave();               // dark: through to the other side
  }
  document.addEventListener('visibilitychange', () => { last = 0; gaps = []; trial = null; });
  glFall = {
    reset() {
      held = false; over = false; lure = 0; pending = 240;
      canvas.classList.remove('is-held');
      last = 0; gaps = []; trial = null;
    }
  };
  requestAnimationFrame(frame);

  if (debug) {
    window.__bh = {
      gl, hdr, isGL2: true, look, quality: () => quality, render, fall: FALL, boot: Math.round(performance.now() - booted),
      // Raw framebuffers, for the render check.
      targets: () => {
        const raw = t => { const p = renderer.properties.get(t); return { fb: p.__webglFramebuffer, ok: !!p.__webglFramebuffer }; };
        return { scene: raw(sceneRT), glare: glare.map(raw), glareTmp: glareTmp.map(raw) };
      },
      info: () => ({ triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, pace, quality })
    };
  }
}

// Acquiring the graphics context can stall even before any shaders compile.
// Give the browser a paint with the title and the working link first.
requestAnimationFrame(() => setTimeout(() => {
  start().catch(e => fail(e && e.message ? e.message : 'failed to start'));
}, 0));
  </script>
</body>
</html>
