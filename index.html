<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Gargantua — a black hole rendered live in the browser.">
  <title>Gargantua · Zipeng</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080c14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23dcd4e4' stroke-width='2'/%3E%3Cpath d='M3 22L29 10' stroke='%23e6cba5' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --space: #02040a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--space);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: rgba(255, 255, 255, 0.92);
      font-family: "Inter", "Helvetica Neue", "Segoe UI", "SF Pro Display", Roboto, sans-serif;
      background: var(--space);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #gargantua {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Static stand-in for browsers without WebGL. */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 75% 42%, rgba(148, 118, 70, 0.06), transparent 54%),
        radial-gradient(ellipse at 40% 0%, #081019, #020407 72%);
    }

    .fallback-disk {
      position: absolute;
      left: 75%;
      top: 42%;
      width: max(118vw, 148vh);
      height: max(118vw, 148vh);
      transform: translate(-50%, -50%) rotate(-22deg);
    }

    .fallback-disk::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      height: 44%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle,
        #171922 0 37%,
        #4e4e62 39%,
        #d9d6e5 41%,
        #eee8e7 44%,
        #f4eeea 49%,
        #c6bbc2 52%,
        rgba(194, 188, 209, 0.20) 61%,
        rgba(194, 188, 209, 0) 70%);
    }

    .fallback-disk::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 51%;
      width: 100%;
      height: 8%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(244, 235, 229, 0.97) 0%,
        rgba(224, 207, 186, 0.8) 18%,
        rgba(157, 130, 93, 0.40) 40%,
        rgba(114, 120, 134, 0) 70%);
      filter: blur(4px);
    }

    .no-webgl #gargantua {
      display: none;
    }

    .no-webgl .fallback {
      display: block;
    }

    .caption {
      position: fixed;
      left: clamp(24px, 5vw, 72px);
      bottom: clamp(24px, 5vh, 56px);
      z-index: 1;
      max-width: min(540px, 82vw);
      pointer-events: none;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.85);
    }

    .caption-eyebrow {
      color: rgba(255, 255, 255, 0.42);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .caption-title {
      margin: 14px 0 0;
      color: rgba(255, 255, 255, 0.95);
      font-size: clamp(30px, 3.4vw, 48px);
      font-weight: 200;
      letter-spacing: 0.22em;
      line-height: 1;
      text-transform: uppercase;
    }

    .caption-line {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.62);
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 300;
      letter-spacing: 0.07em;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .caption {
        max-width: 88vw;
      }

      .caption-title {
        letter-spacing: 0.16em;
      }

      .fallback-disk {
        left: 58%;
        top: 37%;
        width: 125vh;
        height: 125vh;
      }
    }
  </style>
  <noscript>
    <style>
      #gargantua { display: none; }
      .fallback { display: block; }
    </style>
  </noscript>
</head>
<body>
  <canvas id="gargantua" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"><div class="fallback-disk"></div></div>

  <main class="caption" aria-label="Gargantua">
    <div class="caption-eyebrow">Event horizon</div>
    <h1 class="caption-title">Gargantua</h1>
    <p class="caption-line">Light bends. Time slows. Nothing escapes.</p>
  </main>

  <script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
  </script>

  <!-- Disk material: rendered every frame into a (azimuth x radius) texture with
       mipmaps, so the ray tracer can sample it filtered at any magnification. -->
  <script id="fs-disk" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uSize;
uniform float uTime;

const float TAU = 6.28318530717959;
const float R_IN = 2.0;
const float R_OUT = 22.0;
const float LOG_SPAN = 2.3978953;   // log(R_OUT / R_IN): texture rows are uniform in log-radius

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

// Gradient noise, periodic along y with integer period py (tiles around the ring).
float gnoise(vec2 p, float py) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float y0 = mod(i.y, py);
  float y1 = mod(i.y + 1.0, py);
  vec2 g00 = hash22(vec2(i.x, y0)) * 2.0 - 1.0;
  vec2 g10 = hash22(vec2(i.x + 1.0, y0)) * 2.0 - 1.0;
  vec2 g01 = hash22(vec2(i.x, y1)) * 2.0 - 1.0;
  vec2 g11 = hash22(vec2(i.x + 1.0, y1)) * 2.0 - 1.0;
  float n = mix(mix(dot(g00, f), dot(g10, f - vec2(1.0, 0.0)), u.x),
                mix(dot(g01, f - vec2(0.0, 1.0)), dot(g11, f - vec2(1.0, 1.0)), u.x), u.y);
  return clamp(0.5 + 0.9 * n, 0.0, 1.0);
}

float fbm(vec2 p, float py, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 6; k++) {
    if (k >= oct) break;
    v += a * gnoise(p, py);
    norm += a;
    p = p * 2.0 + vec2(17.0, 0.0);
    py *= 2.0;
    a *= 0.5;
  }
  return v / norm;
}

// Long orbital light strands with irregular spacing, thickness and intensity.
// Only a fraction of a strand's spacing is displaced: no folded smoke curls.
// Analytic footprint broadening preserves the energy of sub-texel light lines.
float strands(float r, float psi, float frequency, float seed) {
  float q = log(r / R_IN) * frequency + seed * 1.7;
  float footprint = frequency * LOG_SPAN / uSize.y;
  float line = 0.0;
  for (int k = -1; k <= 1; k++) {
    float id = floor(q) + float(k);
    vec2 rnd = hash22(vec2(id + seed, seed + 17.0));
    float phase = rnd.y * TAU;
    float center = id + 0.18 + 0.64 * rnd.x
                 + 0.08 * sin(2.0 * psi + phase) + 0.03 * sin(5.0 * psi - phase);
    // Dense inner light overlaps; outer strands stay thin and intermittent.
    float crowd = 1.0 - smoothstep(3.0, 6.0, r);
    float width = (0.025 + 0.06 * rnd.y) * mix(0.85, 2.5, crowd);
    float sigma = sqrt(width * width + footprint * footprint * 0.09);
    float d = (q - center) / sigma;
    float core = exp(-0.5 * d * d) * width / sigma;
    float period = 32.0 + floor(rnd.x * 24.0);
    float light = gnoise(vec2(id * 1.37 + seed, psi * (period / TAU) + phase), period);
    float along = 0.002 + 1.5 * pow(smoothstep(0.24, 0.76, light), 1.6);
    float selection = mix(smoothstep(0.30, 0.65, rnd.y), 1.0, crowd);
    line += core * along * (0.35 + 1.9 * rnd.x * rnd.x) * selection;
  }
  return line;
}

// One octave of orbit-aligned streak noise: `fr` cells per unit of log-radius
// (thin across the orbit) and `fp` cells around the ring (long along it).
// An octave a texel can no longer resolve fades to its mean instead of aliasing.
float streakOctave(float lr, float psi, float fr, float fp, float seed, float texLr) {
  float n = gnoise(vec2(lr * fr + seed, psi * (fp / TAU) + seed * 0.37), fp);
  return mix(0.5, n, smoothstep(1.2, 2.6, 1.0 / (fr * texLr)));
}

// Long-exposure trails of glowing dust: a dense field of short, thin streaks
// at four scales, most of them faint and a few bright.
float streakField(float lr, float psi, float seed, float texLr) {
  return 0.14 * streakOctave(lr, psi, 22.0, 13.0, seed, texLr)
       + 0.32 * streakOctave(lr, psi, 60.0, 29.0, seed + 11.0, texLr)
       + 0.30 * streakOctave(lr, psi, 150.0, 53.0, seed + 29.0, texLr)
       + 0.24 * streakOctave(lr, psi, 360.0, 101.0, seed + 47.0, texLr);
}

// Short bright grains: dust caught in the light, each only a dash long.
float specks(float lr, float psi, float seed, float texLr) {
  float n = streakOctave(lr, psi, 260.0, 230.0, seed + 71.0, texLr);
  return pow(clamp((n - 0.55) / 0.30, 0.0, 1.0), 2.0);
}

// Light is layered by density: an unresolved glow that is continuous near the
// hole and patchy further out, a dense field of fine dust trails, and a few
// brighter, longer light strands on top. `band` carries soft concentric
// banding for the merged inner sheet.
float material(float r, float psi, float seed, out float heat, out float body, out float band) {
  float lr = log(r / R_IN);
  float texLr = LOG_SPAN / uSize.y;
  float envelope = fbm(vec2(lr * 6.0 + seed, psi * (9.0 / TAU)), 9.0, 2);
  float crowd = 1.0 - smoothstep(3.0, 6.0, r);
  float bundles = smoothstep(0.28, 0.68, envelope);

  float field = streakField(lr, psi, seed, texLr);
  float trails = pow(clamp((field - 0.37) / 0.27, 0.0, 1.0), 1.5);
  float grains = specks(lr, psi, seed, texLr);
  float lines = 0.35 * strands(r, psi, 95.0, seed)
              + 0.70 * strands(r, psi + 0.73, 230.0, seed + 23.0);

  float glow = mix(0.05 + 0.30 * bundles * bundles, 0.60, crowd) * (0.55 + 0.9 * field);
  float density = mix(0.42 + 0.72 * bundles, 1.0, crowd);
  heat = clamp(0.22 + 0.60 * trails + 0.20 * lines + 0.3 * grains, 0.0, 1.0);
  body = mix(0.30 + 0.65 * bundles, 0.92, crowd);
  band = fbm(vec2(lr * 26.0 + seed * 0.5, psi * (3.0 / TAU)), 3.0, 2);
  return glow + density * (1.2 * trails + lines) + 0.35 * grains * (1.0 - 0.6 * crowd);
}

float omegaAt(float r) {
  return 1.25 * pow(r, -1.5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float phi = uv.x * TAU;
  float r = R_IN * exp(uv.y * LOG_SPAN);

  // Keplerian differential rotation. Two layers are cross-faded so the shear
  // never winds up without bound, with no brightness jump at the wrap.
  float omega = omegaAt(r);
  float omega0 = omegaAt(3.5);
  float P = 44.0;
  float tA = fract(uTime / P);
  float tB = fract(tA + 0.5);
  float sA = (tA - 0.5) * P;
  float sB = (tB - 0.5) * P;
  float wA = 0.5 - 0.5 * cos(tA * TAU);
  float wB = 1.0 - wA;
  float base = phi - omega0 * uTime;
  float hA, hB, dA, dB, bA, bB;
  float nA = material(r, base - (omega - omega0) * sA, 0.0, hA, dA, bA);
  float nB = material(r, base - (omega - omega0) * sB + 2.1, 37.0, hB, dB, bB);
  // Linear blending keeps the radial brightness profile stable over the cycle.
  float m = wA * nA + wB * nB;
  float h = wA * hA + wB * hB;
  gl_FragColor = vec4(clamp(m, 0.0, 4.0) * 0.25, clamp(h, 0.0, 1.0), wA * dA + wB * dB, wA * bA + wB * bB);
}
  </script>

  <!-- Softens the disk texture: motion blur along the orbit that follows the
       local angular speed, plus a small radial soften. -->
  <script id="fs-diskblur" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D uTex;
uniform vec2 uSize;
uniform vec2 uDir;
uniform float uSigma;
const float R_IN = 2.0;
const float R_OUT = 22.0;
const float LOG_SPAN = 2.3978953;   // log(R_OUT / R_IN): texture rows are uniform in log-radius
void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float r = R_IN * exp(uv.y * LOG_SPAN);
  float sigma = uDir.x > 0.5 ? max(uSigma * pow(R_IN / r, 1.5), 0.35) : uSigma;
  vec2 stp = uDir / uSize * (sigma * 0.5);
  vec4 acc = vec4(0.0);
  float wsum = 0.0;
  for (int k = -6; k <= 6; k++) {
    float x = float(k) * 0.5;
    float w = exp(-0.5 * x * x);
    acc += texture2D(uTex, uv + stp * float(k)) * w;
    wsum += w;
  }
  gl_FragColor = acc / wsum;
}
  </script>

  <script id="fs-trace" type="x-shader/x-fragment">
precision highp float;
precision highp int;
varying vec2 vUv;
uniform vec2 uRes;
uniform vec2 uJitter;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform vec3 uCamFwd;
uniform float uFocal;
uniform vec2 uCenter;
uniform float uEnc;
uniform int uMaxSteps;
uniform float uDoppler;
uniform float uHaze;
uniform float uPxPerRad;
uniform float uRingBand;  // half-width of the supersampled photon-ring band, in impact parameter
uniform sampler2D uDisk;
uniform vec2 uDiskSize;
uniform vec4 uPlanet;     // xyz centre, w radius (world units)
uniform vec3 uGalaxy;     // direction of a faint background galaxy
uniform vec3 uMwNormal;   // Milky Way plane normal
uniform vec3 uMwCentre;   // direction of the galactic centre, in that plane

// Units: Schwarzschild radius rs = 1 (M = 0.5). Black hole at the origin,
// accretion disk in the y = 0 plane, camera a little above the plane.
const float PI = 3.14159265358979;
const float TAU = 6.28318530717959;
const float R_IN = 2.0;
const float R_OUT = 22.0;
const float LOG_SPAN = 2.3978953;   // log(R_OUT / R_IN): texture rows are uniform in log-radius
const float B_SKIP = 23.5;
const float B_CRIT = 2.5980762;   // photon-sphere impact parameter, 3*sqrt(3)/2 rs
const float R_ESC = 30.0;
const int MAX_STEPS = 900;

#ifdef ES3
#define STEP_BOUND uMaxSteps
#define DISK_LOD(uv, l) textureLod(uDisk, uv, l)
#else
#define STEP_BOUND MAX_STEPS
#ifdef HAS_LOD
#define DISK_LOD(uv, l) texture2DLodEXT(uDisk, uv, l)
#else
#define DISK_LOD(uv, l) texture2D(uDisk, uv)
#endif
#endif

vec3 enc(vec3 c) {
  return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c;
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise(p);
    norm += a;
    p = p * 2.0 + vec2(31.0, 17.0);
    a *= 0.5;
  }
  return v / norm;
}

// Colour of the gas by radius; `shift` moves along the ramp so brighter
// filaments read hotter and dim gaps cooler.
vec3 palette(float r, float shift) {
  float t = clamp((r - R_IN) / 10.5 + shift, 0.0, 1.35);
  vec3 c0 = vec3(1.00, 0.94, 0.89);   // pearly white light
  vec3 c1 = vec3(1.00, 0.82, 0.65);   // pale champagne
  vec3 c2 = vec3(0.90, 0.67, 0.44);   // fine amber light
  vec3 c3 = vec3(0.50, 0.37, 0.27);   // faint bronze dust
  vec3 c4 = vec3(0.24, 0.18, 0.13);   // fading outer dust
  vec3 c5 = vec3(0.17, 0.16, 0.17);   // cool grey outer disk
  if (t < 0.16) return mix(c0, c1, smoothstep(0.0, 0.16, t));
  if (t < 0.36) return mix(c1, c2, smoothstep(0.16, 0.36, t));
  if (t < 0.58) return mix(c2, c3, smoothstep(0.36, 0.58, t));
  if (t < 0.80) return mix(c3, c4, smoothstep(0.58, 0.80, t));
  return mix(c4, c5, smoothstep(0.80, 1.35, t));
}

vec2 diskUv(float r, float phi) {
  return vec2(phi / TAU + 0.5, log(r / R_IN) / LOG_SPAN);
}

// s: path length so far, turn: how far the ray has been bent (lensed images
// are compressed, so they need coarser texture samples).
vec3 diskSample(vec3 hit, vec3 dir, float s, float turn, out float alpha) {
  float r = length(hit.xz);
  float phi = atan(hit.z, hit.x);
  vec2 uv = diskUv(r, phi);

  float foot = s * 2.0 / (uFocal * uRes.y);
  float lodR = log2(max(foot / max(abs(dir.y), 0.4) * uDiskSize.y / (r * LOG_SPAN), 1e-4));
  float lodP = log2(max(foot * uDiskSize.x / (TAU * r), 1e-4));
  // Higher-order images (rays that went more than half way round) squeeze the
  // whole disk into a hair-thin ring, so they get a very coarse sample.
  // Four taps cover the long footprint axis without blurring the short axis
  // equally. Isotropic mip selection erased the lensed sheet's fine eddies.
  float major = max(lodR, lodP);
  float minor = min(lodR, lodP);
  float lod = max(max(minor, major - 2.0), 0.0)
            + smoothstep(2.6, 3.4, turn) * 5.0;
  vec2 axis = lodR > lodP ? vec2(0.0, exp2(lodR) / uDiskSize.y)
                         : vec2(exp2(lodP) / uDiskSize.x, 0.0);
  vec4 tx = (DISK_LOD(uv - axis * 0.375, lod) + DISK_LOD(uv - axis * 0.125, lod)
           + DISK_LOD(uv + axis * 0.125, lod) + DISK_LOD(uv + axis * 0.375, lod)) * 0.25;
  // Separate emissive filaments from the absorbing gaps without lifting the
  // whole disk. Filter first, then shape contrast to keep sub-pixel lines stable.
  float tex = 1.45 * pow(max(tx.r * 4.0, 0.0), mix(1.35, 1.15, smoothstep(2.0, 7.0, r)));
  float heat = tx.g;
  // The brightest closely packed strands form an unresolved light sheet.
  // Its radiance comes from the same material, filtered across adjacent lines.
  float gathered = DISK_LOD(uv, lod + 2.0).r * 4.0;
  float hot = exp(-pow((r - 2.65) / 1.30, 2.0));

  float edgeIn = smoothstep(R_IN, R_IN + 0.12, r);
  float edgeOut = 1.0 - smoothstep(4.5, 16.0, r);
  float prof = pow(R_IN / r, 1.85);
  float I = 2.1 * prof * edgeIn * edgeOut * tex;
  // Retain fine traces on the shoulder while the core merges into white light.
  float banding = 0.78 + 0.44 * smoothstep(0.28, 0.72, tx.a);
  I += edgeIn * edgeOut * hot * (0.70 + 1.8 * gathered) * banding;
  I *= mix(1.0, mix(0.48, 1.15, smoothstep(0.25, 0.70, tx.b)), smoothstep(2.6, 5.0, r));
  I *= mix(1.0, 0.55, smoothstep(2.4, 3.1, turn));
  I *= mix(1.0, 0.35, smoothstep(0.22, 0.60, abs(dir.y)) * (1.0 - smoothstep(0.3, 0.9, turn)));

  // Relativistic beaming of the orbiting gas (photon travels along -dir).
  float beta = sqrt(0.5 / r);
  vec3 vel = vec3(-hit.z, 0.0, hit.x) / r * beta;
  float gam = 1.0 / sqrt(1.0 - beta * beta);
  float delta = 1.0 / (gam * (1.0 - dot(vel, -dir)));
  I *= pow(delta, 2.0 * uDoppler);
  vec3 col = palette(r, 0.10 - 0.20 * heat);
  // Cooler, sparse material between the hot filaments adds depth locally;
  // there is no global dust/grey overlay across the shadow or background.
  col = mix(vec3(0.13, 0.16, 0.20), col, smoothstep(0.24, 0.64, tx.b));
  col = mix(col, vec3(1.0, 0.94, 0.83), smoothstep(0.64, 0.90, heat) * 0.32);
  col = mix(col, vec3(1.0, 0.98, 1.015), hot * 0.68);
  float sh = mix(1.0, delta, uDoppler);
  col = mix(col, col * vec3(0.86, 0.95, 1.18), clamp((sh - 1.0) * 1.5, 0.0, 1.0));
  col = mix(col, col * vec3(1.12, 0.82, 0.62), clamp((1.0 - sh) * 1.5, 0.0, 1.0));

  alpha = 0.95 * edgeIn * (1.0 - smoothstep(R_OUT * 0.35, R_OUT * 0.85, r));
  return col * I;
}

vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

float hash31(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}

// 3D value noise on directions: no seams, unlike the octahedral star map.
float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm3(vec3 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise3(p);
    norm += a;
    p = p * 2.03 + vec3(17.1, 31.7, 7.3);
    a *= 0.5;
  }
  return v / norm;
}

// Photographic star colour from surface temperature (thousands of kelvin):
// an approximate blackbody ramp at unit luminance, slightly desaturated the
// way a camera renders it.
vec3 starColour(float tk) {
  vec3 c;
  if (tk < 4.0) c = mix(vec3(1.00, 0.56, 0.28), vec3(1.00, 0.76, 0.52), clamp((tk - 2.8) / 1.2, 0.0, 1.0));
  else if (tk < 5.8) c = mix(vec3(1.00, 0.76, 0.52), vec3(1.00, 0.94, 0.86), (tk - 4.0) / 1.8);
  else if (tk < 7.5) c = mix(vec3(1.00, 0.94, 0.86), vec3(0.93, 0.95, 1.00), (tk - 5.8) / 1.7);
  else c = mix(vec3(0.93, 0.95, 1.00), vec3(0.68, 0.77, 1.00), clamp((tk - 7.5) / 5.0, 0.0, 1.0));
  return mix(vec3(1.0), c / dot(c, vec3(0.2126, 0.7152, 0.0722)), 0.8);
}

// A faint Milky Way: unresolved starlight in a band along the galactic plane,
// wider and warmer towards the galactic centre, broken by a dark dust rift
// and scattered dust clouds. `dens` scales the resolved star density.
vec3 milkyWay(vec3 d, out float dens) {
  float lat = dot(d, uMwNormal);
  float lon = atan(dot(d, cross(uMwNormal, uMwCentre)), dot(d, uMwCentre));
  float bulge = exp(-lon * lon / 0.45);
  float width = 0.075 + 0.085 * bulge;
  float band = exp(-lat * lat / (width * width));
  dens = 0.0;
  if (band < 0.004) return vec3(0.0);
  float n1 = fbm3(d * 7.0, 4);
  float n2 = fbm3(d * 19.0 + 4.0, 3);
  float riftLat = lat + 0.02 * (fbm3(d * 11.0 + 9.0, 3) - 0.5);
  float rift = exp(-riftLat * riftLat / (0.16 * width * width)) * smoothstep(0.32, 0.58, n1);
  float clouds = smoothstep(0.55, 0.75, n2) * 0.55 * band;
  float dust = clamp(0.85 * rift + clouds, 0.0, 0.92);
  dens = band * (0.45 + 0.55 * n1) * (1.0 - 0.8 * dust);
  vec3 tint = mix(vec3(0.62, 0.70, 0.88), vec3(1.00, 0.86, 0.68), 0.8 * bulge);
  return tint * band * (0.3 + 0.7 * n1 * n1) * (1.0 - dust) * (0.7 + 0.6 * bulge);
}

vec3 octaDecode(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  vec3 d = vec3(uv.x, 1.0 - abs(uv.x) - abs(uv.y), uv.y);
  float t = max(-d.y, 0.0);
  d.x += d.x >= 0.0 ? -t : t;
  d.z += d.z >= 0.0 ? -t : t;
  return normalize(d);
}

// Offset from the ray direction to a star direction, in screen pixels and
// measured as a true angle, so stars stay round wherever they sit on the sky.
vec2 starOffset(vec3 d, vec3 sd) {
  vec3 diff = sd - d;
  vec3 ax = normalize(cross(d, vec3(0.0, 1.0, 0.0)) + vec3(1e-4, 0.0, 0.0));
  vec3 ay = cross(ax, d);
  return vec2(dot(diff, ax), dot(diff, ay)) * uPxPerRad;
}

// One layer of stars, at most one per sky cell. Counts follow a power law
// in brightness, N(>F) ~ F^-slope from bMin up to bMax, so most stars are
// barely visible pinpoints and a few dominate. Colour follows temperature;
// density rises in the Milky Way (`mw`) and in loose clusters. Each star is a
// small Gaussian measured in true screen pixels; wide glows come from the
// camera bloom.
vec3 starLayer(vec3 d, vec2 unit, float cells, float dens, float bMin, float bMax, float slope, float seed, float mw) {
  vec2 uv = unit * cells;
  vec2 ci = floor(uv);
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o + seed;
      vec3 h = hash23(c);
      // Per star, not per pixel: every pixel must agree on whether it exists.
      float clump = vnoise(c / 7.0 + seed * 0.37);
      float dn = dens * (0.35 + 1.3 * smoothstep(0.3, 0.8, clump)) * (1.0 + 4.0 * mw);
      if (h.z < dn) {
        vec2 sp = starOffset(d, octaDecode((ci + o + h.xy) / cells));
        float d2 = dot(sp, sp);
        float br = min(bMin * pow(max(hash21(c + 19.7), 1e-4), -1.0 / slope), bMax);
        float tk = 2.8 + 9.0 * pow(hash21(c + 5.1), 1.4);
        float halo = 0.035 * exp(-d2 / 16.0) * smoothstep(0.08, 0.8, br);
        col += starColour(tk) * (br * (exp(-d2 / 1.3) + halo));
      }
    }
  }
  return col;
}

// A distant spiral seen at an angle: exponential disk with two faint arms, a
// warm bulge and a dust lane on the near side. Sizes are in milliradians.
vec3 galaxy(vec3 d) {
  if (dot(d, uGalaxy) < 0.995) return vec3(0.0);
  vec3 ga = normalize(cross(uGalaxy, vec3(0.0, 1.0, 0.0)));
  vec3 gb = cross(uGalaxy, ga);
  vec2 g = vec2(dot(d, ga), dot(d, gb)) * 1000.0;
  g = vec2(g.x * 0.80 + g.y * 0.60, -g.x * 0.60 + g.y * 0.80);
  vec2 q = vec2(g.x, g.y / 0.34);
  float rr = length(q);
  float arms = 0.6 + 0.4 * cos(2.0 * (atan(q.y, q.x) - 1.7 * log(rr + 1.0)));
  float lane = 1.0 - 0.5 * exp(-pow((g.y + 1.0) / 0.9, 2.0)) * smoothstep(2.0, 8.0, abs(g.x));
  return vec3(0.74, 0.80, 1.00) * (exp(-rr / 12.0) * arms * lane * 0.034)
       + vec3(1.00, 0.88, 0.72) * (exp(-dot(g, g) / 9.0) * 0.05);
}

// `fade` thins out the point stars for rays bent hard around the hole, where
// the whole sky is squeezed into a thin ring; the smooth glow stays.
vec3 starfield(vec3 d, float fade) {
  vec2 unit = octa(d);
  float mwDens;
  vec3 mw = milkyWay(d, mwDens);

  // Field stars (a few bright, many faint) and a dense layer of barely
  // resolved ones that gives the sky its texture.
  vec3 col = starLayer(d, unit, 180.0, 0.30, 0.0040, 1.2, 1.25, 0.0, mwDens)
           + starLayer(d, unit, 520.0, 0.15, 0.0020, 0.03, 1.6, 31.0, mwDens);
  col *= fade;
  col += mw * 0.020;

  // Deep blue rather than black, a touch lighter towards the top of the sky.
  float n1 = fbm3(d * 3.0 + 1.7, 2);
  col += vec3(0.0015, 0.0030, 0.0048) * (0.5 + 0.5 * n1);
  col += vec3(0.002, 0.004, 0.006) * smoothstep(-0.2, 0.7, d.y);
  col += galaxy(d) * fade;
  return col;
}

vec3 rayDir(vec2 pixelOffset) {
  vec2 ndc = ((gl_FragCoord.xy + uJitter + pixelOffset) / uRes) * 2.0 - 1.0 - uCenter;
  float aspect = uRes.x / uRes.y;
  return normalize(uCamFwd * uFocal + uCamRight * (ndc.x * aspect) + uCamUp * ndc.y);
}

// An ocean world like the one in the film. Lit by the hot inner disk, a broad
// source, so the terminator is soft; faintly lit from the disk plane on the
// side facing it. Cloud bands drift as it spins, the ocean glints, and a thin
// atmosphere brightens the limb and rings the planet when it is backlit.
vec3 planetShade(vec3 hp, vec3 rd) {
  vec3 n = normalize(hp - uPlanet.xyz);
  vec3 toHole = normalize(-uPlanet.xyz);
  float ndl = dot(n, toHole);
  float key = pow(clamp((ndl + 0.22) / 1.22, 0.0, 1.0), 1.5);
  float fill = clamp(n.y * (uPlanet.y > 0.0 ? -1.0 : 1.0), 0.0, 1.0) * 0.18;
  vec3 axis = normalize(vec3(0.34, 1.0, 0.0));
  float spin = uTime * 0.06;
  vec3 sn = n * cos(spin) + cross(axis, n) * sin(spin) + axis * dot(axis, n) * (1.0 - cos(spin));
  float clouds = fbm3(vec3(sn.x * 3.0, dot(sn, axis) * 9.0, sn.z * 3.0) + 5.0, 4);
  float cover = smoothstep(0.50, 0.72, clouds);
  vec3 albedo = mix(vec3(0.075, 0.105, 0.14), vec3(0.50, 0.52, 0.55), cover);
  vec3 light = vec3(1.00, 0.95, 0.88);
  vec3 c = albedo * light * (1.35 * key + fill);
  vec3 hv = normalize(toHole - rd);
  c += light * (pow(max(dot(n, hv), 0.0), 90.0) * 1.2 * (1.0 - cover) * step(0.0, ndl));
  float limb = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
  float back = pow(max(dot(rd, toHole), 0.0), 6.0);
  c += vec3(0.42, 0.60, 1.00) * limb * (0.05 + 0.55 * key + 1.4 * back);
  return c;
}

vec3 traceRay(vec3 dir, out float cover) {
  cover = 0.0;
  vec3 p = uCamPos;
  vec3 v = dir;
  float cd = dot(p, v);
  float b2 = dot(p, p) - cd * cd;
  float b = sqrt(max(b2, 0.0));

  vec3 col = vec3(0.0);
  float T = 1.0;

  if (b > B_SKIP) {
    // Far from the hole: weak-field deflection, applied analytically.
    float L = -cd;
    vec3 q = p + v * L;
    vec3 n = -q / b;
    float frac = 0.5 + L * (2.0 * L * L + 3.0 * b2) / (4.0 * pow(b2 + L * L, 1.5));
    float alpha = 2.0 / b * frac;
    col = starfield(normalize(v * cos(alpha) + n * sin(alpha)), 1.0);
  } else {
    float h2 = b2;
    float planetDist = length(uPlanet.xyz);
    bool escaped = false;
    vec3 prev = p;
    float s = 0.0;
    for (int i = 0; i < STEP_BOUND; i++) {
#ifndef ES3
      if (i >= uMaxSteps) break;
#endif
      float r2 = dot(p, p);
      float r = sqrt(r2);
      if (r2 < 1.0) break;
      if (r > R_ESC && dot(p, v) > 0.0) { escaped = true; break; }

      // Velocity Verlet: second-order accurate, so orbits near the photon
      // sphere keep their phase and the shadow edge stays smooth.
      float dt = clamp(r * 0.035, 0.01, 0.7);
      vec3 a = -1.5 * h2 * p / (r2 * r2 * r);
      vec3 pn = p + v * dt + a * (0.5 * dt * dt);
      float rn2 = max(dot(pn, pn), 0.04);
      vec3 an = -1.5 * h2 * pn / (rn2 * rn2 * sqrt(rn2));
      v += (a + an) * (0.5 * dt);
      p = pn;
      s += dt;

      // The planet is tested against this step of the bent ray, so its image
      // is lensed like everything else near the hole.
      // Only steps inside the thin shell of the planet's orbital radius can
      // reach it; everything else skips the test.
      float tPlanet = 2.0;
      vec3 seg = p - prev;
      vec3 mid = (prev + p) * 0.5 - uPlanet.xyz;
      if (abs(r - planetDist) < uPlanet.w + 1.5 * dt && dot(mid, mid) < (uPlanet.w + dt) * (uPlanet.w + dt)) {
        vec3 oc = prev - uPlanet.xyz;
        float qa = dot(seg, seg);
        float qb = dot(oc, seg);
        float disc = qb * qb - qa * (dot(oc, oc) - uPlanet.w * uPlanet.w);
        if (disc > 0.0) {
          float th = (-qb - sqrt(disc)) / qa;
          if (th >= 0.0 && th <= 1.0) tPlanet = th;
        }
      }

      if (prev.y * p.y < 0.0 && prev.y / (prev.y - p.y) < tPlanet) {
        float t = prev.y / (prev.y - p.y);
        vec3 hit = mix(prev, p, t);
        float rh = length(hit.xz);
        if (rh > R_IN && rh < R_OUT) {
          vec3 vd = normalize(v);
          float turn = acos(clamp(dot(dir, vd), -1.0, 1.0));
          float al;
          vec3 e = diskSample(hit, vd, s, turn, al);
          col += T * e;
          T *= 1.0 - al;
          if (T < 0.03) break;
        }
      }

      if (tPlanet <= 1.0) {
        col += T * planetShade(mix(prev, p, tPlanet), normalize(v));
        cover = T;
        T = 0.0;
        break;
      }

      if (uHaze > 0.0) {
        float ay = abs(p.y);
        float rr = length(p.xz);
        float H = 0.07 + 0.075 * rr;
        if (ay < H && rr > R_IN && rr < R_OUT) {
          float dn = 1.0 - ay / H;
          dn *= dn;
          float n = DISK_LOD(diskUv(rr, atan(p.z, p.x)), 3.0).r * 4.0;
          // Only outside the inner edge, so rays falling into the shadow stay black.
          float pr = pow(R_IN / rr, 2.2)
                   * (1.0 - smoothstep(R_OUT * 0.45, R_OUT, rr))
                   * smoothstep(R_IN, R_IN + 0.3, rr);
          col += T * palette(rr, 0.0) * (dn * pr * (0.3 + 0.5 * n) * uHaze * dt);
        }
      }
      prev = p;
    }
    if (escaped) {
      vec3 vd = normalize(v);
      float turn = acos(clamp(dot(dir, vd), -1.0, 1.0));
      col += T * starfield(vd, 1.0 - smoothstep(1.7, 2.7, turn));
    }
  }
  return col;
}

void main() {
  // Rays near the critical impact parameter either fall in or wrap around the
  // hole before reaching the disk; the photon ring packs nested images of the
  // whole disk into a pixel or two. Those pixels take four rotated-grid
  // samples (on top of the temporal jitter), everything else takes one.
  vec3 centre = rayDir(vec2(0.0));
  float cd = dot(uCamPos, centre);
  float b = sqrt(max(dot(uCamPos, uCamPos) - cd * cd, 0.0));
  int n = abs(b - B_CRIT - uRingBand * 0.25) < uRingBand ? 4 : 1;
  vec2 o = n == 1 ? vec2(0.0) : vec2(0.125, 0.375);
  vec3 col = vec3(0.0);
  float cover = 0.0;
  for (int k = 0; k < 4; k++) {
    if (k >= n) break;
    float cv;
    col += traceRay(rayDir(o), cv);
    cover += cv;
    o = vec2(-o.y, o.x);
  }
  // Alpha carries the planet coverage to the composite (1 = no planet).
  gl_FragColor = vec4(enc(col / float(n)), 1.0 - cover / float(n));
}
  </script>

  <script id="fs-resolve" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uCur;
uniform sampler2D uHist;
uniform float uAlpha;
uniform float uEnc;
uniform vec2 uTexel;
uniform float uAspect;
uniform vec4 uGuard;    // moving planet: guarded stretch from xy to zw (uv)
uniform float uGuardR;  // its half-width in uv height units, 0 = off
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c; }
void main() {
  vec3 c = dec(texture2D(uCur, vUv).rgb);
  vec3 h = dec(texture2D(uHist, vUv).rgb);
  // Around the moving planet the history is clamped to this frame's local
  // range, so the planet does not drag a ghost trail behind it.
  vec2 pa = (vUv - uGuard.xy) * vec2(uAspect, 1.0);
  vec2 ba = (uGuard.zw - uGuard.xy) * vec2(uAspect, 1.0);
  float along = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  float g = uGuardR > 0.0 ? 1.0 - smoothstep(uGuardR, uGuardR * 2.0, length(pa - ba * along)) : 0.0;
  if (g > 0.0) {
    vec3 lo = c;
    vec3 hi = c;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec3 sn = dec(texture2D(uCur, vUv + uTexel * vec2(float(i), float(j))).rgb);
        lo = min(lo, sn);
        hi = max(hi, sn);
      }
    }
    h = mix(h, clamp(h, lo, hi), g);
  }
  float aCur = texture2D(uCur, vUv).a;
  float aHist = texture2D(uHist, vUv).a;
  gl_FragColor = vec4(enc(mix(h, c, uAlpha)), mix(aHist, aCur, uAlpha));
}

  <script id="fs-bright" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
uniform float uEnc;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c; }
void main() {
  vec3 s = dec(texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb);
  s *= 0.25;
  float l = max(max(s.r, s.g), s.b);
  // A soft knee lets dimmer gold threads join the halo without a visible edge.
  float knee = max(uThreshold * 0.6, 1e-4);
  float soft = clamp(l - uThreshold + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee);
  float k = max(l - uThreshold, soft) / max(l, 1e-4);
  gl_FragColor = vec4(enc(s * k), 1.0);
}
  </script>

  <script id="fs-blur" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
uniform float uEnc;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c; }
void main() {
  vec2 o1 = uDir * 1.3846153846;
  vec2 o2 = uDir * 3.2307692308;
  vec3 c = dec(texture2D(uTex, vUv).rgb) * 0.2270270270;
  c += (dec(texture2D(uTex, vUv + o1).rgb) + dec(texture2D(uTex, vUv - o1).rgb)) * 0.3162162162;
  c += (dec(texture2D(uTex, vUv + o2).rgb) + dec(texture2D(uTex, vUv - o2).rgb)) * 0.0702702703;
  gl_FragColor = vec4(enc(c), 1.0);
}
  </script>

  <script id="fs-composite" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform sampler2D uBloom3;
uniform sampler2D uLocal;
uniform float uDetail;
uniform float uGlare;
uniform float uTime;
uniform float uEnc;
uniform float uExposure;
uniform float uBloom;
uniform float uAberration;
uniform vec2 uTexel;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
// Slight film-like soft focus: takes the edge off sub-pixel lines such as
// the photon ring without blurring the image as a whole.
vec3 soft(vec2 uv) {
  vec2 o = uTexel * 0.65;
  return dec(texture2D(uScene, uv).rgb) * 0.6
       + (dec(texture2D(uScene, uv + o).rgb) + dec(texture2D(uScene, uv - o).rgb)
        + dec(texture2D(uScene, uv + vec2(o.x, -o.y)).rgb) + dec(texture2D(uScene, uv + vec2(-o.x, o.y)).rgb)) * 0.10;
}
void main() {
  vec2 q = vUv - 0.5;
  vec2 ab = q * uAberration;
  vec3 c;
  c.r = soft(vUv + ab).r;
  c.g = soft(vUv).g;
  c.b = soft(vUv - ab).b;
  // Local contrast: how much brighter this pixel is than its surroundings.
  // Global tone mapping flattens bright light into one white sheet; restoring
  // part of this ratio keeps the fine structure visible inside the highlights.
  const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
  float lScene = dot(c, LUMA);
  float lLocal = dot(dec(texture2D(uLocal, vUv).rgb), LUMA);
  float detail = clamp((lScene + 0.03) / (lLocal + 0.03), 0.4, 2.5);
  float detailK = uDetail * smoothstep(0.35, 1.2, lLocal) * (1.0 - 0.75 * smoothstep(2.5, 7.0, lLocal));
  vec3 b1 = dec(texture2D(uBloom1, vUv).rgb);
  vec3 b2 = dec(texture2D(uBloom2, vUv).rgb);
  vec3 b3 = dec(texture2D(uBloom3, vUv).rgb);
  // A bright sheet has a close white glow, a pearl halo and a faint wide falloff.

    var planetPos = planetAt(t);
    gl.uniform4f(trace.u.uPlanet, planetPos[0], planetPos[1], planetPos[2], PLANET_SIZE);
    gl.uniform3f(trace.u.uGalaxy, galaxyDir[0], galaxyDir[1], galaxyDir[2]);
    gl.uniform3f(trace.u.uMwNormal, mwNormal[0], mwNormal[1], mwNormal[2]);
    gl.uniform3f(trace.u.uMwCentre, mwCentre[0], mwCentre[1], mwCentre[2]);
    bindTex(trace.u.uDisk, diskTex.c.tex, 0);
    draw();

    // 2. Temporal accumulation (anti-aliasing).
    var cur = targets.hist[histIndex];
    var next = targets.hist[1 - histIndex];
    // Screen guard for the resolve so the moving planet leaves no ghost trail.
    // Lensing pushes its image outward from the hole, so the guard covers the
    // stretch from its straight-line position out to 1.8 times as far.
    function toUv(P) {
      var rl = [P[0] - cp[0], P[1] - cp[1], P[2] - cp[2]];
      var dp = rl[0] * fwd[0] + rl[1] * fwd[1] + rl[2] * fwd[2];
      if (dp <= 0.1) return null;
      var ux = focal * (rl[0] * right[0] + rl[1] * right[1] + rl[2] * right[2]) / (dp * aspect);
      var uy = focal * (rl[0] * up[0] + rl[1] * up[1] + rl[2] * up[2]) / dp;
      return [(ux + centerX * 2) / 2, (uy + (1 - centerFrac) * 2) / 2];
    }
    var pUv = toUv(planetPos), hUv = toUv([0, 0, 0]);
    var guard = [0, 0, 0, 0], guardR = 0;
    if (pUv && hUv) {
      guard = [hUv[0] + (pUv[0] - hUv[0]) * 0.9, hUv[1] + (pUv[1] - hUv[1]) * 0.9,
               hUv[0] + (pUv[0] - hUv[0]) * 1.8, hUv[1] + (pUv[1] - hUv[1]) * 1.8];
      var pd = Math.sqrt(Math.pow(planetPos[0] - cp[0], 2) + Math.pow(planetPos[1] - cp[1], 2) + Math.pow(planetPos[2] - cp[2], 2));
      guardR = Math.max(4 * PLANET_SIZE / pd * 0.5 * focal * sc.h, 14) / sc.h;
    }
    gl.useProgram(resolve.p);
    bindTarget(next);
    gl.uniform1f(resolve.u.uAlpha, alpha);
    gl.uniform1f(resolve.u.uEnc, encMode);
    gl.uniform2f(resolve.u.uTexel, 1 / sc.w, 1 / sc.h);
    gl.uniform1f(resolve.u.uAspect, aspect);
    gl.uniform4f(resolve.u.uGuard, guard[0], guard[1], guard[2], guard[3]);
    gl.uniform1f(resolve.u.uGuardR, guardR);
    bindTex(resolve.u.uCur, sc.tex, 0);
    bindTex(resolve.u.uHist, cur.tex, 1);
    draw();
    histIndex = 1 - histIndex;
    histValid = true;
    frameIndex++;

    // 3. Bloom: close glow at 1/4, middle halo at 1/16, wide veil at 1/64.
    downsample(next, targets.b1a, 0.45);
    blurPass(targets.b1a, targets.b1b, 1.0);
    blurPass(targets.b1a, targets.b1b, 1.0);
    downsample(targets.b1a, targets.b2a, 0.16);
    blurPass(targets.b2a, targets.b2b, 1.5);
    blurPass(targets.b2a, targets.b2b, 1.5);
    downsample(targets.b2a, targets.b3a, 0.05);
    blurPass(targets.b3a, targets.b3b, 2.0);
    blurPass(targets.b3a, targets.b3b, 2.0);

    // Local mean (no threshold) for the composite's highlight detail.
    downsample(next, targets.l1a, 0.0);
    blurPass(targets.l1a, targets.l1b, 1.0);

    // 4. Composite, tone map, vignette, grain.
    gl.useProgram(composite.p);
    bindTarget(null);
    gl.uniform1f(composite.u.uTime, t);
    gl.uniform1f(composite.u.uEnc, encMode);
    gl.uniform1f(composite.u.uExposure, 1.05);
    gl.uniform1f(composite.u.uBloom, 1.0);
    gl.uniform1f(composite.u.uAberration, 0.00015);
    gl.uniform2f(composite.u.uTexel, 1 / next.w, 1 / next.h);
    bindTex(composite.u.uScene, next.tex, 0);
    bindTex(composite.u.uBloom1, targets.b1a.tex, 1);
    bindTex(composite.u.uBloom2, targets.b2a.tex, 2);
    bindTex(composite.u.uBloom3, targets.b3a.tex, 3);
    bindTex(composite.u.uLocal, targets.l1a.tex, 4);
    gl.uniform1f(composite.u.uDetail, 0.30);
    var holePx = 2.598 / D * 0.5 * focal * sc.h;          // apparent shadow radius
    gl.uniform1f(composite.u.uGlare, Math.min(1.0, Math.max(0.45, sc.w / (7.0 * holePx))));
    draw();
  }

  // ---- Loop: 60 fps cap, adaptive resolution, static mode ----
  var STATIC_FRAMES = 16;
  var staticFramesLeft = STATIC_FRAMES;
  var t0 = performance.now();
  var last = 0, lastDraw = 0, frameAvg = 16, frames = 0;
  var lost = false;

  function frame(now) {
    if (lost) return;
    requestAnimationFrame(frame);
    if (!targets || sizeChanged()) {
      if (!resize()) return;
      last = 0;
    }
    if (reduced) {
      // A converged still frame; re-rendered only when the viewport changes.
      if (staticFramesLeft > 0) { render(0); staticFramesLeft--; }
      return;
    }
    if (now - lastDraw < 15) return;
    if (last && now - last < 100) frameAvg = frameAvg * 0.9 + (now - last) * 0.1;
    last = now;
    lastDraw = now;
    frames++;
    if (frames > 90 && frames % 30 === 0 && frameAvg > 30 && quality > 0.35) {
      quality = Math.max(0.35, quality - 0.12);
      resize();
      frameAvg = 16;
    }
    render((now - t0) / 1000);
  }

  document.addEventListener('visibilitychange', function () { last = 0; });
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    lost = true;
    fail('WebGL context lost');
  });

  requestAnimationFrame(frame);

  if (/[?&]debug=1/.test(search)) {
    window.__bh = { gl: gl, targets: function () { return targets; }, disk: function () { return diskTex; }, render: render, hdr: hdr, isGL2: isGL2, quality: function () { return quality; } };
  }
})();
  </script>
</body>
</html>
