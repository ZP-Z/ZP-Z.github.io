<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Zipeng Blog is temporarily under construction.">
  <title>Zipeng Blog 正在施工</title>
  <link rel="icon" href="mylogos/favicon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #15171a;
      --muted: #5b6170;
      --paper: #f8f5ee;
      --paper-soft: rgba(248, 245, 238, 0.86);
      --cyan: #2a9dc5;
      --rose: #e8618b;
      --gold: #d99a2b;
      --line: rgba(21, 23, 26, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        linear-gradient(90deg, rgba(248, 245, 238, 0.96) 0%, rgba(248, 245, 238, 0.88) 45%, rgba(248, 245, 238, 0.42) 100%),
        url("images/jiangshan.png") center / cover no-repeat;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 32px clamp(20px, 5vw, 72px);
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      object-fit: cover;
      background: #fff;
      box-shadow: 0 10px 28px rgba(21, 23, 26, 0.12);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(21, 23, 26, 0.82);
      box-shadow: 0 12px 30px rgba(21, 23, 26, 0.12);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(217, 154, 43, 0.2);
    }

    .hero {
      display: grid;
      flex: 1;
      align-items: center;
      max-width: 820px;
      padding: 72px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .eyebrow::before {
      display: block;
      width: 42px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--rose), var(--gold));
      content: "";
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: 62px;
      line-height: 1.05;
      font-weight: 800;
    }

    .lead {
      max-width: 640px;
      margin: 24px 0 0;
      color: #343842;
      font-size: 20px;
      line-height: 1.8;
    }

    .note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      max-width: 760px;
      margin-top: 44px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .note-item {
      min-height: 116px;
      padding: 22px;
      background: var(--paper-soft);
      backdrop-filter: blur(8px);
    }

    .note-kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .note-title {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 750;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      transition: transform 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: var(--ink);
      color: #fff;
    }

    .button-secondary {
      background: rgba(248, 245, 238, 0.62);
    }

    .footer {
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer a {
      border-bottom: 1px solid transparent;
    }

    .footer a:hover {
      border-color: currentColor;
    }

    @media (max-width: 760px) {
      .page {
        padding: 22px;
      }

      .topbar,
      .footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        white-space: normal;
      }

      .hero {
        padding: 58px 0;
      }

      h1 {
        font-size: 42px;
      }

      .lead {
        font-size: 17px;
      }

      .note {
        grid-template-columns: 1fr;
      }

      .note-item {
        min-height: auto;
      }

      .actions,
      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Site header">
      <a class="brand" href="/" aria-label="Zipeng Blog">
        <img class="brand-mark" src="mylogos/favicon.png" alt="">
        <span>
          <span class="brand-name">Zipeng Blog</span>
          <span class="brand-subtitle">Notes, research and sketches</span>
        </span>
      </a>
      <div class="status" aria-label="Current status">
        <span class="status-dot" aria-hidden="true"></span>
        暂时关闭，内容归档中
      </div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <div class="eyebrow">Temporary Pause</div>
        <h1 id="page-title">Blog 正在施工</h1>
        <p class="lead">
          旧文章、图片和资料已经先收好，不会丢失。这个站点会暂停公开更新一段时间，
          等内容重新整理完，再以更清爽的方式回来。
        </p>

        <div class="note" aria-label="Archive notes">
          <div class="note-item">
            <div class="note-kicker">Archive</div>
            <div class="note-title">原有内容已保留在本地归档。</div>
          </div>
          <div class="note-item">
            <div class="note-kicker">Status</div>
            <div class="note-title">公开博客入口暂时关闭。</div>
          </div>
          <div class="note-item">
            <div class="note-kicker">Updated</div>
            <div class="note-title">2026.06.30</div>
          </div>
        </div>

        <div class="actions" aria-label="Links">
          <a class="button button-primary" href="https://github.com/ZP-Z" rel="noopener">GitHub</a>
          <a class="button button-secondary" href="https://www.researchgate.net/profile/Zipeng_Zhao3" rel="noopener">ResearchGate</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>© 2026 Zipeng Zhao. The archive is being reorganized.</span>
      <nav class="footer-links" aria-label="External links">
        <a href="https://github.com/ZP-Z" rel="noopener">GitHub</a>
        <a href="https://zp-z.github.io">zp-z.github.io</a>
      </nav>
    </footer>
  </main>
</body>
</html>
