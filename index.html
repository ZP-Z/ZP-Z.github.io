<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Gargantua — a black hole rendered live in the browser.">
  <title>Gargantua · Zipeng</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080c14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23dcd4e4' stroke-width='2'/%3E%3Cpath d='M3 22L29 10' stroke='%23e6cba5' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --space: #02040a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--space);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: rgba(255, 255, 255, 0.92);
      font-family: "Inter", "Helvetica Neue", "Segoe UI", "SF Pro Display", Roboto, sans-serif;
      background: var(--space);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #gargantua {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Static stand-in for browsers without WebGL. */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 75% 42%, rgba(148, 118, 70, 0.06), transparent 54%),
        radial-gradient(ellipse at 40% 0%, #081019, #020407 72%);
    }

    .fallback-disk {
      position: absolute;
      left: 75%;
      top: 42%;
      width: max(118vw, 148vh);
      height: max(118vw, 148vh);
      transform: translate(-50%, -50%) rotate(-22deg);
    }

    .fallback-disk::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      height: 44%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle,
        #020303 0 38%,
        #17130e 40%,
        #dcc69c 40.5%,
        #564125 41%,
        #d5ab75 44%,
        #fff4df 46%,
        #b98c50 49%,
        rgba(185, 129, 54, 0.16) 54%,
        rgba(124, 108, 84, 0.035) 63%,
        rgba(124, 108, 84, 0) 70%);
    }

    .fallback-disk::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 51%;
      width: 100%;
      height: 8%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(244, 235, 229, 0.97) 0%,
        rgba(224, 207, 186, 0.8) 18%,
        rgba(157, 130, 93, 0.40) 40%,
        rgba(114, 120, 134, 0) 70%);
      filter: blur(4px);
    }

    .no-webgl #gargantua {
      display: none;
    }

    .no-webgl .fallback {
      display: block;
    }

    .caption {
      position: fixed;
      left: clamp(24px, 5vw, 72px);
      bottom: clamp(24px, 5vh, 56px);
      z-index: 1;
      max-width: min(540px, 82vw);
      pointer-events: none;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.85);
    }

    .caption-eyebrow {
      color: rgba(255, 255, 255, 0.42);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .caption-title {
      margin: 14px 0 0;
      color: rgba(255, 255, 255, 0.95);
      font-size: clamp(30px, 3.4vw, 48px);
      font-weight: 200;
      letter-spacing: 0.22em;
      line-height: 1;
      text-transform: uppercase;
    }

    .caption-line {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.62);
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 300;
      letter-spacing: 0.07em;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .caption {
        max-width: 88vw;
      }

      .caption-title {
        letter-spacing: 0.16em;
      }

      .fallback-disk {
        left: 58%;
        top: 37%;
        width: 125vh;
        height: 125vh;
      }
    }
  </style>

<body>
  <canvas id="gargantua" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"><div class="fallback-disk"></div></div>

  <main class="caption" aria-label="Gargantua">
    <div class="caption-eyebrow">Event horizon</div>
    <h1 class="caption-title">Gargantua</h1>
    <p class="caption-line">Light bends. Time slows. Nothing escapes.</p>
  </main>

  <script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
  </script>

  <!-- Disk material: rendered every frame into a (azimuth x radius) texture with
       mipmaps, so the ray tracer can sample it filtered at any magnification. -->
  <script id="fs-disk" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uSize;
uniform float uTime;

const float TAU = 6.28318530717959;
const float R_IN = 2.0;
const float R_OUT = 12.5;

vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

// Gradient noise, periodic along y with integer period py (tiles around the ring).
float gnoise(vec2 p, float py) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float y0 = mod(i.y, py);
  float y1 = mod(i.y + 1.0, py);
  vec2 g00 = hash22(vec2(i.x, y0)) * 2.0 - 1.0;
  vec2 g10 = hash22(vec2(i.x + 1.0, y0)) * 2.0 - 1.0;
  vec2 g01 = hash22(vec2(i.x, y1)) * 2.0 - 1.0;
  vec2 g11 = hash22(vec2(i.x + 1.0, y1)) * 2.0 - 1.0;
  float n = mix(mix(dot(g00, f), dot(g10, f - vec2(1.0, 0.0)), u.x),
                mix(dot(g01, f - vec2(0.0, 1.0)), dot(g11, f - vec2(1.0, 1.0)), u.x), u.y);
  return clamp(0.5 + 0.9 * n, 0.0, 1.0);
}

float fbm(vec2 p, float py, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 6; k++) {
    if (k >= oct) break;
    v += a * gnoise(p, py);
    norm += a;
    p = p * 2.0 + vec2(17.0, 0.0);
    py *= 2.0;
    a *= 0.5;
  }
  return v / norm;
}

// Ridged multifractal: sharp, connected filaments.
float ridged(vec2 p, float py, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  float prev = 1.0;
  for (int k = 0; k < 6; k++) {
    if (k >= oct) break;
    float n = 1.0 - abs(2.0 * gnoise(p, py) - 1.0);
    n *= n;
    n *= mix(1.0, prev, 0.6);
    prev = n;
    v += a * n;
    norm += a;
    p = p * 2.0 + vec2(23.0, 0.0);
    py *= 2.0;
    a *= 0.55;
  }
  return v / norm;
}

// Gas in (radius, advected azimuth). Anisotropic noise stretches along the
// orbit: broad folds carry many fine, irregular threads with dark gaps.
// Radial warp stays small so the sheet reads as flowing silk, not clouds.
float material(float r, float psi, float seed, out float heat) {
  float warp = gnoise(vec2(r * 0.65 + seed, psi * (9.0 / TAU)), 9.0) - 0.5;
  float ripple = gnoise(vec2(r * 7.0 + seed, psi * (32.0 / TAU)), 32.0) - 0.5;
  float rw = r + warp * 0.32 + ripple * 0.045;
  float pw = psi + warp * 0.08;
  float broad = fbm(vec2(rw * 1.1 + seed, pw * (12.0 / TAU)), 12.0, 3);
  float folds = fbm(vec2(rw * 8.0 + seed + 7.0, pw * (48.0 / TAU)), 48.0, 3);
  float threads = fbm(vec2(rw * 38.0 + seed + 41.0, pw * (100.0 / TAU)), 100.0, 3);
  float fine = gnoise(vec2(rw * 92.0 + seed + 91.0, pw * (160.0 / TAU)), 160.0);
  float p = smoothstep(0.28, 0.74, broad);
  float ribbons = smoothstep(0.35, 0.68, folds);
  float fibers = smoothstep(0.40, 0.69, threads);
  float hair = smoothstep(0.47, 0.72, fine);
  float dense = 1.0 - smoothstep(R_IN + 0.4, R_IN + 3.0, r);
  float sheet = (0.055 + 0.14 * p + 0.25 * ribbons + 0.82 * fibers + 0.28 * hair)
              * (0.35 + 1.05 * p);
  float wisps = 0.018 + (0.28 * ribbons + 0.85 * fibers + 0.42 * hair)
                       * (0.20 + 0.80 * p) * (0.35 + 0.65 * ribbons);
  heat = clamp(0.6 * p + 0.4 * fibers, 0.0, 1.0);
  return mix(wisps, sheet, dense);
}

float omegaAt(float r) {
  return 1.25 * pow(r, -1.5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float phi = uv.x * TAU;
  float r = R_IN + uv.y * (R_OUT - R_IN);

  // Keplerian differential rotation. Two layers are cross-faded so the shear
  // never winds up without bound, with no brightness jump at the wrap.
  float omega = omegaAt(r);
  float omega0 = omegaAt(3.5);
  float P = 44.0;
  float tA = fract(uTime / P);
  float tB = fract(tA + 0.5);
  float sA = (tA - 0.5) * P;
  float sB = (tB - 0.5) * P;
  float wA = 1.0 - abs(tA - 0.5) * 2.0;
  float wB = 1.0 - wA;
  float base = phi - omega0 * uTime;
  float hA, hB;
  float nA = material(r, base - (omega - omega0) * sA, 0.0, hA);
  float nB = material(r, base - (omega - omega0) * sB + 2.1, 37.0, hB);
  // Linear blending keeps the radial brightness profile stable over the cycle.
  float m = wA * nA + wB * nB;
  float h = wA * hA + wB * hB;
  gl_FragColor = vec4(clamp(m, 0.0, 4.0) * 0.25, clamp(h, 0.0, 1.0), 0.0, 1.0);
}
  </script>

  <!-- Softens the disk texture: motion blur along the orbit that follows the
       local angular speed, plus a small radial soften. -->
  <script id="fs-diskblur" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D uTex;
uniform vec2 uSize;
uniform vec2 uDir;
uniform float uSigma;
const float R_IN = 2.0;
const float R_OUT = 12.5;
void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  float r = R_IN + uv.y * (R_OUT - R_IN);
  float sigma = uDir.x > 0.5 ? max(uSigma * pow(R_IN / r, 1.5), 0.35) : uSigma;
  vec2 stp = uDir / uSize * (sigma * 0.5);
  vec4 acc = vec4(0.0);
  float wsum = 0.0;
  for (int k = -6; k <= 6; k++) {
    float x = float(k) * 0.5;
    float w = exp(-0.5 * x * x);
    acc += texture2D(uTex, uv + stp * float(k)) * w;
    wsum += w;
  }
  gl_FragColor = acc / wsum;
}
  </script>

  <script id="fs-trace" type="x-shader/x-fragment">
precision highp float;
precision highp int;
varying vec2 vUv;
uniform vec2 uRes;
uniform vec2 uJitter;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform vec3 uCamFwd;
uniform float uFocal;
uniform vec2 uCenter;
uniform float uEnc;
uniform int uMaxSteps;
uniform float uDoppler;
uniform float uHaze;
uniform float uPxPerRad;
uniform sampler2D uDisk;
uniform vec2 uDiskSize;
uniform vec4 uPlanet;     // xyz centre, w radius (world units)
uniform vec3 uGalaxy;     // direction of a faint background galaxy

// Units: Schwarzschild radius rs = 1 (M = 0.5). Black hole at the origin,
// accretion disk in the y = 0 plane, camera a little above the plane.
const float PI = 3.14159265358979;
const float TAU = 6.28318530717959;
const float R_IN = 2.0;
const float R_OUT = 12.5;
const float B_SKIP = 14.0;
const float R_ESC = 30.0;
const int MAX_STEPS = 900;

#ifdef ES3
#define STEP_BOUND uMaxSteps
#define DISK_LOD(uv, l) textureLod(uDisk, uv, l)
#else
#define STEP_BOUND MAX_STEPS
#ifdef HAS_LOD
#define DISK_LOD(uv, l) texture2DLodEXT(uDisk, uv, l)
#else
#define DISK_LOD(uv, l) texture2D(uDisk, uv)
#endif
#endif

vec3 enc(vec3 c) {
  return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c;
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p, int oct) {
  float v = 0.0;
  float a = 0.5;
  float norm = 0.0;
  for (int k = 0; k < 5; k++) {
    if (k >= oct) break;
    v += a * vnoise(p);
    norm += a;
    p = p * 2.0 + vec2(31.0, 17.0);
    a *= 0.5;
  }
  return v / norm;
}

// Colour of the gas by radius; `shift` moves along the ramp so brighter
// filaments read hotter and dim gaps cooler.
vec3 palette(float r, float shift) {
  float t = clamp((r - R_IN) / (R_OUT - R_IN) + shift, 0.0, 1.0);
  vec3 c0 = vec3(1.00, 0.86, 0.66);   // hot ivory
  vec3 c1 = vec3(1.00, 0.68, 0.36);   // champagne gold
  vec3 c2 = vec3(0.95, 0.49, 0.20);   // amber filaments
  vec3 c3 = vec3(0.55, 0.25, 0.095);  // copper dust
  vec3 c4 = vec3(0.14, 0.075, 0.04);  // dark outer folds
  vec3 c5 = vec3(0.018, 0.030, 0.05); // faint blue-black rim
  if (t < 0.16) return mix(c0, c1, smoothstep(0.0, 0.16, t));
  if (t < 0.36) return mix(c1, c2, smoothstep(0.16, 0.36, t));
  if (t < 0.58) return mix(c2, c3, smoothstep(0.36, 0.58, t));
  if (t < 0.80) return mix(c3, c4, smoothstep(0.58, 0.80, t));
  return mix(c4, c5, smoothstep(0.80, 1.0, t));
}

vec2 diskUv(float r, float phi) {
  return vec2(phi / TAU + 0.5, (r - R_IN) / (R_OUT - R_IN));
}

// s: path length so far, turn: how far the ray has been bent (lensed images
// are compressed, so they need coarser texture samples).
vec3 diskSample(vec3 hit, vec3 dir, float s, float turn, out float alpha) {
  float r = length(hit.xz);
  float phi = atan(hit.z, hit.x);
  vec2 uv = diskUv(r, phi);

  float foot = s * 2.0 / (uFocal * uRes.y);
  float lodR = log2(max(foot / max(abs(dir.y), 0.4) * uDiskSize.y / (R_OUT - R_IN), 1e-4));
  float lodP = log2(max(foot * uDiskSize.x / (TAU * r), 1e-4));
  // Higher-order images (rays that went more than half way round) squeeze the
  // whole disk into a hair-thin ring, so they get a very coarse sample.
  float lod = max(max(lodR, lodP), 0.0) + clamp(turn / PI, 0.0, 1.0) * 0.85
            + smoothstep(2.6, 3.4, turn) * 5.0;
  vec4 tx = DISK_LOD(uv, lod);
  // Separate emissive filaments from the absorbing gaps without lifting the
  // whole disk. Filter first, then shape contrast to keep sub-pixel lines stable.
  float tex = 1.8 * pow(max(tx.r * 4.0, 0.0), mix(1.8, 1.35, smoothstep(2.0, 7.0, r)));
  float heat = tx.g;

  float edgeIn = smoothstep(R_IN, R_IN + 0.12, r);
  float edgeOut = 1.0 - smoothstep(R_OUT * 0.60, R_OUT, r);
  float prof = pow(R_IN / r, 1.85);
  float I = 2.1 * prof * edgeIn * edgeOut * tex;
  // Let threads modulate the hot inner sheet as well; a constant white floor
  // otherwise hides them when the highlights roll off.
  I += 1.05 * exp(-(r - R_IN) * 0.85) * edgeIn * (0.025 + 0.975 * tex);
  I *= mix(1.0, 0.55, smoothstep(2.4, 3.1, turn));

  // Relativistic beaming of the orbiting gas (photon travels along -dir).
  float beta = sqrt(0.5 / r);
  vec3 vel = vec3(-hit.z, 0.0, hit.x) / r * beta;
  float gam = 1.0 / sqrt(1.0 - beta * beta);
  float delta = 1.0 / (gam * (1.0 - dot(vel, -dir)));
  I *= pow(delta, 2.0 * uDoppler);
  vec3 col = palette(r, 0.045 - 0.10 * clamp(tex / 1.4, 0.0, 1.0));
  col = mix(col, vec3(1.0, 0.97, 0.90), heat * 0.12);
  float sh = mix(1.0, delta, uDoppler);
  col = mix(col, col * vec3(0.86, 0.95, 1.18), clamp((sh - 1.0) * 1.5, 0.0, 1.0));
  col = mix(col, col * vec3(1.12, 0.82, 0.62), clamp((1.0 - sh) * 1.5, 0.0, 1.0));

  alpha = 0.95 * edgeIn * (1.0 - smoothstep(R_OUT * 0.35, R_OUT * 0.85, r));
  return col * I;
}

vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

// Star colour classes: orange, warm white, white, blue-white.
vec3 starTint(float c) {
  if (c < 0.18) return vec3(1.00, 0.66, 0.38);
  if (c < 0.48) return vec3(1.00, 0.90, 0.76);
  if (c < 0.75) return vec3(0.96, 0.97, 1.00);
  return vec3(0.70, 0.81, 1.00);
}

vec3 octaDecode(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  vec3 d = vec3(uv.x, 1.0 - abs(uv.x) - abs(uv.y), uv.y);
  float t = max(-d.y, 0.0);
  d.x += d.x >= 0.0 ? -t : t;
  d.z += d.z >= 0.0 ? -t : t;
  return normalize(d);
}

// Offset from the ray direction to a star direction, in screen pixels and
// measured as a true angle, so stars stay round wherever they sit on the sky.
vec2 starOffset(vec3 d, vec3 sd) {
  vec3 diff = sd - d;
  vec3 ax = normalize(cross(d, vec3(0.0, 1.0, 0.0)) + vec3(1e-4, 0.0, 0.0));
  vec3 ay = cross(ax, d);
  return vec2(dot(diff, ax), dot(diff, ay)) * uPxPerRad;
}

// One layer of point stars: sharp core, a modest halo that grows with
// brightness, faint spikes on the brightest; the wide glow of bright stars
// comes from the screen-space bloom, like a camera. Brightness follows a
// steep power law, so most stars are tiny and a few dominate. Density is
// shaped per cell by a slow noise so stars gather in clusters and leave voids.
vec3 starLayer(vec3 d, vec2 unit, float cells, float dens, float gain, float seed, float clumpAmp) {
  vec2 uv = unit * cells;
  vec2 ci = floor(uv);
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o + seed;
      vec3 h = hash23(c);
      float dn = dens;
      if (clumpAmp > 0.0) {
        float clump = vnoise(c / 6.0 + seed * 0.37);
        dn *= mix(1.0, 0.15 + 1.8 * smoothstep(0.35, 0.75, clump), clumpAmp);
      }
      if (h.z < dn) {
        vec2 sp = starOffset(d, octaDecode((ci + o + h.xy) / cells));
        float d2 = dot(sp, sp);
        float q = hash21(c + 19.7);
        float br = gain * (0.03 + 3.0 * pow(q, 9.0));
        float sh = 1.8 + 4.5 * sqrt(min(br, 3.0) / 3.0);
        float core = exp(-d2 / 1.45);
        float halo = (0.05 + 0.10 * min(br, 1.0)) * exp(-d2 / (2.0 * sh * sh));
        col += starTint(hash21(c + 5.1)) * (br * (core + halo));
      }
    }
  }
  return col;
}

// `fade` removes the point stars for rays that were bent hard around the
// hole, where the whole sky gets squeezed into a thin ring and would sparkle.
vec3 starfield(vec3 d, float fade) {
  vec2 unit = octa(d);

  // Sparse field stars plus a faint, clumpy band; near-black in between.
  vec3 nb = normalize(vec3(0.8, 0.55, -0.35));
  float band = exp(-pow(dot(d, nb), 2.0) * 12.0);

  vec3 col = starLayer(d, unit, 120.0, 0.035, 0.3, 0.0, 0.5);
  col += starLayer(d, unit, 160.0, 0.09, 0.12 * band, 31.0, 1.0);
  col *= fade * 0.20;

  float n1 = fbm(unit * 9.0 + 3.0, 4);
  float n2 = fbm(unit * 23.0 + 11.0, 3);

        col += T * planetCol;

        if (rh > R_IN && rh < R_OUT) {

                   * smoothstep(R_IN, R_IN + 0.3, rr);

      col += T * starfield(vd, 1.0 - smoothstep(1.2, 2.2, turn));

    window.addEventListener('pointermove', function (e) {
      tmx = (e.clientX / window.innerWidth) * 2 - 1;
      tmy = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });
    window.addEventListener('pointerleave', function () { tmx = 0; tmy = 0; });
  }

  function norm(a) {
    var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function dist(a, b) {
    var x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2];
    return Math.sqrt(x * x + y * y + z * z);
  }

  // Sub-pixel jitter sequence for temporal anti-aliasing.
  function halton(i, b) {
    var f = 1, r = 0;
    while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); }
    return r;
  }
  var jitters = [];
  for (var ji = 1; ji <= 8; ji++) jitters.push([halton(ji, 2) - 0.5, halton(ji, 3) - 0.5]);

  function bindTarget(t) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
    gl.viewport(0, 0, t ? t.w : canvas.width, t ? t.h : canvas.height);
  }
  function bindTex(loc, tex, unit) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(loc, unit);
  }
  function draw() { gl.drawArrays(gl.TRIANGLES, 0, 3); }

  function blurPass(a, b, stride) {
    gl.useProgram(blur.p);
    gl.uniform1f(blur.u.uEnc, encMode);
    bindTarget(b);
    gl.uniform2f(blur.u.uDir, stride / a.w, 0);
    bindTex(blur.u.uTex, a.tex, 0);
    draw();
    bindTarget(a);
    gl.uniform2f(blur.u.uDir, 0, stride / a.h);
    bindTex(blur.u.uTex, b.tex, 0);
    draw();
  }

  function downsample(from, to, threshold) {
    gl.useProgram(bright.p);
    gl.uniform1f(bright.u.uEnc, encMode);
    gl.uniform1f(bright.u.uThreshold, threshold);
    gl.uniform2f(bright.u.uTexel, 1 / from.w, 1 / from.h);
    bindTarget(to);
    bindTex(bright.u.uTex, from.tex, 0);
    draw();
  }

  // Camera basis for an inclination above the disk plane, an azimuth around
  // the hole and a roll about the view axis.
  function cameraBasis(incl, az, roll) {
    var cp = [D * Math.cos(incl) * Math.sin(az), D * Math.sin(incl), D * Math.cos(incl) * Math.cos(az)];
    var fwd = norm([-cp[0], -cp[1], -cp[2]]);
    var right0 = norm(cross(fwd, [0, 1, 0]));
    var up0 = cross(right0, fwd);
    var cr = Math.cos(roll), sr = Math.sin(roll);
    return {
      cp: cp, fwd: fwd,
      right: [right0[0] * cr + up0[0] * sr, right0[1] * cr + up0[1] * sr, right0[2] * cr + up0[2] * sr],
      up: [-right0[0] * sr + up0[0] * cr, -right0[1] * sr + up0[1] * cr, -right0[2] * sr + up0[2] * cr]
    };
  }

  // A faint galaxy fixed in the sky, placed relative to the resting camera.
  var INCL0 = 7.5 * Math.PI / 180, ROLL0 = -22.0 * Math.PI / 180;
  var base = cameraBasis(INCL0, 0, ROLL0);
  var galaxyDir = norm([0, 1, 2].map(function (k) { return base.fwd[k] - base.right[k] * 0.95 + base.up[k] * 0.6; }));

  // A small planet on an inclined Keplerian orbit, above the luminous sheet
  // and just left of the upper arc in the resting composition.
  var PLANET_R = 5.4, PLANET_INC = 20.0 * Math.PI / 180;
  function planetAt(t) {
    var ph = Math.PI + t * 1.25 * Math.pow(PLANET_R, -1.5);
    return [PLANET_R * Math.cos(ph), -PLANET_R * Math.sin(PLANET_INC) * Math.cos(ph), PLANET_R * Math.sin(ph)];
  }

  var prevFwd = [0, 0, 0], prevUp = [0, 0, 0];

  function render(t) {
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;

    var deg = Math.PI / 180;
    var incl = INCL0 + (0.5 * Math.sin(t * 0.04) - my * 1.5) * deg;
    if (incl < 4 * deg) incl = 4 * deg;
    var az = t * 0.0015 + mx * 2.5 * deg;
    var cam = cameraBasis(incl, az, ROLL0);
    var cp = cam.cp, fwd = cam.fwd, right = cam.right, up = cam.up;
    if (skyOnly) { fwd = [-fwd[0], -fwd[1], -fwd[2]]; right = [-right[0], -right[1], -right[2]]; }   // debug: look away

    // Camera motion shortens the temporal history so nothing ghosts.
    var motion = dist(fwd, prevFwd) + dist(up, prevUp);
    prevFwd = fwd; prevUp = up;
    var alpha = histValid ? Math.min(0.9, 0.15 + motion * 900) : 1.0;

    var sc = targets.scene;
    var aspect = sc.w / sc.h;
    var focal = aspect < 1 ? 1.85 : Math.max(aspect * 1.30, 2.30);
    var centerFrac = aspect < 1 ? 0.37 : 0.42; // hole centre, fraction from the top
    var centerX = aspect < 1 ? 0.58 : 0.75;    // reveal the full arc and foreground flow
    if (zoomDbg) { focal *= 3.5; centerFrac = 0.5; centerX = 0.5; }   // debug: magnify the shadow edge
    var jit = jitters[frameIndex % jitters.length];

    // 0. Disk material texture for this instant: noise, orbital motion blur,
    //    radial soften, mipmaps.
    gl.useProgram(disk.p);
    bindTarget(diskTex.a);
    gl.uniform2f(disk.u.uSize, diskTex.w, diskTex.h);
    gl.uniform1f(disk.u.uTime, t);
    draw();
    gl.useProgram(diskBlur.p);
    gl.uniform2f(diskBlur.u.uSize, diskTex.w, diskTex.h);
    bindTarget(diskTex.b);
    gl.uniform2f(diskBlur.u.uDir, 1, 0);
    gl.uniform1f(diskBlur.u.uSigma, diskTex.w * 0.003);    // retain the breaks between fine orbital threads
    bindTex(diskBlur.u.uTex, diskTex.a.tex, 0);
    draw();
    bindTarget(diskTex.c);
    gl.uniform2f(diskBlur.u.uDir, 0, 1);
    gl.uniform1f(diskBlur.u.uSigma, 0.55);                // preserve radial separation between threads
    bindTex(diskBlur.u.uTex, diskTex.b.tex, 0);
    draw();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, diskTex.c.tex);
    gl.generateMipmap(gl.TEXTURE_2D);

    // 1. Geodesic trace into the HDR scene target.
    gl.useProgram(trace.p);
    bindTarget(sc);
    gl.uniform2f(trace.u.uRes, sc.w, sc.h);
    gl.uniform2f(trace.u.uJitter, jit[0], jit[1]);
    gl.uniform1f(trace.u.uTime, t);
    gl.uniform3f(trace.u.uCamPos, cp[0], cp[1], cp[2]);
    gl.uniform3f(trace.u.uCamRight, right[0], right[1], right[2]);
    gl.uniform3f(trace.u.uCamUp, up[0], up[1], up[2]);
    gl.uniform3f(trace.u.uCamFwd, fwd[0], fwd[1], fwd[2]);
    gl.uniform1f(trace.u.uFocal, focal);
    gl.uniform2f(trace.u.uCenter, centerX * 2 - 1, (1 - centerFrac) * 2 - 1);
    gl.uniform1f(trace.u.uEnc, encMode);
    gl.uniform1i(trace.u.uMaxSteps, maxSteps);
    gl.uniform1f(trace.u.uDoppler, 0.18);
    gl.uniform1f(trace.u.uHaze, 0.08);
    gl.uniform1f(trace.u.uPxPerRad, 0.5 * focal * sc.h);
    gl.uniform2f(trace.u.uDiskSize, diskTex.w, diskTex.h);
    var planetPos = planetAt(t);
    gl.uniform4f(trace.u.uPlanet, planetPos[0], planetPos[1], planetPos[2], 0.12);
    gl.uniform3f(trace.u.uGalaxy, galaxyDir[0], galaxyDir[1], galaxyDir[2]);
    bindTex(trace.u.uDisk, diskTex.c.tex, 0);
    draw();

    // 2. Temporal accumulation (anti-aliasing).
    var cur = targets.hist[histIndex];
    var next = targets.hist[1 - histIndex];
    gl.useProgram(resolve.p);
    bindTarget(next);
    gl.uniform1f(resolve.u.uAlpha, alpha);
    gl.uniform1f(resolve.u.uEnc, encMode);
    bindTex(resolve.u.uCur, sc.tex, 0);
    bindTex(resolve.u.uHist, cur.tex, 1);
    draw();
    histIndex = 1 - histIndex;
    histValid = true;
    frameIndex++;

    // 3. Bloom: close glow at 1/4, middle halo at 1/16, wide veil at 1/64.
    downsample(next, targets.b1a, 0.8);
    blurPass(targets.b1a, targets.b1b, 1.0);
    blurPass(targets.b1a, targets.b1b, 1.0);
    downsample(targets.b1a, targets.b2a, 0.16);
    blurPass(targets.b2a, targets.b2b, 1.5);
    blurPass(targets.b2a, targets.b2b, 1.5);
    downsample(targets.b2a, targets.b3a, 0.30);
    blurPass(targets.b3a, targets.b3b, 2.0);
    blurPass(targets.b3a, targets.b3b, 2.0);

    // 4. Composite, tone map, vignette, grain.
    gl.useProgram(composite.p);
    bindTarget(null);
    gl.uniform1f(composite.u.uTime, t);
    gl.uniform1f(composite.u.uEnc, encMode);
    gl.uniform1f(composite.u.uExposure, 1.05);
    gl.uniform1f(composite.u.uBloom, 1.0);
    gl.uniform1f(composite.u.uAberration, 0.00015);
    gl.uniform2f(composite.u.uTexel, 1 / next.w, 1 / next.h);
    bindTex(composite.u.uScene, next.tex, 0);
    bindTex(composite.u.uBloom1, targets.b1a.tex, 1);
    bindTex(composite.u.uBloom2, targets.b2a.tex, 2);
    bindTex(composite.u.uBloom3, targets.b3a.tex, 3);
    draw();
  }

  // ---- Loop: 60 fps cap, adaptive resolution, static mode ----
  var STATIC_FRAMES = 16;
  var staticFramesLeft = STATIC_FRAMES;
  var t0 = performance.now();
  var last = 0, lastDraw = 0, frameAvg = 16, frames = 0;
  var lost = false;

  function frame(now) {
    if (lost) return;
    requestAnimationFrame(frame);
    if (!targets || sizeChanged()) {
      if (!resize()) return;
      last = 0;
    }
    if (reduced) {
      // A converged still frame; re-rendered only when the viewport changes.
      if (staticFramesLeft > 0) { render(0); staticFramesLeft--; }
      return;
    }
    if (now - lastDraw < 15) return;
    if (last && now - last < 100) frameAvg = frameAvg * 0.9 + (now - last) * 0.1;
    last = now;
    lastDraw = now;
    frames++;
    if (frames > 90 && frames % 30 === 0 && frameAvg > 30 && quality > 0.35) {
      quality = Math.max(0.35, quality - 0.12);
      resize();
      frameAvg = 16;
    }
    render((now - t0) / 1000);
  }

  document.addEventListener('visibilitychange', function () { last = 0; });
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    lost = true;
    fail('WebGL context lost');
  });

  requestAnimationFrame(frame);

  if (/[?&]debug=1/.test(search)) {
    window.__bh = { gl: gl, targets: function () { return targets; }, disk: function () { return diskTex; }, render: render, hdr: hdr, isGL2: isGL2, quality: function () { return quality; } };
  }
})();
  </script>
</body>
</html>
