<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Zipeng Blog is temporarily under construction.">
  <title>Zipeng Blog 正在施工</title>
  <link rel="icon" href="mylogos/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --ink: rgba(255, 255, 255, 0.9);
      --soft: rgba(255, 255, 255, 0.68);
      --muted: rgba(255, 255, 255, 0.5);
      --faint: rgba(255, 255, 255, 0.3);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #f3c67c;
      --space: #02040a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--space);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Inter", "Helvetica Neue", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--space);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #gargantua {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Static stand-in for browsers without WebGL. */
    .fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      overflow: hidden;
      background: var(--space);
    }

    .fallback::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 44%;
      width: min(72vw, 820px);
      height: min(72vw, 820px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle,
        #000 0 26.5%,
        #fff7e6 27%,
        #ffd58f 28.5%,
        rgba(255, 170, 70, 0.55) 31%,
        rgba(255, 140, 50, 0.18) 36%,
        rgba(255, 120, 40, 0) 42%);
    }

    .fallback::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 45.5%;
      width: 110vw;
      height: min(16vw, 180px);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(255, 246, 228, 1) 0%,
        rgba(255, 205, 130, 0.9) 18%,
        rgba(255, 150, 70, 0.55) 40%,
        rgba(255, 120, 50, 0) 70%);
      filter: blur(4px);
    }

    .no-webgl #gargantua {
      display: none;
    }

    .no-webgl .fallback {
      display: block;
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 26px clamp(20px, 5vw, 72px) 22px;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.75);
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .brand-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .brand-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(6, 10, 20, 0.45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: var(--soft);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(243, 198, 124, 0.18), 0 0 14px rgba(243, 198, 124, 0.6);
      animation: pulse 3.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(243, 198, 124, 0.18), 0 0 14px rgba(243, 198, 124, 0.6); }
      50% { box-shadow: 0 0 0 7px rgba(243, 198, 124, 0.08), 0 0 22px rgba(243, 198, 124, 0.85); }
    }

    .hero {
      grid-row: 3;
      align-self: end;
      max-width: 660px;
      padding: 48px 0 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      display: block;
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, rgba(243, 198, 124, 0), var(--accent));
      content: "";
    }

    h1 {
      margin: 16px 0 0;
      font-size: clamp(36px, 5.2vw, 58px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.01em;
    }

    .lead {
      max-width: 560px;
      margin: 18px 0 0;
      color: var(--soft);
      font-size: 16px;
      line-height: 1.9;
    }

    .note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      max-width: 680px;
      margin-top: 32px;
    }

    .note-item {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .note-kicker {
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .note-title {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      grid-row: 4;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12.5px;
    }

    .credit {
      text-align: right;
    }

    @media (max-width: 760px) {
      .page {
        padding: 18px 20px 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-subtitle {
        display: none;
      }

      .status {
        padding: 7px 11px;
        font-size: 12px;
      }

      .page {
        background: linear-gradient(180deg,
          rgba(2, 4, 10, 0) 0%,
          rgba(2, 4, 10, 0) 48%,
          rgba(2, 4, 10, 0.72) 68%,
          rgba(2, 4, 10, 0.92) 100%);
      }

      .hero {
        padding: 36px 0 18px;
      }

      h1 {
        font-size: 34px;
      }

      .lead {
        margin-top: 14px;
        font-size: 14px;
        line-height: 1.75;
      }

      .note {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 22px;
      }

      .note-item {
        padding-top: 10px;
      }

      .note-kicker {
        font-size: 10px;
      }

      .note-title {
        font-size: 12px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .credit {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot {
        animation: none;
      }
    }
  </style>
  <noscript>
    <style>
      #gargantua { display: none; }
      .fallback { display: block; }
    </style>
  </noscript>
</head>

  <script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}

  <script id="fs-trace" type="x-shader/x-fragment">
precision highp float;
precision highp int;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamRight;
uniform vec3 uCamUp;
uniform vec3 uCamFwd;
uniform float uFocal;
uniform vec2 uCenter;
uniform float uEnc;
uniform int uMaxSteps;
uniform float uDoppler;
uniform float uHaze;

// Units: Schwarzschild radius rs = 1 (M = 0.5). Black hole at the origin,
// accretion disk in the y = 0 plane, camera slightly above the plane.
const float PI = 3.14159265358979;
const float R_IN = 2.3;
const float R_OUT = 12.0;
const float B_SKIP = 13.5;
const float R_ESC = 30.0;
const int MAX_STEPS = 460;

#ifdef ES3
#define STEP_BOUND uMaxSteps
#else
#define STEP_BOUND MAX_STEPS
#endif

vec3 enc(vec3 c) {
  return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c;
}

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 hash23(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

// Value noise, periodic along y with integer period py (so it tiles around the ring).
float vnoise(vec2 p, float py) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float y0 = mod(i.y, py);
  float y1 = mod(i.y + 1.0, py);
  float a = hash21(vec2(i.x, y0));
  float b = hash21(vec2(i.x + 1.0, y0));
  float c = hash21(vec2(i.x, y1));
  float d = hash21(vec2(i.x + 1.0, y1));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p, float py) {
  float v = 0.0;
  float a = 0.5;
  for (int k = 0; k < 4; k++) {
    v += a * vnoise(p, py);
    p = p * 2.0 + vec2(31.0, 0.0);
    py *= 2.0;
    a *= 0.5;
  }
  return v;
}

vec3 palette(float r) {
  float t = clamp((r - R_IN) / (R_OUT - R_IN), 0.0, 1.0);
  vec3 c0 = vec3(1.00, 0.90, 0.74);
  vec3 c1 = vec3(1.00, 0.64, 0.28);
  vec3 c2 = vec3(0.94, 0.36, 0.09);
  return t < 0.4 ? mix(c0, c1, t / 0.4) : mix(c1, c2, (t - 0.4) / 0.6);
}

// Keplerian differential rotation. Two noise layers are cross-faded so the
// shear never winds up without bound.
float streaks(float r, float phi) {
  float omega = 0.85 * pow(r, -1.5);
  float omega0 = 0.85 * pow(4.0, -1.5);
  float P = 60.0;
  float tA = fract(uTime / P);
  float tB = fract(uTime / P + 0.5);
  float sA = (tA - 0.5) * P;
  float sB = (tB - 0.5) * P;
  float wA = 1.0 - abs(tA - 0.5) * 2.0;
  float wB = 1.0 - wA;
  float base = phi + omega0 * uTime;
  float PY = 10.0;
  float k = PY / (2.0 * PI);
  float x = r * 4.5;
  float nA = fbm(vec2(x, (base + (omega - omega0) * sA) * k), PY);
  float nB = fbm(vec2(x + 53.0, (base + (omega - omega0) * sB) * k), PY);
  float n = 0.5 + (wA * (nA - 0.5) + wB * (nB - 0.5)) / sqrt(wA * wA + wB * wB);
  float m = clamp((n - 0.3) / 0.45, 0.0, 1.0);
  return 0.45 + 0.95 * m * sqrt(m);
}

vec3 diskSample(vec3 hit, vec3 dir, out float alpha) {
  float r = length(hit.xz);
  float phi = atan(hit.z, hit.x);
  float edgeIn = smoothstep(R_IN, R_IN + 0.12, r);
  float edgeOut = 1.0 - smoothstep(R_OUT * 0.5, R_OUT, r);
  float prof = pow(R_IN / r, 1.8);
  float I = 4.2 * prof * edgeIn * edgeOut * streaks(r, phi);

  // Relativistic beaming of the orbiting gas (photon travels along -dir).
  float beta = sqrt(0.5 / r);
  vec3 vel = vec3(hit.z, 0.0, -hit.x) / r * beta;
  float gam = 1.0 / sqrt(1.0 - beta * beta);
  float delta = 1.0 / (gam * (1.0 - dot(vel, -dir)));
  I *= pow(delta, 2.0 * uDoppler);
  vec3 col = palette(r);
  float s = mix(1.0, delta, uDoppler);
  col = mix(col, col * vec3(0.86, 0.95, 1.18), clamp((s - 1.0) * 1.5, 0.0, 1.0));
  col = mix(col, col * vec3(1.12, 0.82, 0.62), clamp((1.0 - s) * 1.5, 0.0, 1.0));

  alpha = 0.92 * edgeIn * edgeOut;
  return col * I;
}

vec2 octa(vec3 d) {
  d /= (abs(d.x) + abs(d.y) + abs(d.z));
  vec2 sgn = vec2(d.x >= 0.0 ? 1.0 : -1.0, d.z >= 0.0 ? 1.0 : -1.0);
  vec2 uv = d.y >= 0.0 ? d.xz : (1.0 - abs(d.zx)) * sgn;
  return uv * 0.5 + 0.5;
}

vec3 starfield(vec3 d) {
  vec2 uv = octa(d) * 150.0;
  vec2 ci = floor(uv);
  vec2 f = uv - ci;
  vec3 col = vec3(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 c = ci + o;
      vec3 h = hash23(c);
      if (h.z < 0.10) {
        vec2 sp = o + h.xy - f;
        float d2 = dot(sp, sp);
        float q = hash21(c + 19.7);
        float br = 0.05 + pow(q, 8.0) * 1.3;
        float sz = 0.035 + 0.02 * br;
        float g = exp(-d2 / (sz * sz));
        vec3 tint = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.9, 0.72), hash21(c + 5.1));
        col += tint * (br * g);
      }
    }
  }
  float band = 0.5 + 0.5 * d.y;
  col += vec3(0.004, 0.007, 0.013) * (0.4 + 0.6 * band);
  return col;
}

void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0 - uCenter;
  float aspect = uRes.x / uRes.y;
  vec3 dir = normalize(uCamFwd * uFocal + uCamRight * (ndc.x * aspect) + uCamUp * ndc.y);

  vec3 p = uCamPos;
  vec3 v = dir;
  float cd = dot(p, v);
  float b2 = dot(p, p) - cd * cd;
  float b = sqrt(max(b2, 0.0));

  vec3 col = vec3(0.0);
  float T = 1.0;

  if (b > B_SKIP) {
    // Far from the hole: weak-field deflection, applied analytically.
    float L = -cd;
    vec3 q = p + v * L;
    vec3 n = -q / b;
    float frac = 0.5 + L * (2.0 * L * L + 3.0 * b2) / (4.0 * pow(b2 + L * L, 1.5));
    float alpha = 2.0 / b * frac;
    col = starfield(normalize(v * cos(alpha) + n * sin(alpha)));
  } else {
    float h2 = b2;
    bool escaped = false;
    vec3 prev = p;
    for (int i = 0; i < STEP_BOUND; i++) {
#ifndef ES3
      if (i >= uMaxSteps) break;
#endif
      float r2 = dot(p, p);
      float r = sqrt(r2);
      if (r2 < 1.0) break;
      if (r > R_ESC && dot(p, v) > 0.0) { escaped = true; break; }

      float dt = clamp(r * 0.06, 0.02, 0.9);
      vec3 a = -1.5 * h2 * p / (r2 * r2 * r);
      v += a * dt;
      p += v * dt;

      if (prev.y * p.y < 0.0) {
        float t = prev.y / (prev.y - p.y);
        vec3 hit = mix(prev, p, t);
        float rh = length(hit.xz);
        if (rh > R_IN && rh < R_OUT) {
          float al;
          vec3 e = diskSample(hit, normalize(v), al);
          col += T * e;
          T *= 1.0 - al;
          if (T < 0.03) break;
        }
      }

      if (uHaze > 0.0) {
        float ay = abs(p.y);
        float rr = length(p.xz);
        float H = 0.06 + 0.05 * rr;
        if (ay < H && rr > R_IN * 0.85 && rr < R_OUT) {
          float dn = 1.0 - ay / H;
          dn *= dn;
          float pr = pow(R_IN / rr, 2.0)
                   * (1.0 - smoothstep(R_OUT * 0.5, R_OUT, rr))
                   * smoothstep(R_IN * 0.85, R_IN * 1.05, rr);
          col += T * palette(rr) * (dn * pr * uHaze * dt);
        }
      }
      prev = p;
    }
    if (escaped) col += T * starfield(normalize(v));
  }

  gl_FragColor = vec4(enc(col), 1.0);
}
  </script>

  <script id="fs-bright" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
uniform float uEnc;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c; }
void main() {
  vec3 s = dec(texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb)
         + dec(texture2D(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb);
  s *= 0.25;
  float l = max(max(s.r, s.g), s.b);
  float k = max(l - uThreshold, 0.0) / max(l, 1e-4);
  gl_FragColor = vec4(enc(s * k), 1.0);
}
  </script>

  <script id="fs-blur" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
uniform float uEnc;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 enc(vec3 c) { return uEnc > 0.5 ? sqrt(max(c, 0.0) / 12.0) : c; }
void main() {
  vec2 o1 = uDir * 1.3846153846;
  vec2 o2 = uDir * 3.2307692308;
  vec3 c = dec(texture2D(uTex, vUv).rgb) * 0.2270270270;
  c += (dec(texture2D(uTex, vUv + o1).rgb) + dec(texture2D(uTex, vUv - o1).rgb)) * 0.3162162162;
  c += (dec(texture2D(uTex, vUv + o2).rgb) + dec(texture2D(uTex, vUv - o2).rgb)) * 0.0702702703;
  gl_FragColor = vec4(enc(c), 1.0);
}
  </script>

  <script id="fs-composite" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform float uTime;
uniform float uEnc;
uniform float uExposure;
uniform float uBloom;
vec3 dec(vec3 c) { return uEnc > 0.5 ? c * c * 12.0 : c; }
vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
void main() {
  vec3 c = dec(texture2D(uScene, vUv).rgb);
  vec3 b1 = dec(texture2D(uBloom1, vUv).rgb);
  vec3 b2 = dec(texture2D(uBloom2, vUv).rgb);
  c += (b1 * 0.32 + b2 * 0.18) * uBloom;
  c *= uExposure;
  float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
  vec3 tmL = c * (aces(vec3(lum)).x / max(lum, 1e-4));
  c = clamp(mix(aces(c), tmL, 0.45), 0.0, 1.0);
  vec2 q = vUv - 0.5;
  c *= 1.0 - 0.42 * smoothstep(0.12, 0.62, dot(q, q));
  c = pow(c, vec3(1.0 / 2.2));
  c += (hash(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) * (2.5 / 255.0);
  gl_FragColor = vec4(c, 1.0);
}
  </script>

  <script>
(function () {
  'use strict';

  var canvas = document.getElementById('gargantua');
  var root = document.documentElement;
  var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
  var reduced = mq('(prefers-reduced-motion: reduce)');
  var coarse = mq('(pointer: coarse)');
  var mobile = coarse || window.innerWidth < 768;

  function fail(msg) {
    root.classList.add('no-webgl');
    if (window.console && msg) console.warn('[gargantua] ' + msg);
  }

  var opts = {
    alpha: false, antialias: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: false,
    powerPreference: 'high-performance'
  };
  var gl = null;
  var isGL2 = false;
  try {
    gl = canvas.getContext('webgl2', opts);
    if (gl) {
      isGL2 = true;
    } else {
      gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    }
  } catch (e) {
    gl = null;
  }
  if (!gl) { fail('WebGL unavailable'); return; }

  // ---- HDR render targets (half float when the platform can render to them) ----
  var hdrInternal = null, hdrType = null;
  if (isGL2) {
    if (gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float')) {
      hdrInternal = gl.RGBA16F;
      hdrType = gl.HALF_FLOAT;
    }
  } else {
    var he = gl.getExtension('OES_texture_half_float');
    var hl = gl.getExtension('OES_texture_half_float_linear');
    gl.getExtension('EXT_color_buffer_half_float');
    if (he && hl) {
      hdrInternal = gl.RGBA;
      hdrType = he.HALF_FLOAT_OES;
    }
  }
  var hdr = hdrType !== null && !/[?&]ldr=1/.test(window.location.search);

  function makeTarget(w, h) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (hdr) {
      gl.texImage2D(gl.TEXTURE_2D, 0, hdrInternal, w, h, 0, gl.RGBA, hdrType, null);
    } else {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    }
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return { tex: tex, fb: fb, w: w, h: h, ok: ok };
  }

  function freeTarget(t) {
    gl.deleteFramebuffer(t.fb);
    gl.deleteTexture(t.tex);
  }

  if (hdr) {
    var probe = makeTarget(4, 4);
    if (!probe.ok) hdr = false;
    freeTarget(probe);
  }
  var encMode = hdr ? 0.0 : 1.0;

  // ---- Shaders ----
  function src(id) { return document.getElementById(id).textContent; }

  function prep(source, isFrag) {
    if (!isGL2) return source;
    var head = '#version 300 es\n#define ES3 1\n';
    if (isFrag) {
      head += 'precision highp float;\nprecision highp int;\n#define varying in\n#define texture2D texture\nout vec4 fragColor;\n#define gl_FragColor fragColor\n';
    } else {
      head += '#define attribute in\n#define varying out\n';
    }
    return head + source;
  }

  function compile(type, source) {
    var s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || 'shader compile failed');
    }
    return s;
  }

  var vertSrc = prep(src('vs'), false);
  function program(fragId) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, prep(src(fragId), true)));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p) || 'program link failed');
    }
    var u = {};
    var n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) {
      var info = gl.getActiveUniform(p, i);
      u[info.name] = gl.getUniformLocation(p, info.name);
    }
    return { p: p, u: u };
  }

  var trace, bright, blur, composite;
  try {
    trace = program('fs-trace');
    bright = program('fs-bright');
    blur = program('fs-blur');
    composite = program('fs-composite');
  } catch (e) {
    fail(e.message);
    return;
  }

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  // ---- Targets / resolution ----
  var quality = mobile ? 0.45 : 0.7;
  var maxSteps = mobile ? 320 : 460;
  var targets = null;
  var needsRender = true;

  function destroyTargets() {
    if (!targets) return;
    for (var k in targets) if (targets.hasOwnProperty(k)) freeTarget(targets[k]);
    targets = null;
  }

  var lastW = 0, lastH = 0, lastDpr = 0;

  function viewportSize() {
    var w = canvas.clientWidth || window.innerWidth || document.documentElement.clientWidth || 0;
    var h = canvas.clientHeight || window.innerHeight || document.documentElement.clientHeight || 0;
    return [w, h, Math.min(window.devicePixelRatio || 1, 2)];
  }

  function sizeChanged() {
    var vs = viewportSize();
    return vs[0] !== lastW || vs[1] !== lastH || vs[2] !== lastDpr;
  }

  function resize() {
    var vs = viewportSize();
    var cw = vs[0], ch = vs[1], dpr = vs[2];
    if (cw < 2 || ch < 2) {
      // Layout not ready yet (hidden tab, zero-size viewport); try again next frame.
      destroyTargets();
      return false;
    }
    lastW = cw; lastH = ch; lastDpr = dpr;
    var outScale = Math.min(dpr, 1.5);
    canvas.width = Math.max(1, Math.round(cw * outScale));
    canvas.height = Math.max(1, Math.round(ch * outScale));

    var tw = Math.round(cw * dpr * quality);
    var th = Math.round(ch * dpr * quality);
    var cap = mobile ? 700000 : 1500000;
    if (tw * th > cap) {
      var s = Math.sqrt(cap / (tw * th));
      tw = Math.round(tw * s);
      th = Math.round(th * s);
    }
    tw = Math.max(32, tw);
    th = Math.max(32, th);

    destroyTargets();
    var q1w = Math.max(1, tw >> 2), q1h = Math.max(1, th >> 2);
    var q2w = Math.max(1, tw >> 4), q2h = Math.max(1, th >> 4);
    targets = {
      scene: makeTarget(tw, th),
      b1a: makeTarget(q1w, q1h),
      b1b: makeTarget(q1w, q1h),
      b2a: makeTarget(q2w, q2h),
      b2b: makeTarget(q2w, q2h)
    };
    needsRender = true;
    return true;
  }

  // ---- Camera / interaction ----
  var D = 24.0;
  var tmx = 0, tmy = 0, mx = 0, my = 0;
  if (!coarse && !reduced) {
    window.addEventListener('pointermove', function (e) {
      tmx = (e.clientX / window.innerWidth) * 2 - 1;
      tmy = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });
    window.addEventListener('pointerleave', function () { tmx = 0; tmy = 0; });
  }

  function norm(a) {
    var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }

  function bindTarget(t) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
    gl.viewport(0, 0, t ? t.w : canvas.width, t ? t.h : canvas.height);
  }
  function bindTex(loc, tex, unit) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(loc, unit);
  }
  function draw() { gl.drawArrays(gl.TRIANGLES, 0, 3); }

  function blurPass(a, b, stride) {
    gl.useProgram(blur.p);
    gl.uniform1f(blur.u.uEnc, encMode);
    bindTarget(b);
    gl.uniform2f(blur.u.uDir, stride / a.w, 0);
    bindTex(blur.u.uTex, a.tex, 0);
    draw();
    bindTarget(a);
    gl.uniform2f(blur.u.uDir, 0, stride / a.h);
    bindTex(blur.u.uTex, b.tex, 0);
    draw();
  }

  function downsample(from, to, threshold) {
    gl.useProgram(bright.p);
    gl.uniform1f(bright.u.uEnc, encMode);
    gl.uniform1f(bright.u.uThreshold, threshold);
    gl.uniform2f(bright.u.uTexel, 1 / from.w, 1 / from.h);
    bindTarget(to);
    bindTex(bright.u.uTex, from.tex, 0);
    draw();
  }

  function render(t) {
    mx += (tmx - mx) * 0.05;
    my += (tmy - my) * 0.05;

    var incl = (10.0 + 1.2 * Math.sin(t * 0.07) - my * 2.5) * Math.PI / 180;
    if (incl < 3 * Math.PI / 180) incl = 3 * Math.PI / 180;
    var az = (mx * 5.0) * Math.PI / 180;
    var cp = [D * Math.cos(incl) * Math.sin(az), D * Math.sin(incl), D * Math.cos(incl) * Math.cos(az)];
    var fwd = norm([-cp[0], -cp[1], -cp[2]]);
    var right = norm(cross(fwd, [0, 1, 0]));
    var up = cross(right, fwd);

    var sc = targets.scene;
    var aspect = sc.w / sc.h;
    var focal = Math.max(aspect * 1.8, 1.45);
    var centerFrac = aspect < 1 ? 0.36 : 0.42;   // hole centre, fraction from the top

    // 1. Geodesic trace into the HDR scene target.
    gl.useProgram(trace.p);
    bindTarget(sc);
    gl.uniform2f(trace.u.uRes, sc.w, sc.h);
    gl.uniform1f(trace.u.uTime, t);
    gl.uniform3f(trace.u.uCamPos, cp[0], cp[1], cp[2]);
    gl.uniform3f(trace.u.uCamRight, right[0], right[1], right[2]);
    gl.uniform3f(trace.u.uCamUp, up[0], up[1], up[2]);
    gl.uniform3f(trace.u.uCamFwd, fwd[0], fwd[1], fwd[2]);
    gl.uniform1f(trace.u.uFocal, focal);
    gl.uniform2f(trace.u.uCenter, 0, (1 - centerFrac) * 2 - 1);
    gl.uniform1f(trace.u.uEnc, encMode);
    gl.uniform1i(trace.u.uMaxSteps, maxSteps);
    gl.uniform1f(trace.u.uDoppler, 0.3);
    gl.uniform1f(trace.u.uHaze, 0.22);
    draw();

    // 2. Bloom: tight glow at 1/4 res, wide glow at 1/16 res.
    downsample(sc, targets.b1a, 1.1);
    blurPass(targets.b1a, targets.b1b, 1.0);
    blurPass(targets.b1a, targets.b1b, 1.0);
    downsample(targets.b1a, targets.b2a, 0.0);
    blurPass(targets.b2a, targets.b2b, 1.5);
    blurPass(targets.b2a, targets.b2b, 1.5);

    // 3. Composite, tone map, vignette, grain.
    gl.useProgram(composite.p);
    bindTarget(null);
    gl.uniform1f(composite.u.uTime, t);
    gl.uniform1f(composite.u.uEnc, encMode);
    gl.uniform1f(composite.u.uExposure, 1.0);
    gl.uniform1f(composite.u.uBloom, 1.0);
    bindTex(composite.u.uScene, sc.tex, 0);
    bindTex(composite.u.uBloom1, targets.b1a.tex, 1);
    bindTex(composite.u.uBloom2, targets.b2a.tex, 2);
    draw();
  }

  // ---- Loop with adaptive resolution ----
  var t0 = performance.now();
  var last = 0, frameAvg = 16, frames = 0;

  var lost = false;

  function frame(now) {
    if (lost) return;
    requestAnimationFrame(frame);
    if (!targets || sizeChanged()) {
      if (!resize()) return;
      last = 0;
    }
    var t = reduced ? 0 : (now - t0) / 1000;
    if (reduced) {
      // Static frame only; re-rendered when the viewport changes.
      if (needsRender) { render(t); needsRender = false; }
      return;
    }
    if (last && now - last < 100) frameAvg = frameAvg * 0.9 + (now - last) * 0.1;
    last = now;
    frames++;
    if (frames > 60 && frames % 30 === 0 && frameAvg > 33 && quality > 0.3) {
      quality = Math.max(0.3, quality - 0.08);
      resize();
      frameAvg = 16;
    }
    render(t);
  }

  document.addEventListener('visibilitychange', function () { last = 0; });
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    lost = true;
    fail('WebGL context lost');
  });

  requestAnimationFrame(frame);
})();
